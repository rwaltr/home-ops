---
# Rendered by `op inject` during bootstrap (kyz:bootstrap task).
# Contains ONLY op:// references — never real values, safe to commit.
#
#   op inject -i k8s/kyz/bootstrap/secrets/secret.yaml | kubectl apply --server-side -f -
#
# Requires OP_SERVICE_ACCOUNT_TOKEN in the environment and a 1Password item
# named "1password" in the "home-ops" vault with fields OP_SESSION_JSON and
# OP_CONNECT_TOKEN (from creating a Connect server in the 1Password app).
apiVersion: v1
kind: Secret
metadata:
  name: onepassword-connect-secret
  namespace: external-secrets
stringData:
  1password-credentials.json: op://home-ops/1password/OP_SESSION_JSON
  token: op://home-ops/1password/OP_CONNECT_TOKEN
