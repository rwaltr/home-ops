---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# 1Password Connect server — the vault↔cluster bridge. Its credentials
# (credentials json + token) are seeded by ../secrets/secret.yaml via
# `op inject` BEFORE this file runs (see the kyz:bootstrap task).

releases:
  - name: onepassword-connect
    namespace: external-secrets
    chart: oci://ghcr.io/bjw-s-labs/helm/app-template
    version: 4.3.0
    values:
      - values/onepassword-connect.yaml.gotmpl
    hooks:
      - # ClusterSecretStore is CRD-backed; wait for ESO to serve the CRD
        command: kubectl
        args:
          - wait
          - --for=create
          - crd/clustersecretstores.external-secrets.io
          - --timeout=2m
        events:
          - postsync
        showlogs: true
      - command: kubectl
        args:
          - apply
          - --server-side
          - --force-conflicts
          - --filename=../manifests/clustersecretstore.yaml
        events:
          - postsync
        showlogs: true
