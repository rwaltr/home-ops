---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# FluxInstance — the operator's CRD, so the operator must be live first.
# The hook waits for the CRD to be served before helm renders anything.

releases:
  - name: flux-instance
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    version: 0.58.0
    values:
      - values/flux-instance.yaml.gotmpl
    hooks:
      - command: kubectl
        args:
          - wait
          - --for=create
          - crd/fluxinstances.fluxcd.controlplane.io
          - --timeout=2m
        events:
          - presync
        showlogs: true
