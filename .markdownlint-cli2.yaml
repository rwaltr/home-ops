---
# .agents/skills/openspec-* are generated by the openspec CLI (`openspec init` /
# `openspec update`) and fail MD036/MD031. Hand-fixing them is undone on the next
# regeneration, so they are excluded here. This lives in a cli2 config because
# markdownlint only reads `ignores` from that file — putting it in the --config
# rules file silently drops the whole rule set.
ignores:
  - ".agents/**"
