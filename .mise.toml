# mise configuration for home-ops infrastructure tooling
min_version = "2026.8.0"

[settings]
# Show elapsed time for each task on `mise run`
task.timings = true

[tools]
# Core infrastructure tools
"github:FiloSottile/age" = "latest"
# No `exe` option: mise 2026.10.21 removed it from the github backend ("option
# `exe` is not used by the github backend"), which fails `mise install` outright
# and so breaks the Lint workflow's setup step for every PR. The release tarball
# already contains a single `flux` binary, so no option is needed — verified
# installing and running flux 2.10.0 with mise 2026.10.21.
"github:fluxcd/flux2" = "latest"
kubectl = "latest"
sops = "latest"
terraform = "latest"
terragrunt = "latest"
"github:derailed/k9s" = "latest"
"github:k0sproject/k0sctl" = "latest"

# Additional useful tools for this repo
go = "latest"
"github:coreos/butane" = "latest"
"github:home-operations/flate" = "latest"
helm = "latest"
helmfile = "latest"
kustomize = "latest"
# usage CLI: shell completions for task args/flags (#USAGE specs)
"github:jdx/usage" = "latest"
helm-diff = { version = "latest", bin = "diff", bin_path = "diff/bin", rename_exe = "helm-diff" }

# Linters & formatters (onedr0p/home-operations style, run via mise tasks:
#   `mise run lint` / `mise run fmt` — see .mise/tasks/lint/)
actionlint = "latest"
zizmor = "latest"
oxfmt = "0.71.0"
shellcheck = "latest"
"npm:markdownlint-cli2" = "latest"
"pipx:yamllint" = "latest"
"pipx:pre-commit" = "latest"

# Tasks are file-based tasks in .mise/tasks/ — `mise tasks` is the index.
# Shared shell helpers live in .mise/lib/common.sh.
# Tips:
#   - View dependency tree: mise tasks deps flatcar:bootstrap
#   - Watch for changes:   mise watch flatcar:build
#   - Pass extra args to underlying tools: mise run tf:plan cloudflare -target=x
#   - Destructive tasks (flatcar:clean, tf:apply) prompt for confirmation

[env]
_.file = ".env"
