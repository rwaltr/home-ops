description: Paperless API endpoint and token used by the migrated Paperless pipelines.
schema:
  type: object
  order:
    - base_url
    - api_token
  required:
    - base_url
    - api_token
  properties:
    base_url:
      type: string
      default: http://paperless-app.default.svc.cluster.local:8000
    api_token:
      type: string
      password: true
