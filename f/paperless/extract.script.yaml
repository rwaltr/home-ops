summary: Fill missing financial fields on Invoice and Receipt documents from OCR text.
description: Idempotent Paperless API pipeline. Reads OCR content, calls
  intel-vl through agentgateway, and fills blank Total, Payment method, and
  Reference fields.
lock: "!inline f/paperless/extract.script.lock"
job_token_scopes:
  - resources:read:f/paperless/paperless_api
  - resources:read:f/ai/agentgateway
  - variables:read:f/paperless/paperless_api_token
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    action:
      type: string
      description: ""
      default: run
      originalType: string
    document_id:
      type: integer
      description: ""
      default: null
    dry_run:
      type: boolean
      default: false
    max_docs:
      type: integer
      default: 25
  required: []
