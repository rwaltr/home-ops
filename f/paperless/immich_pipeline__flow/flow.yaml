summary: Classify recent Immich assets, upload approved documents, and enrich
  Paperless metadata.
description: Polling version of the Immich receipt pipeline. Decision state is
  stored in Immich tags; uploads are sent directly to Paperless through its API.
value:
  modules:
    - id: classify
      summary: Classify undecided Immich photos and tag useful documents.
      value:
        type: script
        input_transforms:
          dry_run:
            type: javascript
            expr: flow_input.dry_run
          max_pages:
            type: javascript
            expr: flow_input.max_pages
          max_vision_calls:
            type: javascript
            expr: flow_input.max_vision_calls
          stage:
            type: static
            value: classify
          window_hours:
            type: javascript
            expr: flow_input.window_hours
        path: f/paperless/immich_bridge
    - id: upload
      summary: Upload newly approved, unsent documents to Paperless.
      value:
        type: script
        input_transforms:
          dry_run:
            type: javascript
            expr: flow_input.dry_run
          stage:
            type: static
            value: send
        path: f/paperless/immich_bridge
    - id: enrich
      summary: Add vision metadata to Paperless documents joined by filename.
      value:
        type: script
        input_transforms:
          dry_run:
            type: javascript
            expr: flow_input.dry_run
          stage:
            type: static
            value: enrich
        path: f/paperless/immich_bridge
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    dry_run:
      type: boolean
      default: false
    max_pages:
      type: integer
      default: 5
    max_vision_calls:
      type: integer
      default: 20
    window_hours:
      type: number
      default: 0.25
  required: []
