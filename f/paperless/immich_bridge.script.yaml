summary: Classify recent Immich photos and send approved documents to Paperless.
description: Polling version of the Immich bridge. Uses the existing tags as
  idempotency state, uploads directly to Paperless's API, and enriches matching
  documents.
lock: "!inline f/paperless/immich_bridge.script.lock"
job_token_scopes:
  - resources:read:f/paperless/immich_api
  - resources:read:f/paperless/paperless_api
  - resources:read:f/ai/agentgateway
  - variables:read:f/paperless/immich_api_key
  - variables:read:f/paperless/paperless_api_token
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    dry_run:
      type: boolean
      default: false
    max_pages:
      type: integer
      default: 5
    max_vision_calls:
      type: integer
      default: 20
    stage:
      type: string
      default: all
      originalType: string
    window_hours:
      type: number
      default: 24
  required: []
