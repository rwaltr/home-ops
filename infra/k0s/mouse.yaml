# k0sctl config for 'mouse' — production single-node cluster on Flatcar.
# Validated against flatcar-test (2026-08-13):
#   - NO --profile flatcar (breaks controller+worker; unknown worker profile
#     wedges the kubelet install — silent, k0s crash-loops on controller lease)
#   - provider: custom + kubeProxy disabled for Cilium kube-proxy replacement
#
# VM testing: the flatcar:k0s task renders a copy with the VM's ssh address.
# Bare metal: mouse is static 10.10.0.10 (MAC-matched networkd unit).
apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: mouse
spec:
  hosts:
    - role: controller+worker
      installFlags:
        - --disable-components=coredns,metrics-server
      ssh:
        address: 10.10.0.10
        port: 22
        user: rwaltr
        keyPath: ~/.ssh/id_ed25519
      noTaints: true
      files:
        - name: spgel.toml
          data: |
            version = 3

            [plugins."io.containerd.cri.v1.images".registry]
            config_path = "/etc/containerd/certs.d"

            [plugins."io.containerd.cri.v1.images"]
            discard_unpacked_layers = false
          dstDir: /etc/k0s/containerd.d/
          perm: "0644"
  k0s:
    version: v1.36.3+k0s.2
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: mouse
      spec:
        api:
          sans:
            - 10.10.0.10
            - fdad:207a:f1ab:10::10
            - 10.10.100.10 # kube-api LB VIP (Cilium BGP)
            - fdad:207a:f1ab:100::10 # kube-api LB VIP v6 (Cilium BGP)
            - k8s.kyz.rwalt.pro # future external-dns hostname
        network:
          provider: custom # Cilium installed out-of-band (mouse:k0s task / phase 2 helmfile)
          kubeProxy:
            disabled: true # Cilium kubeProxyReplacement
          dualStack:
            enabled: true
            IPv6podCIDR: fdad:207a:f1ab:244::/108 # in the :244 block (10.244 mirror). k0s hardcodes
              # node-cidr-mask-size-ipv6=117; kcm requires cluster prefix ≥ /101 (117-16)
            IPv6serviceCIDR: fdad:207a:f1ab:96::/108 # mirrors 10.96.0.0/12
