---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
#
# Kopia PVC backup for one app. Instantiated from the app's ks.yaml:
#
#   spec:
#     components:
#       - ../../../../components/kopiur/backup
#     postBuild:
#       substitute:
#         APP: sonarr
#         PVC: sonarr
#
# APP            SnapshotPolicy/SnapshotSchedule name — match the app's ks.yaml name.
# PVC            The app's PersistentVolumeClaim. Verify with `kubectl get pvc -n <ns>`;
#                it is NOT always `<app>` and NOT always `<app>-config`.
# KOPIUR_RUNAS   uid/gid the mover reads the PVC as. Override only for apps that do
#                not run as 1000:1000.
#
# copyMethod: Direct is mandatory on openebs-hostpath (no CSI snapshots): the mover
# reads the live PVC, so snapshots are crash-consistent, not point-in-time. DBs need
# beforeSnapshot hooks or app-native dumps.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  repository:
    kind: ClusterRepository
    name: cluster-kopia
  sources:
    - pvc:
        name: ${PVC}
      sourcePathStrategy: PvcName
  copyMethod: Direct
  mover:
    # The mover must be able to READ the app's PVC. Apps whose data is mode 0700
    # and owned by a non-1000 uid get EACCES from a default-UID mover, which
    # surfaces as a failed snapshot rather than a permission error.
    securityContext:
      runAsUser: ${KOPIUR_RUNAS:=1000}
      runAsGroup: ${KOPIUR_RUNAS:=1000}
    podSecurityContext:
      fsGroup: ${KOPIUR_RUNAS:=1000}
  retention:
    keepLatest: 7
    keepDaily: 14
    keepWeekly: 4
  # Opt-in: with no `verification` block the operator never verifies anything and
  # `status.lastVerified` stays empty forever, so a backup that cannot be read
  # back looks exactly like one that can. Two tiers:
  #
  #   quick — `kopia snapshot verify` at blob level. Cheap; every stored blob is
  #           read and hash-checked. This is the tier that catches silent
  #           corruption or a half-written upload.
  #   deep  — a scratch RESTORE of the latest snapshot into a throwaway volume,
  #           which is the only thing that actually proves restorability. It runs
  #           weekly because it costs a full read of the source.
  #
  # `successExpr` is not optional in spirit: without it a verify that read 0 files
  # reports success. It fails the run unless the verify covered something and no
  # error occurred.
  #
  # `stats.files` (quick) is kopia's manifest `stats.fileCount`, which counts only
  # the files READ IN FULL during that run. A source that has not changed since the
  # previous snapshot is served entirely from kopia's local cache, which increments
  # `cachedFiles` and not `fileCount` — so a healthy snapshot of a static tree
  # reports `stats.files == 0` and fails `stats.files > 0` on EVERY quick verify,
  # forever, with the run itself perfectly clean. `stats.bytes` is accumulated on
  # the cache-hit path as well, so it is the reliable coverage signal for `quick`.
  # The `deep` tier hardcodes `stats.bytes` to 0 and reports the real restored file
  # count instead, so it keeps checking `restored.files`.
  #
  # Scratch sizing: `capacity` provisions an ephemeral PVC per deep run (deleted
  # with the Job) and must hold the restored data, which cannot exceed the source
  # PVC's own capacity — the largest backed-up PVC here is 10Gi, so 20Gi is above
  # every current source. A source larger than this fails the deep verify loudly;
  # raise the value rather than removing it (omitting it falls back to a
  # node-ephemeral emptyDir, which is unbounded against the node's disk).
  verification:
    quick:
      schedule:
        cron: "${KOPIUR_VERIFY_QUICK_CRON:=H 4 * * *}"
        jitter: 30m
      maxErrors: 0 # stop at the first error rather than reporting a summary
    deep:
      schedule:
        cron: "${KOPIUR_VERIFY_DEEP_CRON:=H 5 * * 0}"
        jitter: 1h
      capacity: "${KOPIUR_VERIFY_SCRATCH:=20Gi}"
      # Required here: the scratch volume is a generic ephemeral PVC and
      # `capacity` alone leaves its storageClassName empty, which resolves to
      # the cluster default — and this cluster deliberately has none
      # (`hostpathClass.isDefaultClass: false`). The PVC then never binds
      # ("no storage class is set"), the Job sits Pending, and
      # KubeJobNotCompleted pages once per app per run.
      storageClassName: "${KOPIUR_VERIFY_SCRATCH_CLASS:=openebs-hostpath}"
    successExpr: "(tier == 'quick' ? stats.bytes > 0 : restored.files > 0) && stats.errors == 0"
    verifyFilesPercent: 10 # fraction of each file `quick` reads in full
