---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: smartctl-exporter
spec:
  dependsOn:
    - name: kube-prometheus-stack # the PrometheusRule/ServiceMonitor CRDs
      namespace: o11y
  interval: 1h
  path: ./infra/k8s/kyz/apps/o11y/smartctl-exporter/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: o11y
  # wait: true on purpose — the chart runs a privileged DaemonSet, so a
  # PodSecurity rejection or an unschedulable node should surface as a failed
  # Kustomization instead of a silently missing exporter that the dashboard
  # cannot tell apart from "no data yet".
  wait: true
