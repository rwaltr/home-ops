---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The credential Alertmanager uses to wake the Hermes alert-feed job
# (POST /api/jobs/<id>/run on the gateway API server, bearer-authenticated).
#
# Deliberately the SAME 1Password field the Hermes pod itself authenticates
# against (item `hermes`, field `api_server_key`): the integration mints no new
# credential, needs no owner step, and the value is never rendered into git or
# into the agent's context. The v1 route parser only needs the token to match.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-alert-trigger
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-alert-trigger
  data:
    - secretKey: API_SERVER_KEY
      remoteRef:
        key: hermes
        property: api_server_key
