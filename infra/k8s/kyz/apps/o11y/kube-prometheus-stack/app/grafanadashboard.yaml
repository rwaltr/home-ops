# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
#
# ZFS pool + ARC. Live data on mouse: node-exporter's `zfs` collector is enabled by
# default and reads /proc/spl/kstat/zfs, so node_zfs_zpool_state reports tank online.
# Complements the `zfs-rules` alert in the kube-prometheus-stack HelmRelease.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: zfs
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  url: https://grafana.com/api/dashboards/24987/revisions/2/download
