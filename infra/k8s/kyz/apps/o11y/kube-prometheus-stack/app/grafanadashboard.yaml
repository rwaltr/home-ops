---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
#
# Cluster-baseline dashboards from grafana.com, complementing the ~26 that the
# kube-prometheus-stack chart already ships (grafana.operator.dashboardsConfigMapRefEnabled).
# The chart's set covers nodes/apiserver/coredns/PV at a summary level; these are the
# richer "Kubernetes / Views" + System mixins plus the two that have no chart equivalent
# (node-exporter-full, zfs).
#
# `inputName` MUST match the token the dashboard JSON actually uses — it is not always
# DS_PROMETHEUS. Verified per pinned revision:
#   15757-15762, 19105, 24987 -> DS_PROMETHEUS   (also declared in __inputs)
#   11454                     -> DS_OPENSHIFT_PROMETHEUS
#   1860                      -> ds_prometheus   (lowercase, and it has no __inputs block)
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kubernetes-api-server
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  url: https://grafana.com/api/dashboards/15761/revisions/21/download
