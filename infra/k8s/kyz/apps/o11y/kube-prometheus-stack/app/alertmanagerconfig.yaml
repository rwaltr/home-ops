---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
# Referenced by kube-prometheus-stack alertmanagerSpec.alertmanagerConfiguration.name
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
  namespace: o11y
spec:
  route:
    receiver: pushover
    repeatInterval: 12h
    # Policy: every alert must be actionable, or removed (docs/adr/0018,
    # openspec/specs/alert-routing). Blackhole is only for alerts that must keep
    # firing because something depends on them; each route says what. A
    # non-actionable alert is removed at its rule, not routed here.
    routes:
      # Never actionable on its own: the chart ships it to drive an inhibit rule
      # that mutes info-severity alerts. This config loads no such rule (only the
      # two under inhibitRules below), so today it inhibits nothing. Open item
      # under the policy: wire that inhibit rule or disable the alert at source.
      - receiver: blackhole
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      # Must fire: always-on dead-man heartbeat. Kept firing so a heartbeat
      # consumer can be wired to it; until then nothing reads it.
      - receiver: blackhole
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
      - receiver: pushover
        matchers:
          - name: severity
            value: critical
            matchType: =
    groupBy:
      - alertname
      - job
    groupInterval: 5m
    groupWait: 1m

  inhibitRules:
    - equal:
        - alertname
        - namespace
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =
    # One node-memory event raises two warnings on the same node:
    # NodeMemoryMajorPagesFaults (the node is actively paging) and
    # NodeMemoryHighUtilization (the pressure behind it). The rule above cannot
    # collapse them -- it requires an equal alertname and both are
    # severity=warning -- so a single event cost two pages against a budget of
    # three paging alerts per day. Keyed on the shared `instance` instead, so the
    # operational symptom still pages and its softer companion is suppressed.
    # Directed on purpose: the pair must not inhibit each other in both
    # directions, which would be circular and resolve arbitrarily.
    - equal:
        - instance
      sourceMatch:
        - name: alertname
          value: NodeMemoryMajorPagesFaults
          matchType: =
      targetMatch:
        - name: alertname
          value: NodeMemoryHighUtilization
          matchType: =

  receivers:
    - name: blackhole
    - name: pushover
      pushoverConfigs:
        - html: true
          message: |-
            {{- range .Alerts }}
              {{- if ne .Annotations.description "" }}
                {{ .Annotations.description }}
              {{- else if ne .Annotations.summary "" }}
                {{ .Annotations.summary }}
              {{- else if ne .Annotations.message "" }}
                {{ .Annotations.message }}
              {{- else }}
                Alert description not available
              {{- end }}
              {{- if gt (len .Labels.SortedPairs) 0 }}
                <small>
                  {{- range .Labels.SortedPairs }}
                    <b>{{ .Name }}:</b> {{ .Value }}
                  {{- end }}
                </small>
              {{- end }}
            {{- end }}
          monospace: false
          priority: |-
            {{ if eq .Status "firing" }}1{{ else }}0{{ end }}
          sendResolved: true
          sound: gamelan
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
          ttl: 86400s
          token:
            name: alertmanager-secret
            key: ALERTMANAGER_PUSHOVER_TOKEN
          userKey:
            name: alertmanager-secret
            key: PUSHOVER_USER_KEY
          urlTitle: View in Alertmanager
