---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
# Referenced by kube-prometheus-stack alertmanagerSpec.alertmanagerConfiguration.name
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
  namespace: o11y
spec:
  route:
    receiver: pushover
    repeatInterval: 12h
    routes:
      - receiver: blackhole
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      # always-firing heartbeat; no heartbeat consumer exists — don't push it
      - receiver: blackhole
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
      # Unmanic is a deliberately CPU-saturating background transcoder
      # (priorityClass unmanic-background), so CPU alerts about that pod are
      # expected steady state, not signal. Blackholed, not silenced: they stay
      # visible in the Alertmanager UI and in Prometheus, they just do not page.
      # Matches the pod name prefix, so it covers any CPU alert now or later
      # (CPUThrottlingHigh today) for the pod, whatever its hash suffix.
      - receiver: blackhole
        matchers:
          - name: pod
            value: unmanic-.*
            matchType: =~
          - name: alertname
            value: .*CPU.*
            matchType: =~
      # Teletran's alert feed. Every alert that survived the blackholes above also
      # wakes the Hermes alert-triage job (POST /api/jobs/<id>/run on the gateway
      # API server, bearer-authenticated from the ExternalSecret below), which
      # reads Prometheus and Alertmanager itself and reports to the phone. The
      # webhook body is deliberately ignored: Alertmanager cannot sign a Hermes
      # webhook route (it sends no HMAC header), and the trigger only has to be a
      # wake-up -- the job re-derives the state, which is the whole method in the
      # cluster-alert-review skill. `continue: true` keeps matching siblings, so
      # the two routes below still deliver pushover's copy.
      - receiver: hermes
        continue: true
      - receiver: pushover
        matchers:
          - name: severity
            value: critical
            matchType: =
      # Explicit catch-all. Today this case is handled by the root receiver's
      # `pushover`, and Alertmanager only falls back to the root when NO child
      # matched -- the `hermes` child above matches everything, so without this
      # route warning-grade alerts would silently stop reaching pushover. Net
      # behaviour of the pushover path is unchanged: one notification per alert,
      # critical or not.
      - receiver: pushover
    groupBy:
      - alertname
      - job
    groupInterval: 5m
    groupWait: 1m

  inhibitRules:
    - equal:
        - alertname
        - namespace
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =
    # One node-memory event raises two warnings on the same node:
    # NodeMemoryMajorPagesFaults (the node is actively paging) and
    # NodeMemoryHighUtilization (the pressure behind it). The rule above cannot
    # collapse them -- it requires an equal alertname and both are
    # severity=warning -- so a single event cost two pages against a budget of
    # three paging alerts per day. Keyed on the shared `instance` instead, so the
    # operational symptom still pages and its softer companion is suppressed.
    # Directed on purpose: the pair must not inhibit each other in both
    # directions, which would be circular and resolve arbitrarily.
    - equal:
        - instance
      sourceMatch:
        - name: alertname
          value: NodeMemoryMajorPagesFaults
          matchType: =
      targetMatch:
        - name: alertname
          value: NodeMemoryHighUtilization
          matchType: =

  receivers:
    - name: blackhole
    # The alert feed's consumer: wakes the Hermes alert-triage cron job, which
    # reports to the phone. The URL carries a fixed job id — that id is the cron
    # job's identity in the Hermes store, so recreating the job means updating
    # this line (a trigger against a missing id gets a 404 and shows up as a
    # failed notification in the Alertmanager log, never as a silent drop).
    - name: hermes
      webhookConfigs:
        - url: http://hermes.default.svc.cluster.local:8642/api/jobs/aa9524f0f633/run
          httpConfig:
            authorization:
              type: Bearer
              # Same value the Hermes API server validates against; see
              # externalsecret-hermes-trigger.yaml.
              credentials:
                name: hermes-alert-trigger
                key: API_SERVER_KEY
          # One wake-up per firing group is the point. The resolved follow-up
          # would only run the triage again to report that something stopped.
          sendResolved: false
    - name: pushover
      pushoverConfigs:
        - html: true
          message: |-
            {{- range .Alerts }}
              {{- if ne .Annotations.description "" }}
                {{ .Annotations.description }}
              {{- else if ne .Annotations.summary "" }}
                {{ .Annotations.summary }}
              {{- else if ne .Annotations.message "" }}
                {{ .Annotations.message }}
              {{- else }}
                Alert description not available
              {{- end }}
              {{- if gt (len .Labels.SortedPairs) 0 }}
                <small>
                  {{- range .Labels.SortedPairs }}
                    <b>{{ .Name }}:</b> {{ .Value }}
                  {{- end }}
                </small>
              {{- end }}
            {{- end }}
          monospace: false
          priority: |-
            {{ if eq .Status "firing" }}1{{ else }}0{{ end }}
          sendResolved: true
          sound: gamelan
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
          ttl: 86400s
          token:
            name: alertmanager-secret
            key: ALERTMANAGER_PUSHOVER_TOKEN
          userKey:
            name: alertmanager-secret
            key: PUSHOVER_USER_KEY
          urlTitle: View in Alertmanager
