---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mqtt-probe
spec:
  dependsOn:
    - name: kube-prometheus-stack # the PrometheusRule CRD + the node-exporter textfile collector
      namespace: o11y
  interval: 1h
  path: ./infra/k8s/kyz/apps/o11y/mqtt-probe/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: o11y
  # wait: true — the CronJob only runs on schedule, so without it a rejected pod
  # would look like a healthy Kustomization with no metrics and no alerts.
  wait: true
