---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
#
# Reads the MQTT broker's retained state every 10 minutes and writes it as
# node-exporter textfile metrics. See ./configmap.yaml for why the retained store
# is the thing worth watching, and ./prometheusrule.yaml for the alerts.
#
# Not privileged: the only host access is the node-exporter textfile directory,
# which is a bind mount, not a device. runAsUser 0 is required because that
# directory is created root-owned by node-exporter (the same reason
# o11y/zfs-vdev-exporter writes there as root).
#
# nodeName is pinned because the textfile path is node-local; a second node would
# need its own instance, as with zfs-vdev-exporter.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mqtt-probe
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mqtt-probe
        spec:
          restartPolicy: Never
          nodeName: mouse
          tolerations:
            - operator: Exists
          securityContext:
            runAsUser: 0
          containers:
            - name: probe
              # Same image as the broker, so mosquitto_sub matches the broker it
              # reads. Renovate bumps both from the same upstream tag.
              image: mirror.gcr.io/eclipse-mosquitto:2.0.22
              command:
                - /bin/sh
                - /scripts/mqtt-probe.sh
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  # Bounded like every other system component here — no disk swap
                  # (2026-09-24 memory audit, REFACTOR_PLANS.md).
                  memory: 64Mi
              volumeMounts:
                - name: textfile
                  mountPath: /textfile
                - name: scripts
                  mountPath: /scripts
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: textfile
              hostPath:
                # Shared with node-exporter's --collector.textfile.directory.
                path: /var/lib/node_exporter/textfile
                type: DirectoryOrCreate
            - name: scripts
              configMap:
                name: mqtt-probe
                defaultMode: 0755
            - name: tmp
              emptyDir: {}
