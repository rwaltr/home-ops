---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zfs-vdev-exporter
data:
  zfs-vdev.sh: |
    #!/bin/sh
    # Emit ZFS vdev health as node-exporter textfile-collector metrics.
    #
    # Why this exists: node_exporter's zfs collector only reports *pool* state.
    # A faulted vdev member leaves node_zfs_zpool_state{state="online"} at 1, so
    # the ZfsUnexpectedPoolState alert in the kube-prometheus-stack HelmRelease
    # cannot fire for it — which is exactly what happened to sde1 on 2026-09-22.
    # `zpool status` is the only place that carries per-vdev state, and it has to
    # run on the host (libzfs needs the host /dev/zfs).
    #
    # Writes atomically (tmp + mv) so node-exporter never reads a partial file.
    # If this stops running, zfs_vdev_textfile_timestamp_seconds freezes and
    # ZfsVdevMetricsStale fires — a frozen textfile is otherwise invisible.
    set -eu

    OUT=/textfile/zfs_vdev.prom
    TMP="${OUT}.tmp"

    {
      printf '# HELP zfs_vdev_online 1 if the vdev member is ONLINE, 0 otherwise\n'
      printf '# TYPE zfs_vdev_online gauge\n'
      printf '# HELP zfs_vdev_state_info Always 1; the vdev state is in the label\n'
      printf '# TYPE zfs_vdev_state_info gauge\n'
      printf '# HELP zfs_vdev_errors Cumulative I/O error counters from zpool status\n'
      printf '# TYPE zfs_vdev_errors gauge\n'
      printf '# HELP zfs_vdev_textfile_timestamp_seconds Unix time this file was written\n'
      printf '# TYPE zfs_vdev_textfile_timestamp_seconds gauge\n'

      chroot /host zpool status -P | awk '
        /^[[:space:]]*pool:/                 { pool = $2; in_config = 0; next }
        /^[[:space:]]*NAME[[:space:]]+STATE/ { in_config = 1; next }
        /^[[:space:]]*errors:/               { in_config = 0; next }
        !in_config                           { next }
        NF >= 5 && $1 ~ /^(\/dev\/|raidz|mirror|draid)/ {
          printf "zfs_vdev_online{pool=\"%s\",vdev=\"%s\"} %d\n", pool, $1, ($2 == "ONLINE" ? 1 : 0)
          printf "zfs_vdev_state_info{pool=\"%s\",vdev=\"%s\",state=\"%s\"} 1\n", pool, $1, $2
          if ($1 ~ /^\/dev\//) {
            printf "zfs_vdev_errors{pool=\"%s\",vdev=\"%s\",type=\"read\"} %s\n", pool, $1, $3
            printf "zfs_vdev_errors{pool=\"%s\",vdev=\"%s\",type=\"write\"} %s\n", pool, $1, $4
            printf "zfs_vdev_errors{pool=\"%s\",vdev=\"%s\",type=\"cksum\"} %s\n", pool, $1, $5
          }
        }
      '

      printf 'zfs_vdev_textfile_timestamp_seconds %s\n' "$(date +%s)"
    } > "$TMP"

    mv "$TMP" "$OUT"
