---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Single-node OTLP trace store. Jaeger-compatible queries use Grafana's built-in
# datasource. OTLP/gRPC stays cluster-internal on port 4317.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-traces
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-traces
  interval: 1h
  values:
    server:
      fullnameOverride: victoria-traces
      persistentVolume:
        enabled: true
        size: 10Gi
        storageClassName: openebs-hostpath
      retentionPeriod: 14d
      retentionDiskSpaceUsage: 8GiB
      extraArgs:
        otlpGRPCListenAddr: :4317
        # The gRPC listener defaults to TLS and refuses to start without a cert
        # and key. The port is cluster-internal, matching the plaintext Envoy
        # and agentgateway exporters.
        otlpGRPC.tls: false
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 512Mi
      serviceMonitor:
        enabled: true
