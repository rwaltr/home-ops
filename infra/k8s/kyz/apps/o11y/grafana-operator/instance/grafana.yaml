---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "false"
    # Kanidm as an OIDC provider. Grafana's generic OAuth client has no discovery
    # field, so every endpoint is named explicitly — taken from the client's own
    # discovery document, which is the authoritative source for them:
    # https://idm.waltr.tech/oauth2/openid/grafana/.well-known/openid-configuration
    #
    # Note the authorization endpoint is `/ui/oauth2`, not `/oauth2/authorise`.
    #
    # The client id and secret come from the Secret the kaniop operator minted for
    # the KanidmOAuth2Client in this namespace; they are the only two values that
    # cannot live in this file.
    auth.generic_oauth:
      enabled: "true"
      name: Kanidm
      scopes: openid profile email groups
      auth_url: https://idm.waltr.tech/ui/oauth2
      token_url: https://idm.waltr.tech/oauth2/token
      api_url: https://idm.waltr.tech/oauth2/openid/grafana/userinfo
      # `preferShortUsername` is set on the client, so this is `rwaltr`, not
      # `rwaltr@waltr.tech`.
      login_attribute_path: preferred_username
      # Kaniop enforces PKCE on its clients by default, and Kanidm refuses an
      # authorization request without a code challenge:
      #
      #   No PKCE code challenge was provided with client in enforced PKCE mode
      #   Unable to authorise - error: invalid_request
      #
      # Grafana supports PKCE, so it is enabled here rather than switching the
      # client out of enforced PKCE mode.
      use_pkce: "true"
      # Kanidm's `groups` claim is a flat array holding both each group's UUID and
      # its SPN, so the SPN form is matched. Both spellings are checked because the
      # built-in groups are the ones that matter here and their SPN form has varied
      # across versions. Everything unmatched is a Viewer rather than an error.
      role_attribute_path: contains(groups[*], 'grafana_admins@waltr.tech') && 'Admin' || contains(groups[*], 'idm_admins@waltr.tech') && 'Admin' || contains(groups[*], 'idm_admins') && 'Admin' || 'Viewer'
      allow_sign_up: "true"
    auth.anonymous:
      enabled: "true"
    log:
      mode: console
    metrics:
      enabled: "true"
    tracing.opentelemetry:
      sampler_type: probabilistic
      sampler_param: "0.1"
    tracing.opentelemetry.otlp:
      address: tempo.o11y.svc.cluster.local:4317
      insecure: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
    security:
      angular_support_enabled: "true"
    server:
      enable_gzip: "true"
      # Without this Grafana builds absolute URLs — including the OAuth redirect
      # URI — from its own listen address, so the callback went out as
      # `http://localhost:3000/login/generic_oauth` and could never match the
      # client's registered redirect URL.
      root_url: https://grafana.waltr.tech
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-password-secret
                      key: GF_SECURITY_ADMIN_PASSWORD
                # Minted by kaniop for the KanidmOAuth2Client in this namespace.
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: grafana-kanidm-oauth2-credentials
                      key: CLIENT_ID
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-kanidm-oauth2-credentials
                      key: CLIENT_SECRET
                - name: GF_PLUGINS_PREINSTALL_SYNC
                  value: victoriametrics-logs-datasource@0.34.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  httpRoute:
    # Annotations go on the generated HTTPRoute's METADATA, not in its spec —
    # the CRD has no `spec.httpRoute.spec.annotations` and the apply is rejected
    # outright if you put them there.
    metadata:
      annotations:
        # Listed on the Homepage dashboard — see docs/homepage.md.
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Grafana
        gethomepage.dev/description: Dashboards
        gethomepage.dev/group: Monitoring
        gethomepage.dev/icon: grafana.png
    spec:
      hostnames:
        - grafana.waltr.tech
      parentRefs:
        - name: envoy-internal
          namespace: network
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
      storageClassName: openebs-hostpath
  disableDefaultSecurityContext: All
