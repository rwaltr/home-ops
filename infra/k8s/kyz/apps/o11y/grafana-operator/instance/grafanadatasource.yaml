---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
spec:
  # Pinned so other datasources reference a readable UID instead of the operator's
  # generated one (Tempo's service map needs it). spec.uid is immutable, so this
  # value can only be added by deleting and re-creating this resource once —
  # `kubectl delete grafanadatasource -n o11y prometheus` and let Flux recreate it.
  uid: prometheus
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    type: prometheus
    name: prometheus
    access: proxy
    isDefault: true
    url: http://prometheus-operated.o11y.svc.cluster.local:9090
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: alertmanager
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    type: alertmanager
    name: alertmanager
    access: proxy
    jsonData:
      implementation: prometheus
    url: http://alertmanager-operated.o11y.svc.cluster.local:9093
---
# VictoriaLogs links its structured trace/span fields to the Tempo datasource.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoria-logs
spec:
  uid: victoria-logs
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    type: victoriametrics-logs-datasource
    name: victoria-logs
    access: proxy
    url: http://victoria-logs.o11y.svc.cluster.local:9428
    jsonData:
      derivedFields:
        - name: trace.id
          matcherType: label
          matcherRegex: trace.id
          url: "${__value.raw}"
          urlDisplayLabel: View trace
          datasourceUid: tempo
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: "${__value.raw}"
          urlDisplayLabel: View trace
          datasourceUid: tempo
        # agentgateway writes `trace.id=<hex>` into plain-text access logs, so
        # there is no structured field to match. Extract it from the message.
        - name: agentgateway trace.id
          matcherType: regex
          matcherRegex: 'trace\.id=([a-f0-9]{32})'
          url: "${__value.raw}"
          urlDisplayLabel: View trace
          datasourceUid: tempo
---
# Tempo's HTTP API provides TraceQL, service graphs and Traces Drilldown.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: tempo
spec:
  uid: tempo
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    type: tempo
    name: Tempo
    access: proxy
    url: http://tempo.o11y.svc.cluster.local:3200
    jsonData:
      nodeGraph:
        enabled: true
      search:
        hide: false
      serviceMap:
        datasourceUid: prometheus
      tracesToLogsV2:
        datasourceUid: victoria-logs
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        # agentgateway writes `trace.id=<hex>` into the message text, not as a
        # field, so a field filter would match nothing. Search the text.
        customQuery: true
        query: '"${__trace.traceId}"'
        filterByTraceID: false
        filterBySpanID: false
