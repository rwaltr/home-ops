---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
spec:
  chartRef:
    kind: OCIRepository
    name: grafana-operator
  interval: 1h
  values:
    # Was BestEffort at 30d p99 86Mi (7 restarts in the window).
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 512Mi
    dashboard:
      enabled: true
    serviceMonitor:
      enabled: true
