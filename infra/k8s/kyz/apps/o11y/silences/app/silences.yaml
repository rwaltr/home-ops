---
# A dated silence covering expected rollout churn while the bjw-s parity series
# lands (metrics-server, chaski, it-tools, silence-operator, agentgateway,
# cliproxyapi, MCP servers). It is also this operator's end-to-end proof: the
# comment is what the alert-triage agent reads in /api/v2/silences to learn that
# a firing alert is in-flight work rather than a new incident.
#
# Self-expiring, and therefore disposable: delete this file once the series is
# done rather than letting an expired Silence CR accumulate in git.
#
# Extended 2026-11-16: the first window closed before the MCP block landed, so
# there was a 13-hour gap in which a firing alert would have reached triage with
# no record that the work was deliberate. The MCP servers named in the matcher
# were always the last block of the series; only the end date was wrong.
# The two companion CRs below carry the same window as this one — they were
# written against the earlier end date and re-aligned on rebase so all three
# retire together.
#
# Scope caveat: this CR matches on `pod` only, so it silences exactly the alerts
# that carry that app's pod name (KubePodNotReady, KubePodCrashLooping, ...). The
# kube-state-metrics-derived alerts about the same app do NOT carry a `pod` label
# naming the app — they carry `pod=kube-state-metrics-<hash>` plus `deployment`
# or `name` — so they escape this silence and page. The two CRs below exist to
# cover those shapes; keep the three lists in step.
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: bjw-s-parity-deploys
spec:
  matchers:
    - name: pod
      matchType: =~
      value: >-
        metrics-server-.*|chaski-.*|it-tools-.*|silence-operator-.*|agentgateway-.*|cliproxyapi-.*|flux-mcp-.*|kubectl-mcp-.*|kubesearch-mcp-.*|home-assistant-mcp-.*|mikrotik-mcp-.*
  startsAt: "2026-11-14T18:00:00Z"
  endsAt: "2026-11-23T06:00:00Z"
---
# Deployment-scoped view of the same in-flight series: KubeDeploymentReplicasMismatch
# and KubeDeploymentRolloutStuck label the app as `deployment` (a bare name, not a
# pod prefix), with `namespace` pointing at the app's namespace and `pod` at the
# kube-state-metrics pod itself. Matchers combine with AND, so `deployment` alone is
# enough to keep this narrow — an AND with `pod=kube-state-metrics-.*` would only
# re-state what the deployment name already pins.
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: bjw-s-parity-deployment-scoped
spec:
  matchers:
    - name: deployment
      matchType: =~
      value: >-
        metrics-server|chaski|it-tools|silence-operator|agentgateway|cliproxyapi|flux-mcp|kubectl-mcp|kubesearch-mcp|home-assistant-mcp|mikrotik-mcp
  startsAt: "2026-11-14T18:00:00Z"
  endsAt: "2026-11-23T06:00:00Z"
---
# HelmRelease-scoped view. `HelmReleaseReconciliationFailure` labels the object as
# `name` (the HelmRelease name) plus `customresource_kind: HelmRelease`, and
# reports the *object's* namespace in `exported_namespace` while the `namespace`
# label stays `o11y` because kube-state-metrics is the exporter — which is why a
# namespace matcher would miss it. Pinning `customresource_kind` keeps this CR to
# HelmRelease alerts only rather than any alert that happens to use `name`.
apiVersion: observability.giantswarm.io/v1alpha2
kind: Silence
metadata:
  name: bjw-s-parity-helmreleases
spec:
  matchers:
    - name: name
      matchType: =~
      value: >-
        metrics-server|chaski|it-tools|silence-operator|agentgateway|cliproxyapi|flux-mcp|kubectl-mcp|kubesearch-mcp|home-assistant-mcp|mikrotik-mcp
    - name: customresource_kind
      matchType: =
      value: HelmRelease
  startsAt: "2026-11-14T18:00:00Z"
  endsAt: "2026-11-23T06:00:00Z"
