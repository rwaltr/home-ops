---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Fluent Bit tails container stdout from the node and forwards it to VictoriaLogs.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
spec:
  chartRef:
    kind: OCIRepository
    name: fluent-bit
  interval: 1h
  values:
    fullnameOverride: fluent-bit
    kind: DaemonSet
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 96Mi
    # Cluster-wide metadata lookup needs pods and namespaces only. Do not grant
    # node, event, or secret access.
    rbac:
      create: true
      nodeAccess: false
      eventsAccess: false
    tolerations:
      - operator: Exists
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    # k0s uses containerd, so omit the chart's Docker-specific hostPath.
    daemonSetVolumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: etcmachineid
        hostPath:
          path: /etc/machine-id
          type: File
    daemonSetVolumeMounts:
      - name: varlog
        mountPath: /var/log
      - name: etcmachineid
        mountPath: /etc/machine-id
        readOnly: true
    testFramework:
      enabled: false
    # The buffer is memory-only. A collector restart can lose the small in-flight
    # queue, but filesystem buffering would need another hostPath on the OS disk.
    config:
      # Flush and Log_Level stay literal. The chart's values for them are only
      # consumed by its default service string, which this override replaces.
      service: |
        [SERVICE]
            Daemon Off
            Flush 1
            Log_Level info
            Parsers_File /fluent-bit/etc/parsers.conf
            Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
            HTTP_Server On
            HTTP_Listen 0.0.0.0
            HTTP_Port {{ .Values.metricsPort }}
            Health_Check On
      inputs: |
        [INPUT]
            Name tail
            Path /var/log/containers/*.log
            multiline.parser docker, cri
            Tag kube.*
            Mem_Buf_Limit 2MB
            Skip_Long_Lines On
      # Keep_Log On preserves the original `log` field after Merge_Log parses
      # JSON. VictoriaLogs uses that field as the message body.
      filters: |
        [FILTER]
            Name kubernetes
            Match kube.*
            Merge_Log On
            Keep_Log On
            K8S-Logging.Parser On
            K8S-Logging.Exclude On
      outputs: |
        [OUTPUT]
            Name http
            Match kube.*
            Host victoria-logs.o11y.svc.cluster.local
            Port 9428
            URI /insert/jsonline?_stream_fields=kubernetes.namespace_name,kubernetes.pod_name,kubernetes.container_name,stream&_msg_field=log&_time_field=date&ignore_fields=log.offset
            Format json_lines
            Json_date_Format iso8601
            Compress gzip
            Retry_Limit 5
