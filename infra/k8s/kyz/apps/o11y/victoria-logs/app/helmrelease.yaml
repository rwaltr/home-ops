---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# VictoriaLogs single-node store. Keep a hard disk ceiling as well as age-based
# retention so a log burst cannot fill the node's OS disk.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 1h
  values:
    server:
      fullnameOverride: victoria-logs
      persistentVolume:
        enabled: true
        size: 10Gi
        storageClassName: openebs-hostpath
      retentionPeriod: 14d
      # VictoriaMetrics size flags require GiB, not the Kubernetes Gi suffix.
      retentionDiskSpaceUsage: 8GiB
      # Separate UDP listeners let the Grafana Logs datasource identify the
      # RouterOS controller and its CAPsMAN AP events without parsing messages.
      extraArgs:
        syslog.listenAddr.udp:
          - ":5140"
          - ":5141"
        syslog.streamFields.udp:
          - [source, hostname]
          - [source, hostname]
        syslog.extraFields.udp:
          - { source: routeros }
          - { source: ap1-132l }
      resources:
        requests:
          cpu: 20m
          # p95 working set 188Mi and p99 198Mi over 12h of real ingestion (~230
          # container streams, ~1M rows). The old 64Mi was a guess made before
          # the pipeline carried traffic.
          memory: 192Mi
        limits:
          # The old 256Mi ceiling sat 6Mi above the measured peak (250Mi) and the
          # pod was OOMKilled four times on 2026-11-22. VictoriaLogs sizes its
          # caches from the container limit (-memory.allowedPercent=60), so this
          # limit also decides how much it may cache and merge.
          memory: 512Mi
      serviceMonitor:
        enabled: true
    # The chart's default Vector agent would duplicate Fluent Bit collection.
    vector:
      enabled: false
    dashboards:
      enabled: false
