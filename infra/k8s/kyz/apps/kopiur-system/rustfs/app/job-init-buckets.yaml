---
# One-shot bucket bootstrap. Kopia's S3 backend requires the bucket to exist
# BEFORE the ClusterRepository can connect/create (kopiur never creates
# buckets). Lives in the rustfs app so its Flux Kustomization (wait: true)
# gates kopiur-repo; backoffLimit rides out RustFS's first boot.
# Re-run after a RustFS data wipe:
#   kubectl -n kopiur-system delete job rustfs-init-buckets \
#     && flux -n kopiur-system reconcile kustomization rustfs --with-source
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-init-buckets
spec:
  backoffLimit: 12
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-08-13T08-35-41Z
          envFrom:
            - secretRef:
                name: rustfs-credentials
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mc alias set local http://rustfs-svc.kopiur-system.svc.cluster.local:9000 "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY"
              mc mb local/kopia --ignore-existing
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
