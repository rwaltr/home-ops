---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/clusterexternalsecret_v1.json
# Fans `kopiur-rustfs` (S3 keys + kopia password) into every namespace labeled
# kopiur.home-operations.com/repo=cluster-kopia — kopiur-system + consumers.
# Onboarding an app = one namespace label; no per-namespace Secret manifests and
# no kopiur credentialProjection (avoids its cluster-wide secrets RBAC).
# Secret name/keys MUST match the ClusterRepository's secretRefs.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: kopiur-rustfs
spec:
  externalSecretName: kopiur-rustfs
  refreshTime: 1m
  namespaceSelector:
    matchLabels:
      kopiur.home-operations.com/repo: cluster-kopia
  externalSecretSpec:
    refreshInterval: 1m
    secretStoreRef:
      kind: ClusterSecretStore
      name: onepassword-connect
    target:
      name: kopiur-rustfs
      creationPolicy: Owner
      template:
        engineVersion: v2
        data:
          AWS_ACCESS_KEY_ID: "{{ .RUSTFS_ACCESS_KEY }}"
          AWS_SECRET_ACCESS_KEY: "{{ .RUSTFS_SECRET_KEY }}"
          KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
    dataFrom:
      - extract:
          key: kopia
