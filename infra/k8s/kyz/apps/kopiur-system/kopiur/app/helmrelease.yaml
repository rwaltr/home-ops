---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kopiur
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    installScope: cluster # required: ClusterRepository is cluster-scoped
    webhook:
      # DR-safety: a kopiur outage must never gate Restore-CR creation
      failurePolicy: Ignore
      tls:
        # self-signed at runtime — no cert-manager, no hook Job
        mode: self
