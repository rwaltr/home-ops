---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kopiur
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
    # Helm's `crds/` directory is INSTALL-ONLY: a plain upgrade never touches CRD
    # schemas, so the CRDs here had drifted years behind the controller that reads
    # them. CreateReplace creates missing CRDs and replaces existing ones on every
    # upgrade (it never deletes), which is the CRD policy kopiur's own upgrade
    # guide names as the Flux/Argo answer. Replacing a CRD keeps its custom
    # resources — only the schema is rewritten. Skipping this silently prunes any
    # field the running controller writes but the installed schema does not
    # declare, which is how a configured feature ends up inert with no error.
    crds: CreateReplace
  values:
    installScope: cluster # required: ClusterRepository is cluster-scoped
    webhook:
      # DR-safety: a kopiur outage must never gate Restore-CR creation
      failurePolicy: Ignore
      tls:
        # self-signed at runtime — no cert-manager, no hook Job
        mode: self
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          # Chart says the webhook "does no kopia work, so it stays light",
          # yet it grew to 1.8Gi RSS over 14d (audit 2026-09-24) — leak or
          # unbounded cache. Cap so it recycles instead of eating the node.
          memory: 512Mi
