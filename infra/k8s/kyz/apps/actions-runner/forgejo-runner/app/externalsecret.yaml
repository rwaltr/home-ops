---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The runner's identity. Registered once through the Forgejo admin API
# (POST /api/v1/admin/actions/runners, global scope, name mouse-dind) and written
# straight to 1Password item `forgejo-runner` — see docs/forgejo.md. Re-registering
# mints a new uuid/token pair; update the item and the old runner can be deleted.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-runner
    template:
      data:
        RUNNER_UUID: "{{ .uuid }}"
        token: "{{ .token }}"
  dataFrom:
    - extract:
        key: forgejo-runner
