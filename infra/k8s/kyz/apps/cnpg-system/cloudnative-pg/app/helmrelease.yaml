---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# CloudNativePG operator. Its first (and so far only) tenant is kritika, which
# needs Postgres 18 with VectorChord — see docs/kritika.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
