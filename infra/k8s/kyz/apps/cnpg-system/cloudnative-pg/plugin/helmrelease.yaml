---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Barman Cloud plugin: base backups + WAL archiving to RustFS for every CNPG
# Cluster (docs/postgres.md). Must run in the operator's namespace. Its
# plugin<->operator mTLS certificates come from cert-manager (a chart-local
# self-signed Issuer), which is why cert-manager is a dependency.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
spec:
  chartRef:
    kind: OCIRepository
    name: plugin-barman-cloud
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    crds:
      create: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
