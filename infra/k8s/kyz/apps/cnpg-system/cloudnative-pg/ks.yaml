---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
spec:
  interval: 1h
  path: ./infra/k8s/kyz/apps/cnpg-system/cloudnative-pg/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: cnpg-system
  # wait: true on purpose — the operator owns the Cluster/Database/DatabaseRole
  # CRDs that kritika's database is declared with.
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-barman-plugin
spec:
  dependsOn:
    - name: cloudnative-pg
    - name: cert-manager # the plugin's mTLS Issuer and Certificates
      namespace: cert-manager
  interval: 1h
  path: ./infra/k8s/kyz/apps/cnpg-system/cloudnative-pg/plugin
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: cnpg-system
  # wait: true on purpose — the ObjectStore CRD comes from this chart, and a
  # Cluster naming the plugin fails to reconcile until it is serving.
  wait: true
