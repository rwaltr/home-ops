---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/helmrepository_v1.json
# Windmill publishes no OCI chart artifacts, so a classic HelmRepository
# (same as stakater/reloader).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: windmill
spec:
  interval: 1h
  url: https://windmill-labs.github.io/windmill-helm-charts/
