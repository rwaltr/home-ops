---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# windmill — code-first workflow automation demo. See docs/windmill.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: windmill
spec:
  interval: 1h
  chart:
    spec:
      chart: windmill
      version: 4.0.330
      sourceRef:
        kind: HelmRepository
        name: windmill
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Database and routing are ours: CNPG Cluster in ./postgres.yaml,
    # HTTPRoute in ./httproute.yaml (envoy-internal, same as sonarr).
    postgresql:
      enabled: false
    ingress:
      enabled: false
    windmill:
      appReplicas: 1
      # LSP + debugger for the in-browser editor; one light container.
      extraReplicas: 1
      baseDomain: windmill.waltr.tech
      baseProtocol: https
      # Chart default key `url` in this Secret; the URI never lands in
      # the pod spec or this repo.
      databaseUrlSecretName: windmill-postgres-credentials
      # Helm replaces lists wholesale, so both groups are spelled out.
      # 1 + 1 workers is a homelab's worth of concurrency (the stock
      # chart ships 3 default workers; idle workers cost ~100Mi each).
      workerGroups:
        - name: default
          replicas: 1
          resources:
            limits:
              memory: 1Gi
        - name: native
          replicas: 1
          resources:
            limits:
              memory: 1Gi
          extraEnv:
            - name: NATIVE_MODE
              value: "true"
            - name: SLEEP_QUEUE
              value: "200"
