---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
# Windmill's database: one instance — one-node cluster, a standby would share
# the node and its disk and protect against nothing. No backups yet (see
# ../ks.yaml). The app uses the bootstrap owner directly; promotion to a
# kritika-style app role happens when untrusted code ever runs here.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: windmill-postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm@sha256:30d0a38b6df3da24e89a2cfbe800e422c3ef13fa427aa5523f2a7d3fecb53b34
  enableSuperuserAccess: false
  storage:
    storageClass: openebs-hostpath
    size: 5Gi
  bootstrap:
    initdb:
      database: windmill
      owner: windmill
      secret:
        name: windmill-postgres-credentials
      # Runs as the postgres superuser, which only bootstrap can be: the
      # windmill_admin role needs BYPASSRLS, and only a superuser can create
      # that or grant memberships in it. Without these the first windmill
      # migration dies on "role \"windmill_admin\" does not exist"
      # (windmill.dev/docs/advanced/self_host). The login owner gets both
      # roles because windmill opens every user_db transaction with
      # SET LOCAL ROLE windmill_admin|windmill_user.
      postInitSQL:
        - CREATE ROLE windmill_admin WITH BYPASSRLS NOLOGIN;
        - CREATE ROLE windmill_user WITH NOLOGIN;
        - GRANT windmill_user TO windmill_admin;
        - GRANT windmill_admin TO windmill;
        - GRANT windmill_user TO windmill;
        - GRANT USAGE ON SCHEMA public TO windmill_admin, windmill_user;
