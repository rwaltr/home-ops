---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The database URI the chart mounts (`databaseUrlSecretName`, key `url`).
# `refreshInterval: "0"`: a generator mints a new value on every sync, and a
# rotating password would drift from the one CNPG set at bootstrap. Deleting
# the Secret mints a new one, which CNPG then applies to the role.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: windmill-postgres-credentials
spec:
  refreshInterval: "0"
  target:
    name: windmill-postgres-credentials
    template:
      # basic-auth type: CNPG's bootstrap reads username/password; the chart
      # reads the url key. One Secret serves both.
      type: kubernetes.io/basic-auth
      data:
        username: windmill
        password: "{{ .password }}"
        url: "postgres://windmill:{{ .password }}@windmill-postgres-rw.windmill.svc:5432/windmill?sslmode=require&connect_timeout=10"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: windmill-postgres
