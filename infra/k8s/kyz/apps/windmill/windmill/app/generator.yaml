---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
# Windmill's Postgres owner password, generated in the cluster: only CNPG and
# the app read it, so 1Password would add a step and buy nothing (docs/secrets.md).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: windmill-postgres
spec:
  length: 40
  # Letters and digits only: the value is spliced into a connection URI unescaped.
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
