---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: windmill
spec:
  # Demo install (docs/windmill.md): no cnpg/base component yet, so no
  # RustFS/Barman backups — the Postgres data is scripts we can re-push
  # from git. Promotion adds the component and an app role like kritika's.
  path: ./infra/k8s/kyz/apps/windmill/windmill/app
  prune: true
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: windmill
  dependsOn:
    - name: cloudnative-pg # the Cluster CRD
      namespace: cnpg-system
    - name: external-secrets # the Password generator
      namespace: external-secrets
    - name: openebs # the Postgres PVC
      namespace: openebs
  wait: false
