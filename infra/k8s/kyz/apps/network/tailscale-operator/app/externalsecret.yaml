---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The operator's own OAuth client: 1Password item `tailscale-operator` (vault
# home-ops), fields `username` (client id) and `password` (client secret). That
# item is written by Terraform, not by hand — see
# infra/terraform/bootstrap/tailscale-operator.tf.
#
# Both names below are a contract with the chart, not a preference. Its
# deployment mounts a Secret called `<fullname>-oauth` and reads two files out of
# it, `client_id` and `client_secret` (templates/deployment.yaml). Rename either
# and the operator installs cleanly, runs, and never authenticates.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-operator
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: tailscale-operator-oauth
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale-operator
        property: username
    - secretKey: client_secret
      remoteRef:
        key: tailscale-operator
        property: password
