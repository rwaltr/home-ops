---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cloudflare-tunnel-secret
    template:
      data:
        # NOTE: the 1P field holds the connector token base64-wrapped (as it was
        # pasted); b64dec unwraps it to the raw eyJ... token cloudflared expects.
        # If the field is ever re-pasted raw, remove the b64dec.
        TUNNEL_TOKEN: "{{ .CLOUDFLARE_TUNNEL_TOKEN | b64dec }}"
  dataFrom:
    - extract:
        key: cloudflare