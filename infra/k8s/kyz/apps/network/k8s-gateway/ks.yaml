---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k8s-gateway
spec:
  interval: 1h
  path: ./infra/k8s/kyz/apps/network/k8s-gateway/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: true
  dependsOn:
    - name: cilium
      namespace: kube-system
  # Scope the health assessment to the HelmRelease. The chart index is a
  # third-party source (Codeberg Pages, mirrored at kryptonian.kapsi.fi) which
  # has been returning 502 since 2026-10-29; its HelmRepository is therefore
  # Ready=False while the release itself stays Ready=True off the cached
  # artifact. Left implicit, that external outage made this Kustomization report
  # Ready=Unknown and page KustomizationReconciliationFailure hourly without the
  # workload ever being unhealthy. The HelmRelease is the object that reflects
  # the running workload; the index fetch is not a signal about it.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: k8s-gateway
      namespace: network
