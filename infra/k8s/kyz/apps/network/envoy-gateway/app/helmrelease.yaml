---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  interval: 1h
  values:
    global:
      imageRegistry: mirror.gcr.io
    # Control-plane memory request: 30d p99 working set 143Mi, so stop holding
    # the chart's 256Mi (docs/memory-requests.md). Limit stays at the default 1Gi.
    deployment:
      envoyGateway:
        resources:
          requests:
            memory: 192Mi
    config:
      envoyGateway:
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
