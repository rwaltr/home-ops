---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus
spec:
  chartRef:
    kind: OCIRepository
    name: multus
  interval: 1h
  values:
    resources:
      requests:
        cpu: 10m
        # 30d p95 27Mi, peak 29Mi. Was implicitly 512Mi (limit-only).
        memory: 128Mi
      limits:
        memory: 512Mi
