---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
# VLAN 40 (cameras). See iot.yaml for the trunk/macvlan background.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: cameras
  namespace: kube-system
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "cameras",
      "plugins": [
        {
          "type": "macvlan",
          "master": "enp88s0.40",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "routes": [
              {"dst": "10.40.0.0/24"},
              {"dst": "0.0.0.0/0", "gw": "10.40.0.1"}
            ]
          }
        },
        {
          "type": "sbr"
        }
      ]
    }