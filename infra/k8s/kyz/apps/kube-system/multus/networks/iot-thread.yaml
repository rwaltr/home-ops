---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
# VLAN 30 (iot) macvlan + an explicit route to the Thread OMR prefix via the
# in-cluster OTBR pod (10.30.0.13 / MAC ...:0d).
#
# Why: OpenThread's border router advertises the OMR as an RFC 4191 Route
# Information Option (RIO). Linux ignores RIOs unless
# net.ipv6.conf.<if>.accept_ra_rt_info_max_plen > 0, which is not in the k8s
# safe-sysctl set, so pods never learn the route from the RA. The Matter
# controller therefore gets it explicitly here.
#
# Keep the OMR prefix in sync with the OTBR: `kubectl -n default exec
# deploy/otbr -- wrap-ot-ctl br omrprefix`. The prefix persists in the OTBR's
# PVC, so it is stable across restarts but changes if that PVC is recreated.
#
# The plain `iot` NAD stays route-free and is used by everything else,
# including the OTBR pod itself (which already routes the OMR via wpan0).
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: iot-thread
  namespace: kube-system
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "iot-thread",
      "plugins": [
        {
          "type": "macvlan",
          "master": "enp88s0.30",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "routes": [
              {"dst": "10.30.0.0/23"},
              {"dst": "0.0.0.0/0", "gw": "10.30.0.1"},
              {"dst": "fd85:2657:315b:1::/64", "gw": "fdad:207a:f1ab:30:a430:ff:fe10:300d"}
            ]
          }
        },
        {
          "type": "sbr"
        }
      ]
    }
