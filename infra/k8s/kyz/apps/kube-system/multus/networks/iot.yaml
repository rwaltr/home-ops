---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
# VLAN 30 (iot) macvlan. Master is the host's tagged subinterface
# enp88s0.30 (ether4-study is a trunk: 10/20/30/40/60 tagged, PVID 10).
# Pods attach per-pod: k8s.v1.cni.cncf.io/networks annotation with static
# ips/mac (see home-assistant helmrelease).
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: iot
  namespace: kube-system
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "iot",
      "plugins": [
        {
          "type": "macvlan",
          "master": "enp88s0.30",
          "mode": "bridge",
          "ipam": {
            "type": "static",
            "routes": [
              {"dst": "10.30.0.0/23"}, # on-link: unbound dials must use this macvlan
              {"dst": "0.0.0.0/0", "gw": "10.30.0.1"}
            ]
          }
        },
        {
          "type": "sbr"
        }
      ]
    }