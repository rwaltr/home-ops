---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumloadbalancerippool_v2.json
# LB VIP space for k8s services. No dedicated VLAN: Cilium announces VIPs to
# the MikroTik as /32s (v4) and /128s (v6) over BGP, and the router routes
# them toward mouse. Any VLAN can reach them. VIP subnets use ID 100
# ("service space"), matching the VLAN-ID addressing convention.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  allowFirstLastIPs: "No"
  blocks:
    - cidr: 10.10.100.0/24
    # IPv6 ULA VIP space (dual-stack).
    - cidr: fdad:207a:f1ab:100::/64
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumbgpadvertisement_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: l3-bgp-advertisement
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - { key: somekey, operator: NotIn, values: ["never-used-value"] }
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumbgppeerconfig_v2.json
# v4 session (transport 10.10.0.1) — v4 NLRI only. A v4-transport session
# carrying v6 NLRI yields a v4-mapped next-hop (::ffff:) that RouterOS
# cannot use for plain-Ethernet v6 forwarding — hence the separate v6 session.
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: l3-bgp-peer-config
spec:
  timers:
    # Fast LAN failover: dead peer detected in <10s
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumbgppeerconfig_v2.json
# v6 session (transport fdad:207a:f1ab:10::1) — v6 NLRI only, native next-hop.
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: l3-bgp-peer-config-v6
spec:
  timers:
    holdTimeSeconds: 9
    keepAliveTimeSeconds: 3
  families:
    - afi: ipv6
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumbgpclusterconfig_v2.json
# Peering: mouse (Cilium, AS 64513) <-> gateway-132l (MikroTik, AS 64512).
# Two sessions, one per family, each with a native next-hop:
#   v4 transport 10.10.0.1 -> v4 VIP /32s
#   v6 transport fdad:207a:f1ab:10::1 -> v6 VIP /128s
# RouterOS side is hand-applied — see infra/routeros/README.md
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: l3-bgp-cluster-config
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: cilium
      localASN: 64513
      peers:
        - name: mikrotik
          peerASN: 64512
          peerAddress: 10.10.0.1
          peerConfigRef:
            name: l3-bgp-peer-config
        - name: mikrotik-v6
          peerASN: 64512
          peerAddress: fdad:207a:f1ab:10::1
          peerConfigRef:
            name: l3-bgp-peer-config-v6
---
# kube-apiserver via stable LAN VIPs (v4 + v6).
# k0s runs the apiserver on the host (not an API-visible pod), so the Service
# is selectorless with manual EndpointSlices below.
apiVersion: v1
kind: Service
metadata:
  name: kube-api
  annotations:
    lbipam.cilium.io/ips: 10.10.100.10,fdad:207a:f1ab:100::10
    # Served by the in-cluster k8s-gateway (split DNS) — internal only
    coredns.io/hostname: k8s.kyz.rwalt.pro
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  ports:
    - name: https
      port: 6443
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: kube-api
  labels:
    kubernetes.io/service-name: kube-api
addressType: IPv4
endpoints:
  - addresses:
      - 10.10.0.10
    # ETP=Local: Cilium only announces the VIP on nodes with ready local
    # endpoints; a selectorless slice needs these explicit
    nodeName: mouse
    ready: true
ports:
  - name: https
    port: 6443
    protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: kube-api-v6
  labels:
    kubernetes.io/service-name: kube-api
addressType: IPv6
endpoints:
  - addresses:
      - fdad:207a:f1ab:10::10
    nodeName: mouse
    ready: true
ports:
  - name: https
    port: 6443
    protocol: TCP
