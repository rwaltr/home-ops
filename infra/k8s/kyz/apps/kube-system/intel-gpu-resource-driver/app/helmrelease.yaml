---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Intel GPU DRA (Dynamic Resource Allocation) driver. Exposes the iGPU
# (i9-13900H / Iris Xe) as devices via DeviceClass gpu.intel.com so workloads
# can request one with a ResourceClaim instead of hostPath-ing /dev/dri.
# No NFD in-cluster: run the kubelet-plugin DaemonSet on every node (single
# node here) and skip the NFD NodeFeatureRule. No xpumd: run privileged so the
# driver reads device details straight from the kernel driver.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-resource-driver
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: intel-gpu-resource-driver
  # k0s runs kubelet with root-dir=/var/lib/k0s/kubelet, so the plugin
  # *registration* socket must land in /var/lib/k0s/kubelet/plugins_registry or
  # kubelet never sees the DRA plugin ("DRA driver gpu.intel.com is not
  # registered"). The plugin *data* dir stays at kubelet's default
  # --plugin-dir=/var/lib/kubelet/plugins, which is where kubelet dials
  # dra.sock — so only plugins-registry is overridden.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: intel-gpu-resource-driver-kubelet-plugin
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: intel-gpu-resource-driver-kubelet-plugin
              spec:
                template:
                  spec:
                    volumes:
                      - name: plugins-registry
                        hostPath:
                          path: /var/lib/k0s/kubelet/plugins_registry
  values:
    # Use ResourceClaims (DRA), not DRA-backed extended resources.
    enableDRAExtendedResources: false
    kubeletPlugin:
      # Required when health monitoring (xpumd) is disabled.
      privileged: true
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      healthMonitoring:
        enabled: false
      # Never rebind the iGPU between i915 and vfio-pci; it stays on i915 for
      # Jellyfin/QuickSync. DeviceClass then selects i915/xe-bound GPUs.
      # (The chart only emits --manage-binding when health monitoring is on, so
      # pass it explicitly here.)
      manageBinding:
        enabled: false
      extraArgs: "--manage-binding=false"
    # No Node Feature Discovery in this cluster; the DaemonSet runs everywhere.
    nodeFeatureRules:
      enabled: false
    # No XPUM daemon.
    xpumdEnabled: false