---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Reloader — restarts workloads when their referenced ConfigMap/Secret changes.
#
# This makes the existing `reloader.stakater.com/auto: "true"` annotations in
# the repo actually work (13+ manifests carry them; none were doing anything
# because nothing was watching). It removes two documented manual-restart
# footguns: hermes re-seeds its config from a ConfigMap via an init container,
# and degoog reads its settings env at container start.
#
# `default` reload strategy = watch both env-var and volume-referenced
# ConfigMaps/Secrets on annotated workloads (not just explicit
# `configmap.reloader.stakater.com/reload` annotations).
#
# Cluster-wide by design: annotated workloads live in default, network and
# external-secrets namespaces. RBAC is the chart's ClusterRole (read-only on
# configmaps/secrets + patch on workloads).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  interval: 1h
  chart:
    spec:
      chart: reloader
      version: 2.2.18
      sourceRef:
        kind: HelmRepository
        name: stakater
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: reloader
    reloader:
      watchGlobally: true
      reloadStrategy: default
      logLevel: info
      deployment:
        resources:
          requests:
            cpu: 10m
            # Measured, not guessed: 30d p95 62-63Mi, 30d max 63.9Mi across all
            # container series. The old 32Mi request was fiction — steady state
            # has been above it the whole time (#896/#973 did not reach this
            # manifest; #974).
            memory: 64Mi
          limits:
            # 2x the observed peak, which is where the old ceiling actually was:
            # the previous 64Mi limit sat 0.1Mi above the 30d max, and the
            # cluster-wide rollout of #973 (2026-11-07 18:24Z) pushed reloader
            # past it — OOMKilled, one container restart, one critical page.
            # watchGlobally + 13+ annotated workloads makes a batch merge its
            # peak-load moment, so the ceiling has to clear a mass rollout, not
            # steady state. Bounded like every other system component here — the
            # node has no disk swap (2026-09-24 memory audit, REFACTOR_PLANS.md).
            memory: 128Mi
      podMonitor:
        enabled: true
