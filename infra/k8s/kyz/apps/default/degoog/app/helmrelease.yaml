---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Degoog — search aggregator (SearXNG replacement).
#
# Engines and instance defaults are NOT managed here: Degoog ships zero
# engines, and the installed set + settings live on the /app/data PVC and are
# configured through the store UI. The PVC is the source of truth.   * `compat` is a tiny nginx rewrite so SearXNG clients that hardcode
#     `/search?format=json` (e.g. Hermes' searxng provider) work against
#     Degoog, which serves that shape at `/api/search`. `/api/search` itself
#     is also reachable on the `http` port.
#   * `mcp` is the official Degoog MCP sidecar for LLM clients (streamable HTTP
#     at /mcp on port 4443). Cluster-internal only, no route.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: degoog
spec:
  chartRef:
    kind: OCIRepository
    name: degoog
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      degoog:
        # RWO PVC: never run two pods against /app/data at once.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/degoog-org/degoog
              tag: 0.26.0@sha256:69e28fe2dc8008981b0ea8b9270f6b5b482d107b8a3dfa71d8acdac37f4b77c0
            env:
              TZ: America/Chicago
              DEGOOG_BASE_URL: https://search.waltr.tech
              DEGOOG_PUBLIC_INSTANCE: "false"
              # Envoy is a reverse proxy we control. Without this Degoog
              # distrusts X-Forwarded-* and every client shares the proxy's IP
              # for rate-limit/honeypot decisions (docs: DEGOOG_DISTRUST_PROXY),
              # which makes a 429 look like "incorrect password" in the UI.
              DEGOOG_DISTRUST_PROXY: "false"
              PUID: "1000"
              PGID: "1000"
            envFrom:
              - secretRef:
                  name: degoog-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: &port 4444
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - SETGID
                  - SETUID
                  - DAC_OVERRIDE
                  - FOWNER
          compat:
            image:
              repository: ghcr.io/nginxinc/nginx-unprivileged
              tag: 1.27.4-alpine@sha256:e234d4f7e346c098f7b22245690372382aded5be988611eb2c53ae62231eece7
            env:
              TZ: America/Chicago
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 101
              runAsGroup: 101
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          mcp:
            image:
              repository: ghcr.io/degoog-org/mcp
              tag: 0.3.0@sha256:61c402b08e8a070f3017589552eca4128d1b321ff0cf29aed738bb0267cf60d2
            env:
              TZ: America/Chicago
              HOME: /tmp
              DEGOOG_MCP_DEGOOG_URL: http://127.0.0.1:4444
              DEGOOG_MCP_MAX_RESULTS: "10"
              # "full" gives breakdown + result rows + scrape guidance; safe for
              # large-context models. Drop to "results" for small local models.
              DEGOOG_MCP_SEARCH_TEXT: full
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 4443
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 4443
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: degoog
        ports:
          http:
            port: *port
          compat:
            port: 8080
          mcp:
            port: 4443
    route:
      app:
        hostnames:
          - search.waltr.tech
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: degoog
                port: *port
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: openebs-hostpath
        forceRename: degoog-data
        advancedMounts:
          degoog:
            app:
              - path: /app/data
      nginx-conf:
        type: configMap
        name: degoog-nginx
        advancedMounts:
          degoog:
            compat:
              - path: /etc/nginx/conf.d/default.conf
                subPath: default.conf
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          degoog:
            app:
              - path: /tmp
            compat:
              - path: /tmp
            mcp:
              - path: /tmp
      nginx-cache:
        type: emptyDir
        advancedMounts:
          degoog:
            compat:
              - path: /var/cache/nginx
      mcp-data:
        type: emptyDir
        advancedMounts:
          degoog:
            mcp:
              - path: /data
    configMaps:
      degoog-nginx:
        forceRename: degoog-nginx
        data:
          default.conf: |
            server {
              listen 8080;
              server_name _;

              # SearXNG clients (Hermes' searxng provider among them) hardcode
              # `/search?format=json`. Degoog serves the equivalent document at
              # `/api/search`. Rewrite transparently.
              location = /search {
                proxy_pass http://127.0.0.1:4444/api/search$is_args$args;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
              }

              # Everything else is Degoog's own surface, untouched.
              location / {
                proxy_pass http://127.0.0.1:4444;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
              }
            }
