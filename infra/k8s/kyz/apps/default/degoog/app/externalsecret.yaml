---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Settings-gate password for Degoog. Without it anyone who can reach the
# instance is allowed to install extensions, and extensions run code on the
# server. 1P item `degoog` (vault home-ops), standard `password` field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: degoog
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: degoog-secret
    template:
      data:
        DEGOOG_SETTINGS_PASSWORDS: "{{ .password }}"
  dataFrom:
    - extract:
        key: degoog
