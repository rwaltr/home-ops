---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# Kopia enrollment for this app's PVCs (namespace-scoped policy; repo via
# ClusterRepository/cluster-kopia). copyMethod: Direct — crash-consistent
# live reads (openebs-hostpath has no CSI snapshots). Mover runs as
# 1000:1000 to match the app UID/GID; the store holds the Z-Wave security
# keys, so this backup is what makes them recoverable.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: zwave-js-ui
  namespace: default
spec:
  repository:
    kind: ClusterRepository
    name: cluster-kopia
  sources:
    - pvc:
        name: zwave-js-ui
      sourcePathStrategy: PvcName
  copyMethod: Direct
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    podSecurityContext:
      fsGroup: 1000
  retention:
    keepLatest: 7
    keepDaily: 14
    keepWeekly: 4
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: zwave-js-ui-nightly
  namespace: default
spec:
  policyRef:
    name: zwave-js-ui
  schedule:
    cron: "H 4 * * *"
    jitter: 30m
    runOnCreate: false