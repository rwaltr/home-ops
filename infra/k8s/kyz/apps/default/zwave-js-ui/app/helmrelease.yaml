---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Z-Wave JS UI against the SLZB-Ultima3 Z-Wave serial server.
# UI at zwave.waltr.tech (internal); websocket API :3000 for HA zwave_js.
# NOTE: store/settings.json is PVC state, seeded by hand (like HA's
# configuration.yaml): zwave.port=tcp://10.10.0.101:9638 (SLZB z-wave serial
# server — NOT 9999), serverEnabled=true, serverPort=3000, serverHost=0.0.0.0
# (the last three are what make the HA-facing ws server listen).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zwave-js-ui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: zwave-js-ui
  values:
    fullnameOverride: zwave-js-ui
    controllers:
      zwave-js-ui:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/zwave-js/zwave-js-ui
              tag: 11.23.0@sha256:86f418050ce658cb6b9a5b17c33065b113376f9ccef98b36b3f2c42050b59672
            env:
              TZ: America/Chicago
              # Serial device for the Z-Wave driver (SLZB tcp serial server)
              SESSION_DIRECTORY: /usr/src/app/store/sessions
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: zwave-js-ui
        ports:
          http:
            port: &port 8091
          websocket:
            port: 3000
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames:
          - zwave.waltr.tech
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      store:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: openebs-hostpath
        globalMounts:
          - path: /usr/src/app/store