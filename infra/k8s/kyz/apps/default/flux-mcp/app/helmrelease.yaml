---
# The Flux Operator's MCP server (`cmd/mcp` in controlplaneio-fluxcd/flux-operator),
# published as flux-operator-mcp. Upstream marks it "in preview"; pin the digest.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-mcp
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      flux-mcp:
        containers:
          app:
            image:
              repository: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp
              tag: v0.62.1@sha256:0b4181bc9ada80eedf3e9df3355153abc9c3e6d8b913bddebe0b12908309bff6
            # Default transport is stdio and the default port is 8080; both are
            # overridden here. `sse` was removed upstream, so this is Streamable
            # HTTP only — an SSE client will not connect.
            args:
              - serve
              - --transport=http
              - --port=8000
              # Hides reconcile/suspend/resume/apply/delete/patch. The ClusterRole
              # below cannot perform them either.
              - --read-only
            env:
              TZ: America/Chicago
            probes:
              # No HTTP health endpoint exists — the mux registers only /mcp, so
              # /healthz is a 404. A tcpSocket is the honest check here, which is
              # also what the upstream chart uses. It proves the process is
              # listening, not that it is healthy; a wedged server would pass.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
                  initialDelaySeconds: 5
                  periodSeconds: 10
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    defaultPodOptions:
      # In-cluster config is auto-detected from KUBERNETES_SERVICE_HOST; without a
      # mounted token the server exits with "KUBECONFIG environment variable is not
      # set".
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: flux-mcp
        ports:
          http:
            port: 8000
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
