---
# yaml-language-server: $schema=https://gateway-api.sigs.k8s.io/geps/gep-1748
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  annotations:
    # Listed on the Homepage dashboard — see docs/homepage.md.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Radarr
    gethomepage.dev/description: Movie library management
    gethomepage.dev/group: Media Ops
    gethomepage.dev/icon: radarr.png
spec:
  hostnames:
    - radarr.waltr.tech
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: radarr
          port: 7878
