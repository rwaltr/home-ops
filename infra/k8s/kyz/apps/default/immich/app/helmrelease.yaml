---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Immich — server + valkey + postgres + machine-learning.
# Images are upstream official (immich-app/*, valkey); the chart is the public
# bjw-s app-template used by every app in this repo.
#
# machine-learning is deployed because the paperless bridge classifies new
# photos as documents from two local signals — OCR text-box density and CLIP
# smart search — and neither exists without it. Before this, the server logged
# an unhealthy ML backend and smart-search/facial-recognition jobs failed.
# Smart search and faces also get better photo-library behaviour for free.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: immich
  values:
    fullnameOverride: immich
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      server:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.2.4@sha256:d317916b28090c33eb36b308464ea391f8b7df1d850fcfea227a39ec879718c2
            env:
              TZ: America/Chicago
              DB_HOSTNAME: immich-postgres
              DB_PORT: "5432"
              DB_DATABASE_NAME: immich
              DB_USERNAME: postgres
              DB_PASSWORD:
                secretKeyRef:
                  name: immich-secret
                  key: db_password
              DB_VECTOR_EXTENSION: vectorchord
              REDIS_HOSTNAME: immich-valkey
              REDIS_PORT: "6379"
              # Explicit rather than relying on the default service name, so a
              # rename of the ML service shows up here as a diff.
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
              # Trust X-Forwarded-For only from the cluster pod CIDR (envoy
              # gateway is always a pod on this node); gives real client IPs
              # behind envoy/cloudflared.
              IMMICH_TRUSTED_PROXIES: "10.244.0.0/24,fdad:207a:f1ab:244::/117"
              MPLCONFIGDIR: /tmp/matplotlib
            probes:
              # probes are pinned explicitly: app-template defaults to the first
              # service port, which is not necessarily this controller's.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 2283
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: 2283
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 2283
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi # CPU transcoding headroom
      machine-learning:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.2.4@sha256:e16c2f166a8174901959fdf85e2e4c7bd1ebc4b37e0b6655de97c41408a260c4
            env:
              TZ: America/Chicago
              # readOnlyRootFilesystem is on, so anything that wants $HOME writes
              # into the model cache instead of a writable layer.
              HOME: /cache
            probes:
              # tcpSocket, not an HTTP path: the ML service's routes are upstream's
              # business and have moved between versions.
              liveness: &mlprobes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &mlport 3003
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *mlprobes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *mlport
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # CLIP + face + OCR models resident at once. Generous limit,
                # small request: this pod is bursty and must not squeeze postgres.
                memory: 4Gi
      valkey:
        strategy: Recreate
        containers:
          valkey:
            image:
              repository: docker.io/valkey/valkey
              tag: 9-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
      postgres:
        strategy: Recreate
        pod:
          # The official Postgres entrypoint starts as root, chowns/chmods
          # PGDATA, then drops to `postgres` via gosu — root is required for
          # first init. Capabilities are limited to exactly what that needs.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
        containers:
          postgres:
            image:
              repository: ghcr.io/immich-app/postgres
              tag: 17-vectorchord1.1.1@sha256:7f0b786ed5a7a9d26522dacbf46114a76e043a515ce5e020690fc6702e987b72
            env:
              POSTGRES_USER: postgres
              POSTGRES_DB: immich
              POSTGRES_PASSWORD:
                secretKeyRef:
                  name: immich-secret
                  key: db_password
              POSTGRES_INITDB_ARGS: --data-checksums
              DB_STORAGE_TYPE: SSD # openebs-hostpath is on the OS NVMe (ext4)
              PGDATA: /var/lib/postgresql/data
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "postgres", "-d", "immich"]
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "postgres", "-d", "immich"]
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pg_isready", "-U", "postgres", "-d", "immich"]
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              # entrypoint rewrites /etc/postgresql/postgresql.conf from the
              # SSD/HDD template — keep the root FS writable for this one.
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"] # gosu drop + PGDATA chown/chmod
            resources:
              requests:
                cpu: 100m
                # 30d p95 158Mi, peak 201Mi; raised from 512Mi. Kept well above
                # the peak so postgres is not the pod squeezed first.
                memory: 384Mi
              limits:
                memory: 2Gi
    service:
      server:
        controller: server
        ports:
          http:
            port: 2283
      # Name matters: app-template renders <fullnameOverride>-<key>, and the
      # Immich server's default ML endpoint is http://immich-machine-learning:3003.
      machine-learning:
        controller: machine-learning
        ports:
          http:
            port: 3003
      valkey:
        controller: valkey
        ports:
          valkey:
            port: 6379
      postgres:
        controller: postgres
        ports:
          postgres:
            port: 5432
    route:
      app:
        annotations:
          # Listed on the Homepage dashboard — see docs/homepage.md.
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Immich
          gethomepage.dev/description: Photo and video library
          gethomepage.dev/group: Photos
          gethomepage.dev/icon: immich.png
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames:
          - immich.waltr.tech
        parentRefs:
          - name: envoy-internal
            namespace: network
          - name: envoy-external # public via cloudflare tunnel (CGNAT — no port forwards)
            namespace: network
        rules:
          - backendRefs:
              - identifier: server
                port: http
    persistence:
      # Immich-managed upload root (library/thumbs/encoded-video/backups…).
      # The existing /var/tank/nas/pictures collection can be added later as a
      # read-only external library — never point UPLOAD_LOCATION at it.
      library:
        type: hostPath
        hostPath: /var/tank/nas/library/photos
        advancedMounts:
          server:
            app:
              - path: /data
      # ML model cache. A few hundred MB of CLIP/face/OCR weights; on a PVC so a
      # pod restart does not re-download them. Not backed up: it is regenerable
      # cache, not data.
      model-cache:
        type: persistentVolumeClaim
        forceRename: immich-ml-cache # pin: a second PVC would otherwise be suffixed
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: openebs-hostpath
        advancedMounts:
          machine-learning:
            app:
              - path: /cache
      postgres:
        type: persistentVolumeClaim
        forceRename: immich-postgres # pin: app-template only suffixes PVCs when >1 exists
        accessMode: ReadWriteOnce
        size: 8Gi
        storageClass: openebs-hostpath
        advancedMounts:
          postgres:
            postgres:
              - path: /var/lib/postgresql/data
      # Postgres shared memory (compose uses shm_size: 128mb; k8s default is 64Mi).
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        advancedMounts:
          postgres:
            postgres:
              - path: /dev/shm
      # Valkey working dir (dump.rdb); ephemeral by design — matches upstream compose.
      valkey-data:
        type: emptyDir
        advancedMounts:
          valkey:
            valkey:
              - path: /data
      tmp:
        type: emptyDir
        advancedMounts:
          server:
            app:
              - path: /tmp
          machine-learning:
            app:
              - path: /tmp
