---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# Kopia enrollment for Immich's Postgres PVC. copyMethod: Direct —
# crash-consistent live reads (openebs-hostpath has no CSI snapshots). The
# mover must run as 999:999 to read PGDATA (Postgres UID/GID).
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: immich
  namespace: default
spec:
  repository:
    kind: ClusterRepository
    name: cluster-kopia
  sources:
    - pvc:
        name: immich-postgres
      sourcePathStrategy: PvcName
  copyMethod: Direct
  mover:
    securityContext:
      runAsUser: 999
      runAsGroup: 999
    podSecurityContext:
      fsGroup: 999
  retention:
    keepLatest: 7
    keepDaily: 14
    keepWeekly: 4
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: immich-nightly
  namespace: default
spec:
  policyRef:
    name: immich
  schedule:
    cron: "H 3 * * *"
    jitter: 30m
    runOnCreate: false
