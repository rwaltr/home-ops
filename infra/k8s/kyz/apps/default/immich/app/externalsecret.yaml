---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# DB password for Immich's Postgres. 1P item `immich` (vault home-ops), field
# `db_password`; consumed by both the Postgres container (POSTGRES_PASSWORD)
# and the server (DB_PASSWORD).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: immich-secret
    template:
      data:
        db_password: "{{ .db_password }}"
  dataFrom:
    - extract:
        key: immich
