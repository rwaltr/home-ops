---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo
spec:
  components:
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./infra/k8s/kyz/apps/default/forgejo/app
  postBuild:
    substitute:
      APP: forgejo
      PVC: forgejo-data
      # Distinct hour from every other mover (see homebox/ks.yaml for why).
      KOPIUR_CRON: "H 15 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  dependsOn:
    - name: openebs # data PVC on the openebs-hostpath storage class
      namespace: openebs
  wait: false
