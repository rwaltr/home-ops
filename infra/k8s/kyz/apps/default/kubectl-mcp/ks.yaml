---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubectl-mcp
spec:
  interval: 1h
  path: ./infra/k8s/kyz/apps/default/kubectl-mcp/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  # The README warns this project's read-only mode is enforced at call time by a
  # middleware argument, not by model choice, so a caller that connects before
  # the ClusterRole exists gets an RBAC denial instead of a clean tool listing.
  dependsOn:
    - name: onepassword-connect
      namespace: external-secrets
  wait: false
