---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubectl-mcp
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      kubectl-mcp:
        containers:
          app:
            image:
              repository: ghcr.io/rohitg00/kubectl-mcp-server
              tag: 2.0.0@sha256:f1f57aa5d4952f3c49e4d9bb8071a143d0812bdc8253922d51eeca8a2615ea29
            # The image bakes MCP_SERVER_TRANSPORT=stdio. Without --transport http
            # the process speaks stdio on a port that nothing is listening on.
            args:
              - --transport
              - http
              - --port
              - "8000"
            env:
              # Image default is 0.0.0.0, and the server refuses to start on a
              # non-loopback bind unless one of auth/--allow-unauthenticated is
              # set (ensure_network_exposure_allowed). There is no bearer-token
              # mode here: auth is OAuth 2.1 JWT only. The compensating control is
              # the ClusterIP service plus a read-only ClusterRole — this endpoint
              # must not be exposed beyond the cluster.
              MCP_ALLOW_UNAUTHENTICATED: "true"
              MCP_K8S_PROVIDER: in-cluster
              MCP_SERVER_HOST: 0.0.0.0
              # Read-only is enforced twice: hidden from on_list_tools and raised
              # from on_call_tool, then backed by the ClusterRole's verbs.
              MCP_SAFETY_MODE: read-only
              # Default toolset is core+helm only; diagnostics adds the describe/
              # events/logs helpers that make this useful for triage.
              MCP_TOOLSETS: default,diagnostics
              # Masks Secret values and JWTs in tool output. The ClusterRole has no
              # secret access either, so this is the second layer.
              MCP_MASK_SECRETS: "true"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 5
                  periodSeconds: 10
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
            # The binary runs as 10001:10001 upstream; HOME is /home/mcp and it
            # writes nothing else, so an emptyDir each for HOME and /tmp is enough.
            # readOnlyRootFilesystem needs both.
    defaultPodOptions:
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: kubectl-mcp
        ports:
          http:
            port: 8000
    persistence:
      home:
        type: emptyDir
        globalMounts:
          - path: /home/mcp
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
