---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# Kopia enrollment for ESPHome's config PVC (namespace-scoped policy; repo
# via ClusterRepository/cluster-kopia). copyMethod: Direct — crash-consistent
# live reads (openebs-hostpath has no CSI snapshots). Mover runs as 1000:1000
# to match the app UID/GID.
#
# The /cache PVC (PlatformIO toolchains + build artifacts) is intentionally
# NOT backed up — it is large and fully regenerable.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: esphome
  namespace: default
spec:
  repository:
    kind: ClusterRepository
    name: cluster-kopia
  sources:
    - pvc:
        name: esphome-config
      sourcePathStrategy: PvcName
  copyMethod: Direct
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    podSecurityContext:
      fsGroup: 1000
  retention:
    keepLatest: 7
    keepDaily: 14
    keepWeekly: 4
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: esphome-nightly
  namespace: default
spec:
  policyRef:
    name: esphome
  schedule:
    cron: "H 3 * * *"
    jitter: 30m
    runOnCreate: false
