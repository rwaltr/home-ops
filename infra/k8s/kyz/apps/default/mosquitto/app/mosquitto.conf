listener 1883 0.0.0.0
allow_anonymous true

# Retained messages carry the Home Assistant MQTT discovery payloads and every
# entity's availability topic. Without persistence they exist in memory only, so a
# broker restart (image bump, node reboot, pod eviction) silently wipes them — and
# every MQTT-backed entity in Home Assistant then sits `unavailable` until each
# publisher republishes on its own restart. zigbee2mqtt only announces discovery
# and `bridge/state` at startup, so it does not come back on its own.
persistence true
persistence_location /mosquitto/data/

# Default is 1800s. A short interval bounds the retained state lost if the
# container is killed rather than shut down cleanly.
autosave_interval 60
