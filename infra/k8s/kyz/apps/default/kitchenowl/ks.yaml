---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kitchenowl
spec:
  components:
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./infra/k8s/kyz/apps/default/kitchenowl/app
  postBuild:
    substitute:
      APP: kitchenowl
      PVC: kitchenowl-data
      # Runs as 1000:1000 (the image's `kitchenowl` user), which is the
      # component's default KOPIUR_RUNAS — no override needed.
      # Distinct hour: the mover reads the live PVC (no CSI snapshots on
      # openebs-hostpath), so the SQLite DB is copied crash-consistent.
      KOPIUR_CRON: "H 15 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  dependsOn:
    - name: openebs # data PVC on the openebs-hostpath storage class
      namespace: openebs
  wait: false
