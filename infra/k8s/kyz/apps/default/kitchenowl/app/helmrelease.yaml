---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# KitchenOwl — shared grocery list + recipe manager. One image: the Flutter web
# build is served by uwsgi's [web] section on 8080 and proxies to the Flask app
# on :5000, with a Celery worker attached as a uwsgi daemon.
#
# Internal-only (envoy-internal). A grocery list is household data and the app
# does no rate limiting of its own; phones reach it on-LAN via k8s-gateway DNS
# and through the tunnel when away, neither of which needs envoy-external.
#
# The LLM settings are the reason this app is on the list at all, and they work
# because KitchenOwl calls the LiteLLM Python library directly:
#
#   LLM_MODEL    a LiteLLM model string. The `openai/` prefix is a client-side
#                routing hint: the library strips it and POSTs
#                {"model": "deepseek-v4.1-flash"} to LLM_API_URL — a LiteLLM
#                *alias* defined in the litellm-config ConfigMap, not an OpenAI
#                model. Model names are litellm's, not ours to invent.
#   LLM_API_URL  LiteLLM's api_base, so requests stay in-cluster and inherit
#                the gateway's spend tracking rather than going to OpenRouter.
#
# Setting the same list also enables the AI recipe generator
# (LLM_RECIPE_GENERATION, on by default once LLM_MODEL is set). Failure is
# SAFE: parseIngredientsStream wraps the call in try/except and falls through to
# the bundled local ingredient-parser NLP model, so a gateway outage degrades
# recipe import instead of breaking it. Verified in
# backend/app/service/ingredient_parsing.py (the `except Exception` before
# `yield {"status": "detecting_ingredients"}`).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kitchenowl
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kitchenowl
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: kitchenowl
    controllers:
      kitchenowl:
        # RWO PVC + SQLite: never run two pods against /data at once. Also
        # avoids fighting the Celery daemon over the same DB.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/tombursch/kitchenowl
              tag: v0.8.1@sha256:6a048135399691da25aec04ea107666cb7ce8eb46f5fed9a46a5ac254fe23073
            env:
              TZ: America/Chicago
              # Image default (ENV STORAGE_PATH=/data), restated so the write
              # path sits next to the PVC mount: /data/database.db +
              # /data/upload.
              STORAGE_PATH: /data
              LLM_MODEL: openai/deepseek-v4.1-flash
              LLM_API_URL: http://litellm.default.svc.cluster.local:4000/v1
              LLM_RECIPE_GENERATION: "true"
              # Built-in MCP endpoint at /mcp. uwsgi's [web] route explicitly
              # excludes /mcp from the SPA static-map, so it proxies to Flask.
              KITCHENOWL_MCP_ENABLED: "true"
              # OPEN_REGISTRATION gates whether the signup ROUTE IS REGISTERED AT
              # ALL (backend/app/controller/auth/auth_controller.py:
              # `if OPEN_REGISTRATION and not DISABLE_USERNAME_PASSWORD_LOGIN`),
              # and there is no CLI/management command that creates a user. So it
              # must be true for the first account and flipped back to "false"
              # immediately after — see docs/kitchenowl.md. Nothing else can
              # create the household owner.
              OPEN_REGISTRATION: "true"
            envFrom:
              - secretRef:
                  name: kitchenowl-secret
            probes:
              # Deliberately /api/health/<token>, not /: uwsgi's static-map
              # serves index.html for any extensionless path, so a probe on /
              # returns 200 even when Flask is down. 8080 (not 5000) because
              # :5000 is the internal socket — the image's own HEALTHCHECK
              # curls it, and it is not reachable through the Service.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health/8M4F88S8ooi4sMbLBfkkV7ctWwgibW6V
                    port: &port 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health/8M4F88S8ooi4sMbLBfkkV7ctWwgibW6V
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  # Generous: the startup path runs `flask db upgrade` plus
                  # upgrade_default_items.py before uwsgi binds.
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              # NOT read-only, unlike most apps here. entrypoint.sh `sed -i`s
              # wsgi.ini in place when /proc/net/if_inet6 is missing (the
              # sockets bind [::]), and uwsgi's smart-attach-daemon writes
              # /tmp/celery.pid for the bundled Celery worker. With
              # readOnlyRootFilesystem:true the sed would fail under `set -e`
              # and the container would exit before uwsgi ever started.
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                # uwsgi gevent pool + a Celery worker in the same container. No
                # CPU limit: recipe scraping is bursty and a quota throttles
                # below 100% on a node with no swap.
                memory: 1Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        # uid 1000 is the `kitchenowl` user the image creates and chowns /data
        # to. Starting AS 1000 makes entrypoint.sh skip its chown+gosu drop
        # (it only runs when id -u = 0), and fsGroup covers a fresh PVC.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: kitchenowl
        ports:
          http:
            appProtocol: http
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames:
          - kitchenowl.waltr.tech
        parentRefs:
          # Internal only: no envoy-external parentRef, so the phone apps reach
          # it on-LAN and through the tunnel, but it is not on the public DNS.
          - name: envoy-internal
            namespace: network
    persistence:
      # SQLite DB, uploaded recipe images, and the household data dir.
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: openebs-hostpath
        # Pinned: app-template only suffixes PVC names once a second PVC
        # exists, and the kopiur policy refers to this exact name.
        forceRename: kitchenowl-data
        globalMounts:
          - path: /data
