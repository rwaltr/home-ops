---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Two secrets, because KitchenOwl needs both an identity secret and a gateway key.
#
# JWT_SECRET_KEY — 1P item `kitchenowl` (vault home-ops), field `jwt_secret_key`.
# The image ships this as the literal string `PLEASE_CHANGE_ME`, which means
# every deployment in the world shares a signing key; refresh tokens are valid
# for 30 days by default (JWT_REFRESH_TOKEN_EXPIRES), so a known key is a real
# session-forgery path rather than a formality. Generate with `openssl rand -base64 48`.
#
# OPENAI_API_KEY — reuses item `litellm`, field `master_key`, the same value
# hermes-secret maps to LITELLM_API_KEY. KitchenOwl calls the LiteLLM Python
# library, and the library picks the credential from the model's provider
# prefix, so the `openai/…` model needs OPENAI_API_KEY. Pointing it at the
# LiteLLM master key (rather than an OpenRouter key) keeps spend accounting and
# model aliasing in one place. Homelab, single tenant — no virtual keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kitchenowl
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kitchenowl-secret
  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: kitchenowl
        property: jwt_secret_key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: litellm
        property: master_key
