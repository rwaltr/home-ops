---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# CLIProxyAPI — exposes Codex/ChatGPT, Claude, Gemini/Grok subscriptions as
# OpenAI-, Anthropic- and Gemini-compatible endpoints, one proxy for all of them.
# Cluster-internal on 8317; agentgateway is the front door, nothing external.
#
# The provider sessions are OAuth logins, which is why they cannot be declared
# anywhere: a human authorises each account once in a browser and the proxy
# receives a token pair, then refreshes and rewrites it in place. Hence the PVC at
# /data/.cli-proxy-api (oauth.auth-dir). Consequences that matter:
#   - the mount must be writable, so not a Secret;
#   - the tokens rotate, so a copy in 1Password would go stale and re-seeding it
#     would break the account;
#   - until a login exists the proxy runs and serves nothing. That is the honest
#     empty state, not a failure.
#
# Logging in, once per provider (needs a browser; pods/exec is deliberately not in
# Teletran's RBAC, so this is rwaltr's). --config is not optional: the flag defaults
# to an empty string upstream (DefaultConfigPath = ""), and the login subcommand
# loads the config to resolve oauth.auth-dir, so omitting it fails with
# "failed to load config file". --no-browser skips the launch attempt in a headless
# pod and prints tunnel instructions instead.
#   kubectl -n default exec -it deploy/cliproxyapi -- /CLIProxyAPI/CLIProxyAPI \
#     --config /etc/cliproxyapi/config.yaml --no-browser --codex-device-login
#   kubectl -n default exec -it deploy/cliproxyapi -- /CLIProxyAPI/CLIProxyAPI \
#     --config /etc/cliproxyapi/config.yaml --no-browser --claude-login
# Codex has a device-code flow (no callback into the pod); Claude prints a URL and
# then accepts the callback URL pasted back at its prompt. Callback ports: Claude
# 54545, Codex 1455, both overridable with --oauth-callback-port.
# The container keeps HOME=/data and the auth dir under it, so the tokens land on
# the PVC and survive pod rolls.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cliproxyapi
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cliproxyapi
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      cliproxyapi:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            # The image runs as an unprivileged uid; fsGroup makes the PVC
            # writable for it without chowning anything into place.
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 10000
            runAsNonRoot: true
            runAsUser: 10000
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: docker.io/eceasy/cli-proxy-api
              tag: v8.0.72@sha256:7cac48fd7f3ac0b7b6b73508d92179e29454087d9af81eb9a5c9fb50cdd87bc8
            command:
              - /CLIProxyAPI/CLIProxyAPI
            args:
              - --config
              - /etc/cliproxyapi/config.yaml
            env:
              # The proxy resolves the auth dir and its own state relative to
              # HOME; /data is the writable volume root, the config is elsewhere.
              HOME: /data
            ports:
              - name: http
                containerPort: 8317
                protocol: TCP
            probes:
              # No documented health endpoint; TCP on the port it actually
              # serves says "the process is up and listening", nothing more.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: http
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: http
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                # Memory capped because this node has no swap; no CPU limit.
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    persistence:
      # OAuth token pairs, refreshed and rewritten by the proxy.
      auth:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: openebs-hostpath
        # Pinned: app-template only suffixes PVC names once a second PVC exists,
        # and this name is what the login and any future kopiur policy refer to.
        forceRename: cliproxyapi-auth
        globalMounts:
          - path: /data/.cli-proxy-api
      config:
        type: secret
        name: cliproxyapi-config
        globalMounts:
          - path: /etc/cliproxyapi
            readOnly: true
      # Rootfs is read-only; anything that wants a scratch dir gets this.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        controller: cliproxyapi
        ports:
          http:
            port: 8317
            targetPort: http
