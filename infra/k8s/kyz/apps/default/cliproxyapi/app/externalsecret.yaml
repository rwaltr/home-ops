---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# CLIProxyAPI's config.yaml, rendered from 1Password rather than committed.
#
# The only secret here is the *client* key clients present to this proxy — the
# provider sessions are OAuth tokens that live on the PVC (see the HelmRelease),
# because a refresh token that rotates cannot be a Secret mount: write-back fails
# and a stale copy silently kills the account.
#
# Item `cliproxyapi` is minted by Terraform (infra/terraform/bootstrap/cliproxyapi.tf),
# the same pattern as the MikroTik MCP token: a generated value, not a pasted one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxyapi
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cliproxyapi-config
    template:
      data:
        config.yaml: |
          config-version: 8
          server:
            host: 0.0.0.0
            port: 8317
            # Discovery makes the container announce itself on the LAN; nothing
            # here looks for it.
            discovery:
              enabled: false
          management:
            allow-remote: false
            # No admin API and no control panel: the config is this file, reviewed
            # in git, and a second web surface is not worth its attack surface.
            secret-key: ""
            disable-control-panel: true
          access:
            api-keys:
              - "{{ .api_key }}"
          oauth:
            # On the PVC, not a Secret mount — the proxy rewrites these files as
            # it refreshes access tokens.
            auth-dir: /data/.cli-proxy-api
          routing:
            retry:
              request-retry: 2
          models:
            # Empty: do not fetch the vendor model catalogues from the internet on
            # start. The models available are whatever the linked accounts offer.
            catalog: ""
            codex-catalog: ""
            devin-catalog: ""
  data:
    - secretKey: api_key
      remoteRef:
        key: cliproxyapi
        property: password
