---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# HBOX_AUTH_API_KEY_PEPPER — 1Password item `homebox` (vault home-ops), field
# `api_key_pepper`.
#
# Required, not optional: HomeBox refuses to start when the pepper is shorter
# than 32 bytes, so the pod stays in CrashLoopBackOff until the item exists.
# Generate one with `openssl rand -base64 48`.
#
# It must also stay stable forever: the pepper is HMAC'd into every stored API
# key hash, so rotating it silently invalidates every key that has been issued —
# which is how the MCP server and homebox-companion authenticate.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homebox
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: homebox-secret
  data:
    - secretKey: HBOX_AUTH_API_KEY_PEPPER
      remoteRef:
        key: homebox
        property: api_key_pepper
