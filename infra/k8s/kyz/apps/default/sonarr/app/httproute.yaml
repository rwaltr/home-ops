---
# yaml-language-server: $schema=https://gateway-api.sigs.k8s.io/geps/gep-1748
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  annotations:
    # Listed on the Homepage dashboard — see docs/homepage.md.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Sonarr
    gethomepage.dev/description: TV library management
    gethomepage.dev/group: Media Ops
    gethomepage.dev/icon: sonarr.png
spec:
  hostnames:
    - sonarr.waltr.tech
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: sonarr
          port: 8989
