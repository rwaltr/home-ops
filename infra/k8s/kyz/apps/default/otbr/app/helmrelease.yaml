---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# OpenThread Border Router moved OFF the SLZB radio into the cluster.
#
# The SLZB-Ultima3 is switched to Mode "Thread to remote OTBR", which turns it
# into a Thread RCP (radio only) exposing Serial-over-IP on tcp/6638. It stays
# on the mgmt VLAN (its admin portal is unauthenticated and must not sit on the
# IoT VLAN). This pod runs otbr-agent, connects to the RCP over TCP (socat ->
# /tmp/ttyOTBR) and has a macvlan interface on the IoT VLAN, so the border
# agent, mDNS and SRP advertising proxy share L2 with the Thread devices AND
# matter-server. That is what fixes cross-VLAN Thread discovery (incl. the OTA
# provider) and the routed-path jitter.
#
# Dataset: seeded once from the otbr-dataset Secret (ExternalSecret -> 1Password)
# and then persisted in the /var/lib/thread PVC.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otbr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: otbr
  values:
    fullnameOverride: otbr
    controllers:
      otbr:
        strategy: Recreate
        containers:
          app:
            # bnutzer/otbr-tcp = openthread/otbr + socat + s6 wiring for a
            # network-attached RCP. RCP_* / OTBR_* env names are its contract.
            image:
              repository: docker.io/bnutzer/otbr-tcp
              tag: latest@sha256:ddcec2e860857c4767110ed4c6b04ffe1d3f1aa1dd4e2af520f1d03fb0beef39
            env:
              TZ: America/Chicago
              # Radio (SLZB "Thread to remote OTBR", tcp/6638 on mgmt VLAN)
              RCP_USE_TCP: "1"
              RCP_HOST: 10.10.0.101
              RCP_PORT: "6638"
              RCP_BAUDRATE: "460800"
              RCP_TTY: /tmp/ttyOTBR
              OTBR_THREAD_IF: wpan0
              # The macvlan interface from the multus annotation below.
              OTBR_BACKBONE_IF: net1
              OTBR_LOG_LEVEL_INT: "6"
              OTBR_WEB_ENABLE: "0"
              # Bind the (unauthenticated) REST API to the Cilium pod IP only,
              # never the IoT macvlan, so untrusted IoT devices cannot reach it.
              # HA reaches it via the ClusterIP Service.
              OTBR_REST_LISTEN_ADDRESS:
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
              OTBR_REST_LISTEN_PORT: "8081"
              OTBR_DATASET_TLV:
                valueFrom:
                  secretKeyRef:
                    name: otbr-dataset
                    key: dataset-tlv
            # Launch the dataset seeding detached: otbr-agent answers ot-ctl
            # only once the RCP is reachable, which can lag container start.
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/bash
                    - -c
                    - "nohup /bin/bash /opt/otbr-bootstrap/seed-dataset.sh >/var/lib/thread/seed-dataset.log 2>&1 & exit 0"
            securityContext:
              # otbr-agent creates the wpan0 TUN device and manipulates net1
              # (addresses, routes, RA). The upstream image expects privileged +
              # /dev/net/tun.
              privileged: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
            probes:
              readiness:
                enabled: true
                path: /node
                port: 8081
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
                type: HTTP
              liveness:
                enabled: true
                path: /node
                port: 8081
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
                type: HTTP
    defaultPodOptions:
      annotations:
        # IoT VLAN presence so the border agent/mDNS/SRP share L2 with the
        # devices and matter-server. Static IP below the DHCP pool, pinned MAC
        # (HA .10, matter-server .11).
        k8s.v1.cni.cncf.io/networks: |-
          [{"name": "iot", "namespace": "kube-system", "ips": ["10.30.0.12/23"], "mac": "a6:30:00:10:30:0c"}]
    service:
      app:
        controller: otbr
        ports:
          rest:
            port: 8081
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: openebs-hostpath
        globalMounts:
          - path: /var/lib/thread
      bootstrap:
        type: configMap
        name: otbr-bootstrap
        globalMounts:
          - path: /opt/otbr-bootstrap
            readOnly: true
