---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Thread Active Operational Dataset (TLV hex), stored in the 1Password item
# `132l-thread` (field `TLV`) in the `home-ops` vault. Same value as HA's
# /config/.storage/thread.datasets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otbr-dataset
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: otbr-dataset
  data:
    - secretKey: dataset-tlv
      remoteRef:
        key: 132l-thread
        property: TLV
