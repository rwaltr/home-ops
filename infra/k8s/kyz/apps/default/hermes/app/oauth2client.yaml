---
# Kanidm OIDC client for Teletran's dashboard. Limit login to Kanidm admins.
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: hermes
spec:
  kanidmRef:
    name: kanidm
    namespace: identity
  displayname: Hermes Sysadmin
  origin: https://hermes.waltr.tech
  redirectUrl:
    - https://hermes.waltr.tech/auth/callback
  public: false
  scopeMap:
    - group: idm_admins
      scopes:
        - openid
        - profile
        - email
  disableConsentPrompt: true
  preferShortUsername: true
  secretKeyAliases:
    clientId:
      - HERMES_DASHBOARD_OIDC_CLIENT_ID
    clientSecret:
      - HERMES_DASHBOARD_OIDC_CLIENT_SECRET
