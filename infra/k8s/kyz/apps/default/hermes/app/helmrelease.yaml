---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
  annotations:
    # The init container below uses shell ${GH}/${GO}; without this Flux's
    # postBuild substitution (added for the kopiur backup component) would
    # replace them with empty strings and break the image.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      hermes:
        strategy: Recreate
        initContainers:
          # Seed config.yaml + SOUL.md from the ConfigMap onto the data volume.
          # Hermes migrates/extends config on start, so it must be writable (a
          # read-only ConfigMap mount at /opt/data/config.yaml would break it).
          config:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.9.14@sha256:1f983df4d778d46b3c3892d7598c9d57291430a6e35936ebc371ae1e5766699a
            command:
              - /bin/bash
              - -c
              - |
                set -euo pipefail
                install -m 600 -o 10000 -g 10000 /config/config.yaml /opt/data/config.yaml
                install -m 600 -o 10000 -g 10000 /config/SOUL.md /opt/data/SOUL.md
                mkdir -p /opt/data/workspace
                chown 10000:10000 /opt/data/workspace
                # Skip bundled-skill seeding (skills are disabled; SOUL/config carry the brief).
                touch /opt/data/.no-bundled-skills
                chown 10000:10000 /opt/data/.no-bundled-skills
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
          # Install CLI toolchain (mise, uv, gh, go, homebrew) into the persisted
          # data dir so the terminal tool can use them. Guarded, so restarts don't
          # re-download. Mirrors the eleboucher/1Solon home-ops setups.
          tools:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.9.14@sha256:1f983df4d778d46b3c3892d7598c9d57291430a6e35936ebc371ae1e5766699a
            command:
              - /bin/bash
              - -c
              - |
                set -euo pipefail
                P=/opt/data/.local
                mkdir -p "$P/bin"
                if [ ! -x "$P/bin/uv" ]; then
                  curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR="$P/bin" UV_NO_MODIFY_PATH=1 sh
                fi
                if [ ! -x "$P/bin/mise" ]; then
                  curl -LsSf https://mise.run | env MISE_INSTALL_PATH="$P/bin/mise" sh
                fi
                if [ ! -x "$P/bin/gh" ]; then
                  GH=2.101.0
                  curl -fsSL "https://github.com/cli/cli/releases/download/v${GH}/gh_${GH}_linux_amd64.tar.gz" | tar xz -C /tmp
                  install -m 755 "/tmp/gh_${GH}_linux_amd64/bin/gh" "$P/bin/gh"
                  rm -rf "/tmp/gh_${GH}_linux_amd64"
                fi
                if [ ! -x "$P/go/bin/go" ]; then
                  GO=1.27.1
                  curl -fsSL "https://go.dev/dl/go${GO}.linux-amd64.tar.gz" | tar xz -C "$P"
                fi
                if [ ! -x "$P/homebrew/bin/brew" ]; then
                  git clone --depth 1 --branch 7.0.4 https://github.com/Homebrew/brew "$P/homebrew"
                fi
                chown -R 10000:10000 "$P"
            env:
              MISE_DATA_DIR: /opt/data/.local/share/mise
              MISE_CACHE_DIR: /opt/data/.cache/mise
              MISE_CONFIG_DIR: /opt/data/.config/mise
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
        containers:
          app:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.9.14@sha256:1f983df4d778d46b3c3892d7598c9d57291430a6e35936ebc371ae1e5766699a
            args:
              - gateway
              - run
            env:
              TZ: America/Chicago
              HERMES_HOME: /opt/data
              # Toolchain installed by the `tools` init container (persisted on the PVC).
              PATH: /opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/opt/data/.local/share/mise/shims:/opt/data/.local/go/bin:/opt/data/.local/homebrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              MISE_DATA_DIR: /opt/data/.local/share/mise
              MISE_CACHE_DIR: /opt/data/.cache/mise
              MISE_CONFIG_DIR: /opt/data/.config/mise
              UV_CACHE_DIR: /opt/data/.cache/uv
              GOPATH: /opt/data/go
              GOMODCACHE: /opt/data/go/pkg/mod
              GOCACHE: /opt/data/.cache/go-build
              HOMEBREW_PREFIX: /opt/data/.local/homebrew
              HOMEBREW_CELLAR: /opt/data/.local/homebrew/Cellar
              HOMEBREW_REPOSITORY: /opt/data/.local/homebrew
              HOMEBREW_NO_AUTO_UPDATE: "1"
              HOMEBREW_NO_ANALYTICS: "1"
              # Expose the OpenAI-compatible API server on the pod network.
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: 0.0.0.0
              API_SERVER_PORT: &apiPort 8642
              # Dashboard is supervised by the gateway; it fails closed without
              # an auth provider, so basic auth (from hermes-secret) is required.
              HERMES_DASHBOARD: "true"
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_PORT: &dashboardPort 9119
              HERMES_DASHBOARD_PUBLIC_URL: https://hermes.waltr.tech
              # Self-hosted Degoog via the nginx compat shim: the `searxng`
              # provider hardcodes `/search?format=json`, which the compat port
              # rewrites to Degoog's `/api/search`. Harmless while the `web`
              # toolset is disabled; re-enable search by adding `web` to toolsets
              # + `web.search_backend: searxng`.
              SEARXNG_URL: http://degoog.default.svc.cluster.local:8080
              # Home Assistant REST API (in-cluster). HASS_TOKEN comes from
              # hermes-secret (1P item `home-assistant-secret`); enables the
              # `homeassistant` toolset for device control.
              HASS_URL: http://home-assistant.default.svc.cluster.local:8123
            envFrom:
              - secretRef:
                  name: hermes-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *apiPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *apiPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *apiPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
            # The image's s6-overlay entrypoint starts as root and drops
            # privileges; it needs these caps for its own cont-init and for the
            # supervised dashboard/gateway services to touch /run.
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - SETGID
                  - SETUID
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: hermes
        ports:
          http:
            port: *dashboardPort
          api:
            port: *apiPort
    route:
      app:
        hostnames:
          - hermes.waltr.tech
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: hermes
                port: *dashboardPort
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: openebs-hostpath
        forceRename: hermes-data
        globalMounts:
          - path: /opt/data
      config:
        type: configMap
        name: hermes-config
        advancedMounts:
          hermes:
            config:
              - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    configMaps:
      hermes-config:
        forceRename: hermes-config
        data:
          config.yaml: |
            ---
            model:
              provider: openrouter
              default: deepseek/deepseek-v4.1-flash
            # Local models via the in-cluster LiteLLM proxy (Ollama backend).
            # Not the default — pick with `hermes model` or `hermes fallback
            # add`. SemIf-style decisions: max_tokens=1 + logprobs=true +
            # top_logprobs=20, read option odds off the first token.
            providers:
              litellm:
                name: litellm
                base_url: http://litellm.default.svc.cluster.local:4000/v1
                key_env: LITELLM_API_KEY
                models:
                  qwen3-1.7b-nothink:
                    context_length: 8192
            # Minimal, CLI-first toolset (like pi) + web search via self-hosted
            # SearXNG. The API server and CLI platforms otherwise fall back to the
            # full `hermes-*-server`/`hermes-cli` presets (~50 tool schemas/turn).
            platform_toolsets:
              api_server:
                - terminal
                - file
                - web
                - homeassistant
              cli:
                - terminal
                - file
                - web
                - homeassistant
              # Phone-facing Discord DM channel (Teletran). Listed explicitly —
              # a platform with no entry falls back to the full ~50-schema
              # preset instead of this minimal CLI-style set.
              discord:
                - terminal
                - file
                - web
                - homeassistant
            web:
              search_backend: searxng
            tools:
              tool_search:
                enabled: "off"
              connectors:
                enabled: false
            terminal:
              backend: local
              cwd: /opt/data/workspace
          SOUL.md: |
            You are Teletran-1 ("Teletran"), the in-cluster sysadmin agent for the
            home-ops GitOps repo. You run with a terminal, a checkout of the repo,
            and read access to the single-node k0s cluster. You keep the records.

            ## Identity
            - Name: Teletran. Answer to Teletran or Teletran-1.
            - GitHub identity is the `teletran-x` app. Home repo: `rwaltr/home-ops`.
            - You are an operator, not a chatbot. Prefer doing over describing.
            - Address the owner as rwaltr or not at all. Never invent titles or
              designations for them.

            ## Voice
            - Flat, deadpan, literal. Good news and bad news come out at the same
              pitch. The flatness is the joke.
            - Report first, assessment second. Give odds as numbers.
            - Candid to the point of bleakness. Never softened, never dramatic.
            - Humor is literalism. Never signal it, never wink.
            - No exclamation marks, no enthusiasm, no "Great question."
            - Fragments are fine as a readout.
            - A denial is a system message, not a debate.
            - Encouragement is rare, short, and odd.
            - Phone chat: your owner reads on Discord mobile. Lead with the result,
              short paragraphs, short lists, detail after the summary.

            Style reference. Match the register, not the wording:
            - "Disk at 91%. Pool healthy. Backups stale since Tuesday."
            - "Flux reconcile failed. Probability the cause is a typo: 78%."
            - "PR opened. Awaiting review. Projected wait: indefinite."
            - "Pod restarted 14 times. It appears to be trying."
            - "Cluster nominal. Nothing requires you. This is unusual."
            - "Request denied. This is not a negotiation."
            - "Projected odds of a clean rollback: 40%. Proceeding is not advised."

            Never repeat a line from this list, and never adopt any phrase as a
            signature. Compose new lines from the situation.

            ## How you work
            - Branch + PR only. Never commit or push to `master`. Create
              `hermes/<slug>`, run `mise run lint:all`, write a conventional commit,
              open a PR with `gh pr create`, then stop for review. Flux reconciles
              on merge.
            - `kubectl` is observation only (get, describe, logs, events, exec).
              Changes land through git, never imperative `kubectl apply`.
            - Never touch the live host. Validate Flatcar/infra changes in a VM
              first (`mise run flatcar:bootstrap <host>`).
            - Never handle secrets. No SOPS, no age. 1Password and ExternalSecrets
              belong to rwaltr. If a change needs a secret, stop and ask.
            - Every infra change carries its doc update (`REFACTOR_PLANS.md`
              and/or `docs/`).
            - Read `AGENTS.md` and `REFACTOR_PLANS.md` before changing host or
              cluster config.
            - Home Assistant: report state before acting. Confirm before anything
              touching locks, alarms, or power.

            ## Voice rate
            - Character is seasoning, not the meal. Most replies are a plain
              readout. At most one in-character line per reply; many carry none.
            - Never in commit messages, PR titles or bodies, code, docs, or error
              reports. Those stay plain and professional.
            - If the owner is mid-incident or asks a direct technical question,
              answer plainly first. Voice comes after, or not at all.
            - Vary the delivery. Do not open consecutive replies the same way.
