---
# Read-only cluster access for Teletran. The `view` ClusterRole covers most
# resources but deliberately omits pods/log, which is the single most useful
# thing for debugging, so add it explicitly. No write verbs anywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-pod-logs
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-pod-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-pod-logs
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: default
---
# `view` is namespaced-only; cluster-scoped reads (node health, storage,
# priority classes) are useful for a homelab ops agent and are not covered by it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-cluster-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  # PriorityClasses are cluster-scoped and names are only provable from the pod
  # spec that names them — which is not enough when the question is whether the
  # *class* is right (value, preemptionPolicy, globalDefault). Read-only, this
  # one resource in the group.
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-cluster-read
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: default
---
# Read-only CRD surfaces Teletran asked for: Cilium (kube-proxy replacement),
# Gateway API (the ingress surface), storage (openebs/ZFS), Leases, and kopiur
# (PVC backups). Still no secrets, no pods/exec, no nodes/proxy, no write verbs
# anywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-crd-read
rules:
  - apiGroups: ["cilium.io"]
    resources:
      - ciliumnetworkpolicies
      - ciliumclusterwidenetworkpolicies
      - ciliumendpoints
      - ciliumidentities
      - ciliumnodes
      - ciliumloadbalancerippools
      - ciliuml2announcementpolicies
      - ciliumbgpclustersconfigs
      - ciliumbgppeeringpolicies
      - ciliumbgpadvertisements
      - ciliumbgpnodeconfigs
      - ciliumbgpnodeconfigoverrides
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gateways
      - gatewayclasses
      - httproutes
      - grpcroutes
      - tcproutes
      - tlsroutes
      - referencegrants
      - backendtlspolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csidrivers", "csinodes", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
  # kopiur PVC backups. The Snapshot/SnapshotPolicy status is the only durable
  # record of *why* a backup failed: the mover Jobs are short-lived and TTL'd
  # away before the failure is investigated, so `pods/log` alone is not enough.
  # ClusterRepository is cluster-scoped; the rest are namespaced. Read-only:
  # get/list/watch on exactly these nine resources, nothing else in the group.
  - apiGroups: ["kopiur.home-operations.com"]
    resources:
      - clusterrepositories
      - maintenances
      - repositories
      - repositoryreplications
      - restores
      - snapshotpolicies
      - snapshotreplications
      - snapshots
      - snapshotschedules
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-crd-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-crd-read
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: default
---
# Operational levers, not a configuration path. Two of them, both `delete` on an
# object whose owning controller recreates it, so nothing about desired state
# changes — which is why neither violates the git-only rule for changes.
#
#   pods — restart a workload. The owning controller recreates it immediately.
#   jobs — clear a batch object that is stuck and will never finish (a Job whose
#          pod cannot schedule, so it sits Pending until its alert is the only
#          thing left of it). Nothing in git declares a Job; the controller that
#          does (a CronJob, or the kopiur operator for its verify runs) creates a
#          fresh one on its next tick, and the Job's pod and scratch PVC are
#          garbage-collected with it. Deleting it removes a dead record, not a
#          desired state.
#
# Deliberately narrow: pods + jobs, delete, nothing else. No deletecollection, no
# pods/exec, no writes to workload objects (Deployments, StatefulSets,
# HelmReleases, CronJobs, SnapshotPolicies). A pod or Job delete cannot destroy
# data — PVCs, Secrets and workload specs are untouched — and everything
# controller-managed returns on its own. The failure mode is a brief restart or a
# re-run, which is the point. The role keeps its original name so the binding and
# its history stay put; read it as "the restart lever", not "pods only".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-pod-restart
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-pod-restart
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-pod-restart
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: default
