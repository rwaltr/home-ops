---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# Kopia enrollment for Hermes Agent's data PVC (config, sessions, skills,
# memories). copyMethod: Direct — crash-consistent live reads
# (openebs-hostpath has no CSI snapshots). The mover runs as 10000:10000 to
# read /opt/data (the in-image `hermes` user).
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: hermes
  namespace: default
spec:
  repository:
    kind: ClusterRepository
    name: cluster-kopia
  sources:
    - pvc:
        name: hermes-data
      sourcePathStrategy: PvcName
  copyMethod: Direct
  mover:
    securityContext:
      runAsUser: 10000
      runAsGroup: 10000
    podSecurityContext:
      fsGroup: 10000
  retention:
    keepLatest: 7
    keepDaily: 14
    keepWeekly: 4
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: hermes-nightly
  namespace: default
spec:
  policyRef:
    name: hermes
  schedule:
    cron: "H 3 * * *"
    jitter: 30m
    runOnCreate: false
