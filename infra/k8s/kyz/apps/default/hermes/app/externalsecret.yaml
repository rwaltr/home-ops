---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Sysadmin Hermes credentials. Dashboard login uses the KanidmOAuth2Client Secret.
#   - OpenRouter API key: item `OpenRouter API Key`, field `credential`
#   - Home Assistant: item `home-assistant-secret`, field `prometheus_token`
#
# Matrix credentials live in their own ExternalSecret below, so a missing bot item
# cannot stop this Secret (and the running pod) from syncing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-secret
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: OpenRouter API Key
        property: credential
    # Home Assistant control (the `homeassistant` toolset). Reuse the
    # existing long-lived token that Prometheus scrapes with.
    - secretKey: HASS_TOKEN
      remoteRef:
        key: home-assistant-secret
        property: prometheus_token
---
# Keep the GitHub App signing key out of the Hermes app container. Only the
# repo init container and credential-broker sidecar consume this Secret. Its
# 1Password source is `teletraan-x github app`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-gitcreds
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-gitcreds-secret
  data:
    - secretKey: GITHUB_APP_CLIENT_ID
      remoteRef:
        key: teletraan-x github app
        property: client id
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: teletraan-x github app
        property: pem
