---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Model + dashboard credentials for Hermes Agent.
#   - OpenRouter API key: 1P item `OpenRouter API Key` (vault home-ops), field `credential`
#   - API server + dashboard auth: 1P item `hermes` (vault home-ops)
#   - Discord (Teletran) bot: 1P item `hermes`, fields `discord_bot_token`
#     and `discord_allowed_users`
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-secret
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: OpenRouter API Key
        property: credential
    # Local models via the in-cluster LiteLLM proxy (providers.litellm in
    # config.yaml). Same 1P item/field as litellm-secret's LITELLM_MASTER_KEY.
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm
        property: master_key
    - secretKey: API_SERVER_KEY
      remoteRef:
        key: hermes
        property: api_server_key
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      remoteRef:
        key: hermes
        property: dashboard_username
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      remoteRef:
        key: hermes
        property: dashboard_password
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_SECRET
      remoteRef:
        key: hermes
        property: dashboard_secret
    # Phone-facing Discord DM channel. The bot is enabled by the presence of
    # DISCORD_BOT_TOKEN; DISCORD_ALLOWED_USERS is the user-ID allowlist.
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef:
        key: hermes
        property: discord_bot_token
    - secretKey: DISCORD_ALLOWED_USERS
      remoteRef:
        key: hermes
        property: discord_allowed_users
