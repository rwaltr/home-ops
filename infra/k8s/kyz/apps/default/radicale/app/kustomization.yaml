---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: radicale-config
    files:
      - config=./config
      - bootstrap.sh=./bootstrap.sh
generatorOptions:
  disableNameSuffixHash: true
