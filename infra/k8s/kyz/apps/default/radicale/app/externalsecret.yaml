---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The client credentials Radicale authenticates against, straight from 1Password:
# one CONCEALED field per account in item `radicale-secret` (`rwaltr`, `sam`,
# `ha` -> `home-assistant`, `remind-export`) holding that account's plaintext
# password — the same value a human types into a phone and the same value
# `op://home-ops/radicale-secret/<account>` returns.
#
# The htpasswd *file* is deliberately not stored anywhere. bootstrap.sh runs
# `bcrypt` over these passwords into /etc/radicale-users/users at every pod
# start, so rotating a credential is one 1Password edit: this Secret refreshes
# (1h), reloader rolls the pod, the hash is rebuilt.
#
# That replaces the old design, where a hand-generated bcrypt blob lived in the
# item's note and had to be regenerated by hand whenever a password changed. It
# drifted — the project sat broken with 401s for every account because the note's
# hashes matched none of these fields. See docs/calendar.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radicale
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: radicale-users
    template:
      data:
        rwaltr: "{{ .rwaltr }}"
        sam: "{{ .sam }}"
        home-assistant: "{{ .ha }}"
        remind-export: "{{ .remind-export }}"
  dataFrom:
    - extract:
        key: radicale-secret
