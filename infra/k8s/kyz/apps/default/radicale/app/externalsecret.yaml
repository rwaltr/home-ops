---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The htpasswd file Radicale authenticates against. One bcrypt entry per client
# credential (rwaltr, sam, home-assistant, remind-export) — the account list,
# the `htpasswd -B` invocation and the share rows that reference each account
# are in docs/calendar.md.
#
# 1Password item `radicale-secret` is a Secure Note, and its *body* is the
# htpasswd file: 1Password only stores multi-line text in the note field, so this
# reads `notesPlain` rather than a named field. The same item carries one
# single-line CONCEALED field per account holding that account's plaintext
# password (for humans, phones and `op://home-ops/radicale-secret/<account>`
# reads); those are deliberately not consumed here.
#
# The pod will not start until the item's note body holds the four lines.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radicale
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: radicale-users
    template:
      data:
        users: "{{ .notesPlain }}"
  dataFrom:
    - extract:
        key: radicale-secret
