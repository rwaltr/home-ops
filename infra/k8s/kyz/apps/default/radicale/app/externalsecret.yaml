---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The htpasswd file Radicale authenticates against. One bcrypt entry per client
# credential (rwaltr, sam, home-assistant, remind-export) — the account list,
# the `htpasswd -B` invocation and the share rows that reference each account
# are in docs/calendar.md.
#
# 1Password item: `radicale-secret`, field `htpasswd`. The pod will not start
# until that item exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radicale
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: radicale-users
    template:
      data:
        users: "{{ .htpasswd }}"
  dataFrom:
    - extract:
        key: radicale-secret
