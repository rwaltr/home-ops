---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: radicale
spec:
  components:
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./infra/k8s/kyz/apps/default/radicale/app
  postBuild:
    substitute:
      APP: radicale
      PVC: radicale-collections
      # Distinct hour: the mover Job reads the live PVC (no CSI snapshots on
      # openebs-hostpath) and a calendar write landing mid-copy is a lost event.
      KOPIUR_CRON: "H 5 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  dependsOn:
    - name: openebs # PVCs on the openebs-hostpath storage class
      namespace: openebs
  wait: false
