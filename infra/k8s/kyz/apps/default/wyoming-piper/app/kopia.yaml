---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# Kopia enrollment for the piper data PVC (the GLaDOS voice files, ~62MB).
# Regenerable — the init container re-fetches them — but backing up avoids a
# network dependency on the upstream GitHub repo after a PVC loss.
# copyMethod: Direct, since openebs-hostpath has no CSI snapshots.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: wyoming-piper
  namespace: default
spec:
  repository:
    kind: ClusterRepository
    name: cluster-kopia
  sources:
    - pvc:
        # Single-PVC app: app-template names it just <fullname>.
        name: wyoming-piper
      sourcePathStrategy: PvcName
  copyMethod: Direct
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    podSecurityContext:
      fsGroup: 1000
  retention:
    keepLatest: 7
    keepDaily: 14
    keepWeekly: 4
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: wyoming-piper-nightly
  namespace: default
spec:
  policyRef:
    name: wyoming-piper
  schedule:
    cron: "H 2 * * *"
    jitter: 30m
    runOnCreate: false
