---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# LiteLLM secret — two upstream credentials:
#   LITELLM_MASTER_KEY      — 1P item `litellm`, field `master_key`. Clients
#                             authenticate to this proxy with it (hermes uses
#                             the same item for its LITELLM_API_KEY; homelab,
#                             single tenant — no virtual keys).
#   DANMANNERS_LLM_API_KEY  — 1P item `llm.cloud.danmanners.com`, field
#                             `credential`. Outbound key for Dan Manners' shared
#                             LiteLLM gateway (see the model_list in the
#                             HelmRelease).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: litellm-secret
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: litellm
        property: master_key
    - secretKey: DANMANNERS_LLM_API_KEY
      remoteRef:
        key: llm.cloud.danmanners.com
        property: credential
