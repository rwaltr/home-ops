---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# LiteLLM master key — 1P item `litellm` (vault home-ops), field `master_key`.
# The same item/field feeds hermes-secret's LITELLM_API_KEY (hermes authenticates
# to the proxy with the master key; homelab, single tenant — no virtual keys).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: litellm-secret
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: litellm
        property: master_key
