---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# LiteLLM proxy — one OpenAI-compatible endpoint for cloud models and audio,
# with key auth, spend tracking and model aliasing. Hermes reaches it as a
# custom provider:
#   http://litellm.default.svc.cluster.local:4000/v1
#
# Upstreams: OpenRouter (cloud chat) and Dan Manners' shared LiteLLM gateway
# (self-hosted Qwen3-32B / Llama / gpt-oss — see the model_list below). Audio
# stays on the in-pod speaches sidecar.
#
# Single pod, two containers: litellm plus the speaches audio sidecar.
#
# No local LLM is served here any more. The ollama sidecar held exactly one
# model (qwen3-1.7b-nothink) and everything that used it is gone as of
# 2026-11-09: as a chat model it was fine, but it could not do the one job the
# cluster had for it — classify text. Measured: it returned variable names
# instead of secret values, missed 6 of 9 credentials in a 1.9k-token context
# (biased to the head), scored P=1.000 on placeholders like ${API_TOKEN} and
# <REDACTED> while scoring a real AKIA key at P=0.146, echoed the input when
# asked to redact, and lost to a 7-pattern regex as a line classifier (F1 0.632
# vs 0.875). See docs/local-llm.md.
#
# A local model belongs in its own sidecar, not bolted back onto this pod:
# Cactus Needle 3 (8-29MB, tool calls + structured extraction) runs on the
# cactus-compute runtime and ships no GGUF, so ollama could never host it.
#
# Tried and dropped, for the record: MiniCPM5-2B (reasoning preamble on every
# reply, weak tool calls), acon96/Home-FunctionGemma-270m (loops its function
# call — no usable stop token).
#
# Decision scoring (SemIf-style) still works through the proxy for any backend
# that returns logprobs: max_tokens=1, logprobs=true, top_logprobs=20, read the
# option odds off the first token. Always set top_logprobs explicitly
# (litellm#21932).

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: litellm
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: litellm
    controllers:
      litellm:
        strategy: Recreate # single RWO models PVC
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/berriai/litellm
              tag: main-stable@sha256:c560d317136880ea92d62334d4367ab10955b1af189dd3ea24f6551290b1d6c1
            args:
              - --config
              - /config/config.yaml
              - --host
              - 0.0.0.0
              - --port
              - "4000"
            env:
              TZ: America/Chicago
              # OpenRouter backend key — reuses the existing hermes-secret
              # (same 1P item) rather than duplicating it into litellm-secret.
              OPENROUTER_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: OPENROUTER_API_KEY
            envFrom:
              - secretRef:
                  name: litellm-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: &port 4000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                # 30d p95 507Mi, peak 511Mi -- the old 512Mi limit sat within
                # ~1MiB of the peak, so a concurrent-request burst OOMKilled the
                # container (2026-11-09) and paged. Request from the p95, limit
                # at 2x the peak.
                memory: 512Mi
              limits:
                memory: 1Gi
          # OpenAI-compatible STT/TTS (faster-whisper + piper) so LiteLLM can
          # front audio models too. The wyoming protocol has no OpenAI shim,
          # so this is a SECOND copy of whisper/piper alongside the wyoming-*
          # pods (which HA keeps using) — STT_MODEL_TTL bounds the cost.
          # Future consolidation: swap HA's wyoming integration to
          # roryeckel/wyoming_openai (wyoming server -> OpenAI backend)
          # pointing here, then delete the wyoming-* pods.
          speaches:
            image:
              repository: ghcr.io/speaches-ai/speaches
              tag: 0.8.3-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
            env:
              TZ: America/Chicago
              WHISPER__INFERENCE_DEVICE: cpu
              WHISPER__COMPUTE_TYPE: int8
              # Unload whisper after 5m idle — small-int8 is ~500Mi we don't
              # need held while nobody is transcribing.
              STT_MODEL_TTL: "300"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &speachesPort 8000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *speachesPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 500m
                # 30d p95 156Mi, peak 190Mi; raised from 1Gi. The 2Gi limit still
                # covers a full whisper small-int8 load.
                memory: 384Mi
              limits:
                # whisper small-int8 ~500Mi + piper voice ~150Mi + runtime.
                memory: 2Gi
    service:
      app:
        controller: litellm
        ports:
          http:
            port: 4000
          # Direct speaches access (debug, voice/model probing).
          audio:
            port: 8000
    route:
      app:
        annotations:
          # Listed on the Homepage dashboard — see docs/homepage.md.
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: LiteLLM
          gethomepage.dev/description: OpenAI-compatible chat and speech gateway
          gethomepage.dev/group: AI
          gethomepage.dev/icon: sh-litellm
        hostnames:
          - litellm.waltr.tech
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: litellm
                port: 4000
    persistence:
      models:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: openebs-hostpath
        forceRename: litellm-models
        advancedMounts:
          litellm:
            speaches:
              # Mount the PVC AT the hub cache path, not one level above it.
              # Mounting over ~/.cache/huggingface hides the image's
              # pre-created `hub/` dir, so huggingface_hub.scan_cache_dir()
              # raises CacheNotFound and every /v1/models, STT and TTS request
              # in this container 500s (found 2026-11-09 via litellm's piper).
              - path: /home/ubuntu/.cache/huggingface/hub
      config:
        type: configMap
        name: litellm-config
        advancedMounts:
          litellm:
            app:
              - path: /config
    configMaps:
      litellm-config:
        forceRename: litellm-config
        data:
          config.yaml: |
            model_list:
              # OpenRouter cloud models ride the same proxy/key — one
              # endpoint for local + cloud. Key comes from hermes-secret.
              - model_name: deepseek-v4.1-flash
                litellm_params:
                  model: openrouter/deepseek/deepseek-v4.1-flash
                  api_key: os.environ/OPENROUTER_API_KEY
              # Vision aliases for photo intake. homebox-companion calls this
              # proxy through the LiteLLM *library* with an OpenAI-compatible
              # api_base, so it addresses these as `openai/<alias>` and the
              # proxy resolves the alias. Both read image input; both were
              # measured on a real walkthrough (49 frames @1fps) before this
              # was added — see the comparison in REFACTOR_PLANS.md.
              #   qwen3.8-omni-flash — companion's default. Also takes audio
              #   and video, which is why the walkthrough-intake route uses it:
              #   one 49s clip cost ~26.7k tokens and returned 20 items, more
              #   cheaply than 49 still frames. Slower per photo (19.3s avg,
              #   96.7s worst) than luna (9.0s/18.1s), so swap in Settings if
              #   the photo path feels sluggish.
              #   gpt-5.6-luna — companion's own documented default, and the
              #   faster of the two on single photos.
              # Image barcodes are read by both, with occasional bad digits:
              # validate the ISBN-13 check digit before trusting one.
              - model_name: qwen3.8-omni-flash
                litellm_params:
                  model: openrouter/qwen/qwen3.8-omni-flash
                  api_key: os.environ/OPENROUTER_API_KEY
              - model_name: gpt-5.6-luna
                litellm_params:
                  model: openrouter/openai/gpt-5.6-luna
                  api_key: os.environ/OPENROUTER_API_KEY
              # Dan Manners' shared LiteLLM gateway — another LiteLLM proxy at
              # https://llm.cloud.danmanners.com/v1. Only the models backed by
              # hardware on his network are aliased here: they cost nothing and
              # keep document text off a cloud provider.
              #   nvidia-llama -> nvidia-qwen3-32b-nvfp4 (vLLM, 151k ctx)
              #   intel-llama  -> llama                (PARKED 2026-11-11, see below)
              #   intel-vl     -> Qwen3-VL-8B           (llama.cpp SYCL, vision)
              #   gptoss-llama -> gpt-oss-20b-f16      (114k ctx)
              # His catalog also carries cloud-backed models (zai/glm-*, and the
              # misleadingly-named media-analysis/decision/embed-text which
              # resolve to OpenRouter/OpenAI) — deliberately not proxied. Outbound
              # key: 1P item `llm.cloud.danmanners.com` / field `credential`.
              - model_name: nvidia-llama
                litellm_params:
                  model: openai/nvidia-llama
                  api_base: https://llm.cloud.danmanners.com/v1
                  api_key: os.environ/DANMANNERS_LLM_API_KEY
              # Parked on his side in favour of intel-vl on the same Arc, so calls
              # to it 500 until he roles Flint back. Kept aliased for that reason.
              - model_name: intel-llama
                litellm_params:
                  model: openai/intel-llama
                  api_base: https://llm.cloud.danmanners.com/v1
                  api_key: os.environ/DANMANNERS_LLM_API_KEY
              # The local vision model: Qwen3-VL-8B on his Intel ARC B70 PRO,
              # served by llama.cpp (SYCL) in place of intel-llama. This is what
              # keeps photographed documents off a model provider - the same
              # rationale as the aliases above, but for image input.
              - model_name: intel-vl
                litellm_params:
                  model: openai/intel-vl
                  api_base: https://llm.cloud.danmanners.com/v1
                  api_key: os.environ/DANMANNERS_LLM_API_KEY
                model_info:
                  supports_vision: true
              - model_name: gptoss-llama
                litellm_params:
                  model: openai/gptoss-llama
                  api_base: https://llm.cloud.danmanners.com/v1
                  api_key: os.environ/DANMANNERS_LLM_API_KEY
              # Audio via the in-pod speaches sidecar. The request's `voice`
              # param passes straight through to piper (e.g.
              # en_US-glados-medium to match the wyoming-piper voice).
              - model_name: whisper
                litellm_params:
                  model: openai/Systran/faster-whisper-small
                  api_base: http://127.0.0.1:8000/v1
                  api_key: speaches # required by the openai provider; unused
                model_info:
                  mode: audio_transcription
              - model_name: piper
                litellm_params:
                  # speaches addresses TTS by voice repo, and the model has to
                  # be installed once (`POST /v1/models/speaches-ai%2Fpiper-...`)
                  # before it serves — it then lives on the models PVC, so this
                  # survives pod restarts. Catalog: huggingface.co/speaches-ai/
                  # piper-*. GLaDOS is not in it, so HA keeps wyoming-piper for
                  # that voice. Clients must still send a `voice` field: speaches
                  # requires the key even though the voice repo picks the voice.
                  model: openai/speaches-ai/piper-en_US-amy-medium
                  api_base: http://127.0.0.1:8000/v1
                  api_key: speaches # required by the openai provider; unused
                model_info:
                  mode: audio_speech
            litellm_settings:
              # Don't 400 on params a local backend doesn't implement.
              drop_params: true
              num_retries: 2
            general_settings:
              master_key: os.environ/LITELLM_MASTER_KEY
