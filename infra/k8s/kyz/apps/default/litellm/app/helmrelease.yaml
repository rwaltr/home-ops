---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# LiteLLM proxy + Ollama backend — one OpenAI-compatible endpoint for local
# models, fronting ollama (and future backends) with key auth, spend tracking
# and model aliasing. Hermes reaches it as a custom provider:
#   http://litellm.default.svc.cluster.local:4000/v1
#
# Single pod, two containers: litellm talks to ollama over pod localhost.
# Ollama auto-unloads idle models (KEEP_ALIVE=10m) and holds at most one
# loaded model — this node has no disk swap, only 4Gi zram (2026-09-24 audit).
#
# Models (all local-only; OpenRouter rides along for cloud):
#   qwen3-1.7b-nothink  — responsive general chat (~34 tok/s here). Qwen3
#     thinks by default and ollama's OpenAI endpoint DROPS the `think` param
#     (verified: only the native /api/chat honours it), so the model is
#     rebuilt with the nothink generation prompt baked into its template.
#   home-functiongemma-270m — acon96/home-llm's HA-control model (260MB,
#     ~220 tok/s). Function-calling specialist: it emits Gemma's native
#     <start_function_call> syntax, which the Home LLM integration parses.
#     Useless for general chat ("capital of France" -> nonsense). Not on the
#     ollama registry, so the initContainers import the GGUF from HF
#     (sha256-pinned).
# MiniCPM5-2B was swapped out for the above (slow chat: reasoning preamble;
# weak tool calling). Its weights stay on the PVC — re-add with a Modelfile.
# Weights are re-downloadable artifacts — no kopia backup.
#
# SemIf-style decision scoring works through the proxy: chat completion with
# max_tokens=1, logprobs=true, top_logprobs=20, read option-token odds off the
# first token. Always set top_logprobs explicitly (litellm#21932).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: litellm
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: litellm
    controllers:
      litellm:
        strategy: Recreate # single RWO models PVC
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # First-boot model import, two stages (the ollama image is minimal —
          # no curl/wget — so the download needs its own image). Guarded by a
          # marker file on the PVC so restarts are no-ops.
          model-download:
            image:
              repository: docker.io/curlimages/curl
              tag: 8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
            command:
              - /bin/sh
              - -ec
              - |
                GGUF=/models/.home-functiongemma-270m-q5_k_m.gguf
                SHA=b5a878803b2ca0fb03b03833481a021688fc55d11b57c36e781966e38bb15719
                if [ -f /models/.imported-home-functiongemma-270m ]; then
                  echo "home-functiongemma-270m already imported, skipping"
                  exit 0
                fi
                if [ -f "$GGUF" ] && echo "$SHA  $GGUF" | sha256sum -c - >/dev/null 2>&1; then
                  echo "GGUF already downloaded and verified"
                  exit 0
                fi
                echo "downloading Home-FunctionGemma-270m q5_k_m GGUF (260MB)..."
                curl -fSL --retry 3 \
                  -o "$GGUF" \
                  https://huggingface.co/acon96/Home-FunctionGemma-270m/resolve/main/Home-FunctionGemma-270m.q5_k_m.gguf
                echo "$SHA  $GGUF" | sha256sum -c -
            resources:
              requests:
                cpu: 100m
                memory: 64Mi
              limits:
                memory: 256Mi
          model-import:
            image:
              repository: docker.io/ollama/ollama
              tag: 0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
            command:
              - /bin/sh
              - -ec
              - |
                export OLLAMA_MODELS=/models OLLAMA_HOST=127.0.0.1:11434
                ollama serve &
                pid=$!
                trap 'kill $pid 2>/dev/null || true' EXIT
                until ollama list >/dev/null 2>&1; do sleep 1; done
                # qwen3:1.7b comes from the ollama registry (`pull` is a no-op
                # when current).
                ollama pull qwen3:1.7b
                # Bake the nothink variant: ollama only honours `think` on its
                # native API, so force the empty-think generation prompt into
                # the template. The model's own nothink branch always emits
                # ' thinking\n\n</think>\n\n' after <|im_start|>assistant.
                if ! ollama list | awk '{print $1}' | grep -qx 'qwen3-1.7b-nothink:latest'; then
                  ollama show qwen3:1.7b --modelfile > /tmp/mf
                  sed 's/if and \$\.IsThinkSet (not \$\.Think) -/if true -/' /tmp/mf > /tmp/mf-nothink
                  ollama create qwen3-1.7b-nothink -f /tmp/mf-nothink
                fi
                if ! ollama list | awk '{print $1}' | grep -qx 'home-functiongemma-270m:latest'; then
                  printf 'FROM /models/.home-functiongemma-270m-q5_k_m.gguf\n' > /tmp/Modelfile
                  ollama create home-functiongemma-270m -f /tmp/Modelfile
                  rm -f /models/.home-functiongemma-270m-q5_k_m.gguf
                fi
                touch /models/.imported-home-functiongemma-270m
                ollama list
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
        containers:
          app:
            image:
              repository: ghcr.io/berriai/litellm
              tag: main-stable@sha256:87f34979b9f8cb274fac90ca8a4fdda07d8480de22755562a26adeb95ce20d02
            args:
              - --config
              - /config/config.yaml
              - --host
              - 0.0.0.0
              - --port
              - "4000"
            env:
              TZ: America/Chicago
              # OpenRouter backend key — reuses the existing hermes-secret
              # (same 1P item) rather than duplicating it into litellm-secret.
              OPENROUTER_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-secret
                    key: OPENROUTER_API_KEY
            envFrom:
              - secretRef:
                  name: litellm-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: &port 4000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
          ollama:
            image:
              repository: docker.io/ollama/ollama
              tag: 0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
            env:
              TZ: America/Chicago
              OLLAMA_MODELS: /models
              OLLAMA_HOST: 0.0.0.0:11434
              # Memory discipline for a swap-less node: unload after 10m idle,
              # never hold two models, no parallel request batching.
              OLLAMA_KEEP_ALIVE: 10m
              OLLAMA_MAX_LOADED_MODELS: "1"
              OLLAMA_NUM_PARALLEL: "1"
              # Default per-model context (overridable per-request). Bounds
              # the KV cache; bump only with ARC-capped headroom in mind.
              OLLAMA_CONTEXT_LENGTH: "8192"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &ollamaPort 11434
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *ollamaPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 500m
                memory: 2500Mi
              limits:
                # Largest resident local model is qwen3-1.7b (1.4GB) + 8k KV
                # cache + runtime. 4Gi leaves room for a 4B-class swap later.
                memory: 4Gi
          # OpenAI-compatible STT/TTS (faster-whisper + piper) so LiteLLM can
          # front audio models too. The wyoming protocol has no OpenAI shim,
          # so this is a SECOND copy of whisper/piper alongside the wyoming-*
          # pods (which HA keeps using) — STT_MODEL_TTL bounds the cost.
          # Future consolidation: swap HA's wyoming integration to
          # roryeckel/wyoming_openai (wyoming server -> OpenAI backend)
          # pointing here, then delete the wyoming-* pods.
          speaches:
            image:
              repository: ghcr.io/speaches-ai/speaches
              tag: 0.8.3-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
            env:
              TZ: America/Chicago
              WHISPER__INFERENCE_DEVICE: cpu
              WHISPER__COMPUTE_TYPE: int8
              # Unload whisper after 5m idle — small-int8 is ~500Mi we don't
              # need held while nobody is transcribing.
              STT_MODEL_TTL: "300"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &speachesPort 8000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *speachesPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                # whisper small-int8 ~500Mi + piper voice ~150Mi + runtime.
                memory: 2Gi
    service:
      app:
        controller: litellm
        ports:
          http:
            port: 4000
          # Exposed for direct ollama access (debug, future SemIf-side pulls).
          ollama:
            port: 11434
          # Direct speaches access (debug, voice/model probing).
          audio:
            port: 8000
    route:
      app:
        hostnames:
          - litellm.waltr.tech
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: litellm
                port: 4000
    persistence:
      models:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: openebs-hostpath
        forceRename: litellm-models
        advancedMounts:
          litellm:
            ollama:
              - path: /models
            model-download:
              - path: /models
            model-import:
              - path: /models
            speaches:
              # HF cache shares the weights PVC (whisper/piper download on
              # first use — first transcription request will be slow).
              - path: /home/ubuntu/.cache/huggingface
      config:
        type: configMap
        name: litellm-config
        advancedMounts:
          litellm:
            app:
              - path: /config
    configMaps:
      litellm-config:
        forceRename: litellm-config
        data:
          config.yaml: |
            model_list:
              - model_name: qwen3-1.7b-nothink
                litellm_params:
                  # Generic OpenAI-compatible route (not ollama_chat) so
                  # logprobs/top_logprobs pass through spec-faithfully.
                  model: openai/qwen3-1.7b-nothink
                  api_base: http://127.0.0.1:11434/v1
                  api_key: ollama # required by the openai provider; unused
              - model_name: home-functiongemma-270m
                litellm_params:
                  # HA device control (acon96/home-llm). Emits Gemma's native
                  # <start_function_call> text; the Home LLM integration parses
                  # it. Conversation-latency model, not a chat model.
                  model: openai/home-functiongemma-270m
                  api_base: http://127.0.0.1:11434/v1
                  api_key: ollama # required by the openai provider; unused
              # OpenRouter cloud models ride the same proxy/key — one
              # endpoint for local + cloud. Key comes from hermes-secret.
              - model_name: deepseek-v4.1-flash
                litellm_params:
                  model: openrouter/deepseek/deepseek-v4.1-flash
                  api_key: os.environ/OPENROUTER_API_KEY
              # Audio via the in-pod speaches sidecar. The request's `voice`
              # param passes straight through to piper (e.g.
              # en_US-glados-medium to match the wyoming-piper voice).
              - model_name: whisper
                litellm_params:
                  model: openai/Systran/faster-whisper-small
                  api_base: http://127.0.0.1:8000/v1
                  api_key: speaches # required by the openai provider; unused
                model_info:
                  mode: audio_transcription
              - model_name: piper
                litellm_params:
                  model: openai/rhasspy/piper-voices
                  api_base: http://127.0.0.1:8000/v1
                  api_key: speaches # required by the openai provider; unused
                model_info:
                  mode: audio_speech
            litellm_settings:
              # Don't 400 on params a local backend doesn't implement.
              drop_params: true
              num_retries: 2
            general_settings:
              master_key: os.environ/LITELLM_MASTER_KEY
