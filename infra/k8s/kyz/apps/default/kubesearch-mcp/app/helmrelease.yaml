---
# kubesearch.dev is a search engine over public Flux HelmReleases, with no live API:
# it publishes its index as SQLite databases on GitHub release assets. This server
# wraps those. upstream: perfectra1n/kubesearch-mcp (MIT).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubesearch-mcp
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      kubesearch-mcp:
        containers:
          app:
            image:
              repository: ghcr.io/perfectra1n/kubesearch-mcp
              tag: 1.3.0@sha256:4620f09fffb30672b429b9bbffb8a657d34dcee420729598c3f65732a3c89079
            env:
              MCP_HTTP_HOST: 0.0.0.0
              MCP_HTTP_PORT: "3000"
              # Without a token the HTTP transport is fully open (CORS *, bind
              # 0.0.0.0). The token comes from the item Terraform mints; the value
              # is the bearer the gateway will send.
              MCP_AUTH_TOKEN:
                secretKeyRef:
                  name: kubesearch-mcp-secret
                  key: MCP_AUTH_TOKEN
              # The index is ~44 MB downloaded per boot; without /data every restart
              # pays for it again.
              KUBESEARCH_CACHE_DIR: /data
              # Both of these disable behaviour that reaches outside the cluster:
              # the warm pool permanently clones 15 popular repos, and repo_clone
              # would fetch arbitrary URLs on request. Search over the released
              # index needs neither. Flip them here if repo review is ever wanted.
              KUBESEARCH_POOL_SIZE: "0"
              KUBESEARCH_ENABLE_CLONE: "false"
              TZ: America/Chicago
            probes:
              # /healthz is always 200 — it proves the process is up. /readyz is 503
              # until the index is downloaded, which is the distinction that matters
              # on first boot: a ready pod can answer queries, a live one cannot.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  failureThreshold: 8
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: kubesearch-mcp
        ports:
          http:
            port: 3000
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        storageClass: openebs-hostpath
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
