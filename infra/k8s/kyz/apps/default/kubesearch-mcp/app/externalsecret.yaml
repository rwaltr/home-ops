---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kubesearch-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kubesearch-mcp-secret
  data:
    # Minted by infra/terraform/bootstrap/kubesearch-mcp.tf, like the MikroTik MCP
    # token: a bearer nobody types, for a service nobody logs into. The pod stays in
    # CreateContainerConfigError until that apply runs — that is the failure mode,
    # not a broken manifest.
    - secretKey: MCP_AUTH_TOKEN
      remoteRef:
        key: kubesearch-mcp
        property: password
