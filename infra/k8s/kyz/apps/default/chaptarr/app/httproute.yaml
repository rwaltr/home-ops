---
# yaml-language-server: $schema=https://gateway-api.sigs.k8s.io/geps/gep-1748
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chaptarr
  annotations:
    # Listed on the Homepage dashboard — see docs/homepage.md.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Chaptarr
    gethomepage.dev/description: Book and audiobook manager
    gethomepage.dev/group: Media Ops
    gethomepage.dev/icon: chaptarr.png
spec:
  hostnames:
    - chaptarr.waltr.tech
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: chaptarr
          port: 8789
