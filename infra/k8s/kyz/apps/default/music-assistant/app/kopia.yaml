---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# Kopia enrollment for the Music Assistant config PVC. copyMethod: Direct —
# crash-consistent live reads (openebs-hostpath has no CSI snapshots). Mover
# runs as 1000:1000 to match the app UID/GID.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: music-assistant
  namespace: default
spec:
  repository:
    kind: ClusterRepository
    name: cluster-kopia
  sources:
    - pvc:
        # Single-PVC app: app-template names it just <fullname> (the chart only
        # appends the persistence key when there is more than one PVC).
        name: music-assistant
      sourcePathStrategy: PvcName
  copyMethod: Direct
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    podSecurityContext:
      fsGroup: 1000
  retention:
    keepLatest: 7
    keepDaily: 14
    keepWeekly: 4
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: music-assistant-nightly
  namespace: default
spec:
  policyRef:
    name: music-assistant
  schedule:
    cron: "H 2 * * *"
    jitter: 30m
    runOnCreate: false
