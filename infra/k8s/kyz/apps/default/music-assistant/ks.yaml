---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: music-assistant
spec:
  # Disabled app (not registered in ../kustomization.yaml): no kopiur backup.
  # Re-enabling it means adding the kopiur backup component back (APP, PVC,
  # KOPIUR_CRON) — see openspec/specs/pvc-backups.
  interval: 1h
  path: ./infra/k8s/kyz/apps/default/music-assistant/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  dependsOn:
    - name: openebs # PVCs on the openebs-hostpath storage class
      namespace: openebs
  wait: false
