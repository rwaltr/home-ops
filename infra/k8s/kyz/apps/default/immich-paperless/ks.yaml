---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich-paperless
spec:
  interval: 1h
  path: ./infra/k8s/kyz/apps/default/immich-paperless/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  # No kopiur component: this app holds no state of its own. Its memory is the
  # `paperless-sent` tag on the Immich asset, which is what makes it idempotent.
  wait: false
