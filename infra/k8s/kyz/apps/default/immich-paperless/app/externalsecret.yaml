---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Immich API key (Immich → Account Settings → API Keys). Stored as a 1Password
# API_CREDENTIAL item named paperless-bridge in the home-ops vault — the only
# vault the ClusterSecretStore can read, so an item in any other vault is
# invisible to this sync no matter how it is named.
#
# The second key is the LiteLLM gateway's, for the vision confirm step. It is not
# free: it bills through OpenRouter, so the script caps how many calls a run may
# make. Immich's own OCR is tried first and is local, which is why most assets
# never reach the model at all.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: immich-paperless
  data:
    # Key name matters: `envFrom` silently SKIPS keys that are not
    # valid env var names, so a dashed `immich-api-key` would never reach
    # the container and the bridge would report an empty key. Uppercase +
    # underscore maps to IMMICH_API_KEY, which is what the script reads.
    - secretKey: IMMICH_API_KEY
      remoteRef:
        # Dedicated API_CREDENTIAL item, not the immich login: the bridge
        # credential stays separate from the account credential. The secret
        # lives in the "credential" field, which is that category's own field
        # name — not "password", which does not exist on this item.
        key: paperless-bridge
        property: credential
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm
        property: master_key
