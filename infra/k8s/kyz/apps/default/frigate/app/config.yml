mqtt:
  # Reuses the anonymous internal mosquitto (HA camera discovery rides it)
  host: mosquitto.default.svc.cluster.local
  port: 1883
detectors:
  cpu:
    type: cpu
    num_threads: 2
go2rtc:
  streams:
    # NOTE: backchannel=1 was REMOVED from the always-on main stream —
    # Reolink RTSP servers drop held backchannel sessions, which took down
    # the whole stream chain (frigate ffmpeg consumers died with it).
    # Talk now uses a dedicated on-demand stream (nursery_talk).
    nursery: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS_ENC}@10.40.0.198:554/h264Preview_01_main
    nursery_sub: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS_ENC}@10.40.0.198:554/h264Preview_01_sub
    # talk-only: backchannel session held only while mic is active
    nursery_talk: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASS_ENC}@10.40.0.198:554/h264Preview_01_main#backchannel=1
  # WebRTC for low-latency live view + mic push. Browser-side UDP rides the
  # existing 'clients -> cameras: UDP only' accept (10.40.0.11 is the pod's
  # macvlan IP) — no LB VIP needed. IoT-VLAN phones use the HA proxy path.
  webrtc:
    listen: ":8555"
    candidates:
      - 10.40.0.11:8555
cameras:
  nursery:
    enabled: true
    # ONVIF — required for frigate PTZ controls (only renders if the camera
    # reports PTZ capability; harmless on fixed cameras)
    onvif:
      host: 10.40.0.198
      port: 8000
      user: {FRIGATE_RTSP_USER}
      password: {FRIGATE_RTSP_PASS}
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-copy
      inputs:
        - path: rtsp://127.0.0.1:8554/nursery
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/nursery_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
detect:
  enabled: true
  width: 640
  height: 360
  fps: 5
record:
  enabled: true
  retain:
    days: 7
    mode: motion
snapshots:
  enabled: true
  retain:
    default: 7
live:
  streams:
    nursery: nursery
objects:
  track:
    - person
    - car
    - animal