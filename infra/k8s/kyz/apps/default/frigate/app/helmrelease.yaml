---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Frigate NVR 0.16 (CPU-only detection — no GPU passthrough on this node).
# go2rtc is EMBEDDED (port 1984): cameras connect to go2rtc once, frigate
# reads the restream via 127.0.0.1:8554 — single RTSP session per camera.
# Cameras are on VLAN 40 (cameras) — pod gets a macvlan there (10.40.0.11,
# pinned MAC per the home-assistant pattern) so RTSP stays on-VLAN and
# never crosses the router. Recordings go to tank (/var/tank/nas/nvr,
# rw 1000:1000); config is a PVC backed up by kopia. MQTT reuses the
# anonymous internal mosquitto (HA camera discovery rides it).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: frigate
  values:
    fullnameOverride: frigate
    controllers:
      frigate:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.16.2@sha256:4041ad318224500cf9513c513b1bb927d9dd252f63bbd3d11c92006c1172c86c
            env:
              TZ: America/Chicago
              CONFIG_FILE: /config/config.yml
              # s6 non-root: redirect HOME off /root
              HOME: /tmp/home
            envFrom:
              - secretRef:
                  name: frigate-secret
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 6Gi
    defaultPodOptions:
      annotations:
        # Cameras VLAN presence — Frigate must reach the Reolinks over
        # VLAN 40 directly (RTSP from the pod net would hairpin through
        # the router otherwise). Static IP below DHCP pool, pinned MAC
        # per home-assistant pattern.
        k8s.v1.cni.cncf.io/networks: |-
          [{"name": "cameras", "namespace": "kube-system", "ips": ["10.40.0.11/24"], "mac": "a6:30:00:10:40:0b"}]
      securityContext:
        # NON-ROOT (per discussion #18375): s6-overlay tolerates /run not
        # being uid-owned IF /run is a writable volume (emptyDir below) —
        # it downgrades to a warning and works in single-uid mapping.
        # HOME is redirected to /tmp/home (nginx temp paths). File writes
        # on PVC/tank ride fsGroup 1000.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: frigate
        ports:
          http:
            port: 5000
          go2rtc-api:
            port: 1984
    route:
      app:
        enabled: false # routes live in ./httproute.yaml (frigate + go2rtc)
    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: openebs-hostpath
        globalMounts:
          - path: /config
      # Recordings/clips/cache on tank (ZFS DAS) — WRITE. Source data,
      # never backed up (same policy as media libraries).
      media:
        type: hostPath
        hostPath: /var/tank/nas/nvr
        globalMounts:
          - path: /media/frigate
      cache:
        type: emptyDir
        globalMounts:
          - path: /tmp/cache
      # s6-overlay runtime dir — writable emptyDir avoids the s6 fatal
      # ("/run belongs to uid 0 … lacking privileges") for non-root runs
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
      # Frigate config — camera creds injected via env ({ENV} substitution
      # in go2rtc streams), everything else version-controlled here.
      frigate-config:
        type: configMap
        name: frigate-config
        globalMounts:
          - path: /config/config.yml
            subPath: config.yml