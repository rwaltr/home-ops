---
# The public door: one hostname, three surfaces.
#
#   /v1        -> the LLM surface    (8080, apiKey in strict mode)
#   /mcp       -> the MCP multiplex  (8081, apiKey in strict mode + per-client rules)
#   /oauth/mcp -> the same multiplex (8083, JWT bearer tokens from Kanidm)
#
# Publishing this route does not expose an unauthenticated surface. The apiKey
# listeners reject requests without a key, and the OAuth listener rejects requests
# without a valid token — and that rejection is deliberate: its 401 is what makes an
# MCP client begin the OAuth flow instead of reporting a dead server. The internal
# listener (8082) is deliberately absent: it is for in-cluster callers and never
# leaves the ClusterIP Service.
#
# The OAuth surface is a second path to the same MCP servers rather than a second
# hostname, because a client's identity is carried in its credential: Grok presents a
# token, the ring presents a key, and the same URL would otherwise have to accept both.
#
# Nothing else is needed to make the hostname resolve. The cloudflare tunnel carries
# *.waltr.tech to envoy-external, and external-dns publishes records only for routes
# attached to that gateway, so this HTTPRoute is the entire publish step — no Terraform
# record and no tunnel edit. Unpublishing is deleting this file, the same as navidrome.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway
spec:
  hostnames:
    - llm.waltr.tech
  parentRefs:
    - name: envoy-external # public via cloudflare tunnel (CGNAT — no port forwards)
      namespace: network
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: agentgateway
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: agentgateway
          port: 8081
    # The OAuth surface, rewritten onto the path the MCP servers are actually served
    # at. A prefix match on /mcp would swallow this, so the paths are kept disjoint
    # and the rewrite does the joining.
    - matches:
        - path:
            type: PathPrefix
            value: /oauth/mcp
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /mcp
      backendRefs:
        - name: agentgateway
          port: 8083
    # Protected-resource metadata (RFC 9728), which an MCP client fetches before it
    # has a token. It is served by the gateway itself on the OAuth listener, so it
    # has to be routed there explicitly — the client asks the resource for its
    # authorization server, and gets nothing if this rule is missing.
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource
      backendRefs:
        - name: agentgateway
          port: 8083
