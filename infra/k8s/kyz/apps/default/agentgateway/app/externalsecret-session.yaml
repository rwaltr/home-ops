---
# The key that encrypts MCP session IDs, kept in its own Secret because the chart
# expects it under the key name `key` (values.session.secretName -> SESSION_KEY).
#
# Separate from agentgateway-secret on purpose: this is not a credential any client
# presents, and mixing it into the same Secret would put it in reach of every env var
# consumer on the pod.
#
# Without it the gateway logs "no session key configured; MCP session IDs are not
# encrypted" and issues session IDs that are base64 only, from which a client can read
# the multiplexed target names and upstream session IDs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-session
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway-session
    template:
      data:
        key: "{{ .session_key }}"
  data:
    - secretKey: session_key
      remoteRef:
        key: agentgateway-session
        property: password
