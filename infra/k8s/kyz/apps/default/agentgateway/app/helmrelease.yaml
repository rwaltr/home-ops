---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# agentgateway — one LLM endpoint in front of the same upstreams litellm carries,
# plus cliproxyapi's subscription-backed models. Deliberately NOT chained to our
# own litellm: this is a parallel front door, not a second hop.
#
# Inbound auth is absent on purpose. 8080 is cluster-internal and unauthenticated,
# so any pod can spend these keys; that is the same posture as the MCP servers in
# this namespace, and it is the reason the pod carries no client-facing route. Add
# the `policies.apiKey` block from the chart's examples before exposing it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
spec:
  chartRef:
    kind: OCIRepository
    name: agentgateway
  interval: 30m
  values:
    nameOverride: agentgateway
    mode: readonly
    replicaCount: 1
    extraEnv:
      # Same 1P item litellm uses for its OpenRouter calls; no copy in our secret.
      - name: OPENROUTER_API_KEY
        valueFrom:
          secretKeyRef:
            name: hermes-secret
            key: OPENROUTER_API_KEY
      # This chart supports extraEnv only, not envFrom — so each key is named.
      - name: CLIPROXYAPI_API_KEY
        valueFrom:
          secretKeyRef:
            name: agentgateway-secret
            key: CLIPROXYAPI_API_KEY
      - name: DANMANNERS_LLM_API_KEY
        valueFrom:
          secretKeyRef:
            name: agentgateway-secret
            key: DANMANNERS_LLM_API_KEY
      - name: OPENCODE_GO_API_KEY
        valueFrom:
          secretKeyRef:
            name: agentgateway-secret
            key: OPENCODE_GO_API_KEY
      - name: MIKROTIK_MCP_TOKEN
        valueFrom:
          secretKeyRef:
            name: agentgateway-secret
            key: MIKROTIK_MCP_TOKEN
      - name: GROK_API_KEY
        valueFrom:
          secretKeyRef:
            name: agentgateway-secret
            key: GROK_API_KEY
      - name: PEBBLE_INDEX_API_KEY
        valueFrom:
          secretKeyRef:
            name: agentgateway-secret
            key: PEBBLE_INDEX_API_KEY
      - name: PI_API_KEY
        valueFrom:
          secretKeyRef:
            name: agentgateway-secret
            key: PI_API_KEY
    # Encrypts MCP session IDs. The chart injects SESSION_KEY from this Secret's `key`
    # entry; without it session IDs are base64 only, which discloses the multiplexed
    # target names to any client that can read its own session id.
    session:
      secretName: agentgateway-session
    gateway:
      service:
        type: ClusterIP
        ports:
          - name: llm
            port: 8080
            targetPort: 8080
            protocol: TCP
          # The MCP multiplex. Declared here because this chart publishes only the
          # ports named in values — the listener on 8081 came up regardless and was
          # unreachable until it was listed.
          - name: mcp
            port: 8081
            targetPort: 8081
            protocol: TCP
          # The unauthenticated listener, for in-cluster callers only. It is published
          # on the ClusterIP Service and never on the public route.
          - name: internal
            port: 8082
            targetPort: 8082
            protocol: TCP
          # The JWT listener. Same rule as above: a listener that is not named here is
          # unreachable, and the public route's backendRef to it would resolve to
          # nothing.
          - name: oauth
            port: 8083
            targetPort: 8083
            protocol: TCP
          - name: metrics
            port: 15020
            targetPort: 15020
            protocol: TCP
          - name: readiness
            port: 15021
            targetPort: 15021
            protocol: TCP
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
    config:
      config:
        adminAddr: "off"
        statsAddr: 0.0.0.0:15020
        readinessAddr: 0.0.0.0:15021
      # Three listeners, two of them authenticated.
      #
      # apiKey sits at the GATEWAY level rather than on the llm/mcp blocks because
      # llm.policies and mcp.policies apply to every gateway they are attached to —
      # port-level placement is the only way to keep an unauthenticated listener for
      # in-cluster callers. A hostname split would not be a boundary, since the Host
      # header is client-controlled.
      #
      # mode must be `strict`: the default is `optional`, which accepts requests with
      # no key at all.
      gateways:
        llm-public:
          port: 8080
          apiKey:
            mode: strict
            keys:
              # A client key doubles as the client's identity: the metadata becomes
              # the CEL variable `apiKey.client`, which the model allow-lists here and
              # the MCP authorization rules below are written against.
              - key: ${GROK_API_KEY}
                metadata:
                  name: grok
                  client: grok
                # Filters /v1/models as well, and a disallowed model is refused before
                # any provider is contacted. Claude (the paid subscription via
                # cliproxyapi) is deliberately absent.
                allowedModels:
                  - deepseek-v4.1-flash
                  - qwen3.8-omni-flash
              - key: ${PEBBLE_INDEX_API_KEY}
                metadata:
                  name: pebble-index
                  client: pebble-index
                allowedModels:
                  - deepseek-v4.1-flash
              # The operator's own agent client. Claude only: everything else it
              # reaches directly, and the subscription is the one credential it
              # cannot hold itself.
              - key: ${PI_API_KEY}
                metadata:
                  name: pi
                  client: pi
                allowedModels:
                  - claude
        mcp-public:
          port: 8081
          apiKey:
            mode: strict
            keys:
              - key: ${GROK_API_KEY}
                metadata:
                  name: grok
                  client: grok
              - key: ${PEBBLE_INDEX_API_KEY}
                metadata:
                  name: pebble-index
                  client: pebble-index
              - key: ${PI_API_KEY}
                metadata:
                  name: pi
                  client: pi
        internal:
          # No apiKey. Reachable only through the ClusterIP Service, and the mcp
          # authorization rules below allow a caller with no key.
          port: 8082
        mcp-oauth:
          # JWT bearer tokens, for a client that cannot hold a static key: Grok's
          # consumer connector authenticates over OAuth against Kanidm and is given a
          # client id, not an apiKey. A key is not a token, so this cannot be another
          # rule on mcp-public — it is a fourth listener.
          #
          # mode strict is load-bearing: it is what returns the 401 that makes an MCP
          # client start its OAuth flow. optional and permissive both suppress the 401
          # and no flow ever begins.
          port: 8083
          jwtAuth:
            mode: strict
            issuer: https://idm.waltr.tech/oauth2/openid/grok-mcp/
            audiences:
              - grok-mcp
            jwks:
              url: https://idm.waltr.tech/oauth2/openid/grok-mcp/public_key.jwk
      llm:
        gateways: [llm-public, internal]
        models:
          # --- OpenRouter: the same three aliases litellm exposes ---
          - name: deepseek-v4.1-flash
            provider: openAI
            params:
              apiKey: ${OPENROUTER_API_KEY}
              baseUrl: https://openrouter.ai/api/v1
              model: deepseek/deepseek-v4.1-flash
          - name: qwen3.8-omni-flash
            provider: openAI
            params:
              apiKey: ${OPENROUTER_API_KEY}
              baseUrl: https://openrouter.ai/api/v1
              model: qwen/qwen3.8-omni-flash
          - name: gpt-5.6-luna
            provider: openAI
            params:
              apiKey: ${OPENROUTER_API_KEY}
              baseUrl: https://openrouter.ai/api/v1
              model: openai/gpt-5.6-luna
          # --- Dan Manners' shared gateway: only the hardware-backed aliases ---
          - name: nvidia-llama
            provider: openAI
            params:
              apiKey: ${DANMANNERS_LLM_API_KEY}
              baseUrl: https://llm.cloud.danmanners.com/v1
              model: nvidia-llama
          - name: intel-llama
            provider: openAI
            params:
              apiKey: ${DANMANNERS_LLM_API_KEY}
              baseUrl: https://llm.cloud.danmanners.com/v1
              model: intel-llama
          - name: intel-vl
            provider: openAI
            params:
              apiKey: ${DANMANNERS_LLM_API_KEY}
              baseUrl: https://llm.cloud.danmanners.com/v1
              model: intel-vl
          - name: gptoss-llama
            provider: openAI
            params:
              apiKey: ${DANMANNERS_LLM_API_KEY}
              baseUrl: https://llm.cloud.danmanners.com/v1
              model: gptoss-llama
          # --- cliproxyapi: subscription accounts as OpenAI-compatible models ---
          # The service is cluster-internal; the key is the one Terraform minted,
          # held only by this pod's env.
          - name: claude
            provider: openAI
            params:
              apiKey: ${CLIPROXYAPI_API_KEY}
              baseUrl: http://cliproxyapi.default.svc.cluster.local:8317/v1
              model: claude-sonnet-5-5
          # --- OpenCode Go: the subscription tier, straight through ---
          # Go refuses any request without an x-opencode-session header, checked
          # before auth (a bogus key still returns MissingSessionID), so the header
          # is injected here with a fixed value. requestHeaders takes no CEL and
          # runs after requestTransformation.
          #
          # A fixed session id is the weak part of this route: Go routes per
          # session and monitors for abuse, so every caller shares one affinity
          # key. That is acceptable for one internal consumer and not for many; a
          # per-client value belongs here if this entry ever gains more callers.
          #
          # deepseek-v4.1-flash also requires Regions -> Global in the Go workspace
          # privacy settings; under the default EU+US allowlist it is blocked.
          - name: go/deepseek-v4.1-flash
            provider: openAI
            requestHeaders:
              set:
                x-opencode-session: teletran-agentgateway
            params:
              apiKey: ${OPENCODE_GO_API_KEY}
              baseUrl: https://opencode.ai/inference/go/openai/v1
              model: deepseek-v4.1-flash
      # MCP servers multiplexed behind one endpoint, so a client needs one URL and
      # one credential instead of five of each. Served on 8081, same idiom as the
      # llm block above.
      #
      # `conditional` prefixing namespaces a tool name only when two targets would
      # collide, so the common case stays readable (flux_*, kubectl_*).
      #
      # kubesearch is deliberately absent: its bearer token does not exist yet
      # (Terraform mint), and naming it here would leave the gateway unable to
      # authenticate to itself. Add it when infra/terraform/bootstrap lands.
      mcp:
        gateways: [mcp-public, internal, mcp-oauth]
        prefixMode: conditional
        # Per-client tool authorization. Rules are ORed: a tool is allowed when ANY
        # rule evaluates to true, so order carries no meaning and a bare client check
        # grants that client every target. A denied tool is hidden from tools/list, not
        # merely refused when called — so each client sees only its own subset, which
        # is also what keeps a wrist-button client's list small enough to fit one page.
        #
        # Tool arguments are not visible here; argument-level rules belong to
        # mcpGuardrails, which filters content rather than identity.
        policies:
          # The MCP-native authentication object, and the only thing that serves the
          # protected-resource metadata an MCP client discovers before it starts an
          # OAuth flow (RFC 9728). `resourceMetadata` is required on it, which is the
          # point: the document is what tells a client where the authorization server
          # is, and Kanidm has no dynamic client registration to fall back on.
          #
          # Permissive here, enforced on the mcp-oauth gateway above. This block is
          # attached to every gateway the mcp servers are served on, and the apiKey
          # and internal listeners must keep working without a token.
          mcpAuthentication:
            issuer: https://idm.waltr.tech/oauth2/openid/grok-mcp/
            mode: optional
            jwks:
              url: https://idm.waltr.tech/oauth2/openid/grok-mcp/public_key.jwk
            resourceMetadata:
              resource: https://llm.waltr.tech/oauth/mcp
              authorizationServers:
                - https://idm.waltr.tech/oauth2/openid/grok-mcp/
              scopesSupported:
                - openid
                - profile
                - email
              bearerMethodsSupported:
                - header
          mcpAuthorization:
            rules:
              # The internal listener presents no key at all.
              - "!has(apiKey.client)"
              # Grok answers one question about the house; it gets the read-only
              # Home Assistant target and nothing else.
              - 'apiKey.client == "grok" && mcp.tool.target == "home-assistant"'
              # The ring controls the house, so it may reach the write-capable target
              # as well as the read-only one. That target arrives in a following
              # change; a rule naming a target that does not exist yet is inert.
              - 'apiKey.client == "pebble-index" && mcp.tool.target == "home-assistant"'
              - 'apiKey.client == "pebble-index" && mcp.tool.target == "home-assistant-control"'
              # The operator's own agent client gets every target; the per-client
              # split exists to keep phone-sized surfaces small, not to limit pi.
              # No tool or target term on purpose: any rule matching allows all.
              - 'apiKey.client == "pi"'
        targets:
          - name: flux
            mcp:
              host: http://flux-mcp.default.svc.cluster.local:8000/mcp
          - name: kubectl
            mcp:
              host: http://kubectl-mcp.default.svc.cluster.local:8000/mcp
          - name: home-assistant
            # Path-secrecy auth in its default form: no header is sent, and the
            # target is reachable only from here.
            mcp:
              host: http://home-assistant-mcp.default.svc.cluster.local:8086/mcp
          - name: mikrotik
            mcp:
              host: http://mikrotik-mcp.default.svc.cluster.local:3000/mcp
            policies:
              # The one target that demands a credential: the token Terraform
              # minted, presented as a bearer.
              backendAuth:
                key: ${MIKROTIK_MCP_TOKEN}
