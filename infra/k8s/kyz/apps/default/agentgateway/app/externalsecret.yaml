---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Two upstream credentials. The third — OpenRouter — is not duplicated here: it
# rides hermes-secret, the same item litellm reads, set as explicit extraEnv below.
#   CLIPROXYAPI_API_KEY     — 1P item `cliproxyapi`, field `password`. The key
#                             Terraform mints for the subscription proxy's front
#                             door; agentgateway is now the only consumer that
#                             holds it, so the test path never needs a human.
#   DANMANNERS_LLM_API_KEY  — 1P item `llm.cloud.danmanners.com`, field
#                             `credential`. Same shared gateway litellm uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway-secret
    creationPolicy: Owner
  data:
    - secretKey: CLIPROXYAPI_API_KEY
      remoteRef:
        key: cliproxyapi
        property: password
    - secretKey: DANMANNERS_LLM_API_KEY
      remoteRef:
        key: llm.cloud.danmanners.com
        property: credential
    # Item title contains a space. 1Password Connect matches it literally, and a
    # near-miss fails as "key not found in 1Password Vaults" rather than as a typo.
    - secretKey: OPENCODE_GO_API_KEY
      remoteRef:
        key: "opencode go"
        property: credential
    # The gateway authenticates to the MikroTik MCP server, so it needs the token
    # Terraform minted for that server rather than the router's own credentials.
    - secretKey: MIKROTIK_MCP_TOKEN
      remoteRef:
        key: microtik-mcp
        property: password
    # Per-client keys for the public door. Each client holds its own, so revoking one
    # leaves the others working; the config maps each to an identity in metadata.
    - secretKey: GROK_API_KEY
      remoteRef:
        key: grok
        property: password
    - secretKey: PEBBLE_INDEX_API_KEY
      remoteRef:
        key: pebble-index
        property: password
