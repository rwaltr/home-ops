---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Two credentials, one Secret:
#   HBC_HOMEBOX_API_KEY — 1P item `homebox-companion`, field `credential` (an
#                         API_CREDENTIAL item, so that is the field 1Password
#                         gives the key; same shape as `llm.cloud.danmanners.com`).
#                         Its own
#                         `hb_…` key, NOT the one the pi MCP server uses: anyone
#                         who can reach Companion acts as that key's owner, so a
#                         separate key keeps revocation and expiry independent.
#   HBC_LLM_API_KEY     — 1P item `litellm`, field `master_key`. The same
#                         credential hermes authenticates to the proxy with
#                         (homelab, single tenant — no virtual keys).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homebox-companion
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: homebox-companion-secret
  data:
    - secretKey: HBC_HOMEBOX_API_KEY
      remoteRef:
        key: homebox-companion
        property: credential
    - secretKey: HBC_LLM_API_KEY
      remoteRef:
        key: litellm
        property: master_key
