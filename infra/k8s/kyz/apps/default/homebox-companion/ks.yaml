---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homebox-companion
spec:
  interval: 1h
  path: ./infra/k8s/kyz/apps/default/homebox-companion/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  dependsOn:
    # Neither is strictly required to start — Companion only needs them on the
    # first request — but without them its ExternalSecret resolves against a
    # cluster that has no onepassword-connect, and its very first page load
    # fails against a proxy that isn't up.
    - name: homebox
      namespace: default
    - name: litellm
      namespace: default
  wait: false
