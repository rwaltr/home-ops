---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Secrets for the household agent (`hermes-ha`). Deliberately a SUBSET of the
# operator agent's secret: no GitHub App credentials, no dashboard auth, no
# kubeconfig. This agent has no repo checkout and no cluster RBAC.
#
#   - OpenRouter API key: 1P item `OpenRouter API Key` (vault home-ops), field `credential`
#   - Home Assistant: 1P item `home-assistant-secret`, field `prometheus_token`
#   - API server key: 1P item `hermes`, field `api_server_key`
#   - Discord bot: 1P item `discordbot-ha`, fields `token` and `rwaltruserid`
#
# `discordbot-ha` does not exist yet — it is rwaltr's to create (a second
# Discord application; two gateway processes cannot share one bot token). Until
# the item exists this ExternalSecret reports SecretSyncedError, the pod stays
# in Init, and nothing else is wrong. See docs/hermes-agent.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-ha
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-ha-secret
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: OpenRouter API Key
        property: credential
    # Local models via the in-cluster LiteLLM proxy (providers.litellm).
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm
        property: master_key
    - secretKey: API_SERVER_KEY
      remoteRef:
        key: hermes
        property: api_server_key
    # Home Assistant control. Same long-lived token Prometheus scrapes with.
    - secretKey: HASS_TOKEN
      remoteRef:
        key: home-assistant-secret
        property: prometheus_token
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef:
        key: discordbot-ha
        property: token
    - secretKey: DISCORD_ALLOWED_USERS
      remoteRef:
        key: discordbot-ha
        property: rwaltruserid
