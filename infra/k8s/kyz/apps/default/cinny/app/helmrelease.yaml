---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Cinny — an alternative Matrix web client, to compare against Element Web.
#
# DELIBERATELY NOT WIRED IN: the entry for its ks.yaml is commented out in
# apps/default/kustomization.yaml, so nothing is deployed and no HTTPRoute
# exists, which means k8s-gateway publishes no name for it. Turning it on is two
# edits: uncomment the kustomization entry, and decide whether to keep Element.
#
# Cinny is a static SPA served by the image's own nginx, so the only config is
# config.json (a ConfigMap), which pre-fills the homeserver so nobody has to type
# matrix.waltr.tech. The image serves it from /usr/share/nginx/html/config.json.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cinny
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: matrix
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: cinny
    controllers:
      cinny:
        containers:
          app:
            image:
              repository: ghcr.io/cinnyapp/cinny
              tag: v4.12.8@sha256:e78446681ad5eb68c10dd7c38e2811ff86514c378d0568dcf9bb1a7aabf0cfde
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            # The upstream image runs nginx as root and writes its cache/pid under
            # the container FS, so the root FS stays writable — same call as
            # element-web/degoog/freshrss. It is smaller than Element's: no
            # CHOWN is needed because nothing here is chowned at start.
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  - SETGID
                  - SETUID
                  - DAC_OVERRIDE
                  - NET_BIND_SERVICE
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 96Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
    service:
      app:
        controller: cinny
        ports:
          http:
            port: 80
    route:
      app:
        hostnames:
          - cinny.waltr.tech
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        type: configMap
        name: cinny-config
        globalMounts:
          - path: /usr/share/nginx/html/config.json
            subPath: config.json
