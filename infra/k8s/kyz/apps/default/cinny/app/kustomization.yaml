---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Cinny web client. Not reconciled — the ks.yaml that would point Flux here is
# commented out in apps/default/kustomization.yaml. See docs/comms-demos.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
configMapGenerator:
  - name: cinny-config
    files:
      - config.json=./config.json
generatorOptions:
  disableNameSuffixHash: true
