---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# chaski's provider credentials — deliberately the *same* 1Password items the
# Alertmanager ExternalSecret reads, so nothing new has to be created for the
# relay to work:
#   PUSHOVER_APP_TOKEN <- item `alertmanager`, field ALERTMANAGER_PUSHOVER_TOKEN
#                         (the application token Alertmanager already sends with)
#   PUSHOVER_USER_KEY  <- item `pushover`, Login `credential` field
# The two are merged into one Apprise URL in the HelmRelease target:
#   pover://<user key>@<app token>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chaski
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: chaski-secret
    template:
      data:
        PUSHOVER_APP_TOKEN: "{{ .ALERTMANAGER_PUSHOVER_TOKEN }}"
        # pushover item stores the user key in its Login `credential` field
        PUSHOVER_USER_KEY: "{{ .credential }}"
  dataFrom:
    - extract:
        key: alertmanager
    - extract:
        key: pushover
