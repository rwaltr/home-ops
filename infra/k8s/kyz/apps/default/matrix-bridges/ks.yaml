---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Beeper-style bridges (Signal, Discord, Google Messages) for the Matrix demo.
#
# NOT WIRED IN: the entry for this file is commented out in
# apps/default/kustomization.yaml, so Flux never sees it. It is kept so the shape
# is reviewable, and so enabling the set is one uncomment.
#
# dependsOn names `matrix` because the HelmReleases here reference the `matrix`
# OCIRepository and, more importantly, a bridge is useless before the homeserver
# exists. See docs/comms-demos.md for the registration steps that must happen
# first — nothing here works without the two secrets per bridge.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: matrix-bridges
spec:
  interval: 1h
  path: ./infra/k8s/kyz/apps/default/matrix-bridges/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  dependsOn:
    - name: matrix
    - name: openebs
      namespace: openebs
  wait: false
