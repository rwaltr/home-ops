---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# mautrix-signal — Signal bridge. PART OF THE MATRIX DEMO, DELIBERATELY NOT ENABLED
# (its ks.yaml is commented out in apps/default/kustomization.yaml).
#
# A Beeper-class setup is one client over several networks, which on Matrix means
# mautrix bridges. Signal, Discord and Google Messages were picked over
# WhatsApp/Telegram because they are the networks actually worth consolidating
# here. Reasoning, cost and the enablement steps: docs/comms-demos.md.
#
# Two secrets must exist before this can run, and neither may enter git:
#
#   mautrix-signal-config
#     registration.yaml  appservice registration: as_token / hs_token / id
#     config.yaml        bridge config: homeserver URL, database, permissions
#
# Generate both with this same image, store them in 1Password, project them with
# an ExternalSecret. The appservice port below (29328) is a value you set, not an
# image default: it must equal `appservice.address` in config.yaml and `url` in
# registration.yaml, or the homeserver cannot reach the bridge. Change all three
# together.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mautrix-signal
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: matrix
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: mautrix-signal
    controllers:
      mautrix-signal:
        strategy: Recreate
        initContainers:
          # openebs-hostpath ignores fsGroup, so hand the data dir to the
          # unprivileged bridge user or SQLite cannot write (same fix as tuwunel).
          permissions:
            image:
              repository: docker.io/library/alpine
              tag: 3.21@sha256:ee16d92f96db08d9d2d07da48555a27f3a69d8f0759021dbc601195ed0d2b5bd
            command:
              - /bin/sh
              - -c
              - |
                chown -R 1000:1000 /data
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - FOWNER
                  - DAC_OVERRIDE
        containers:
          app:
            image:
              repository: dock.mau.dev/mautrix/signal
              # mautrix publishes no semver tags; the digest is what is pinned.
              tag: latest@sha256:8268b148cb047fd8cc4aab0bada839da8b2044480573ba9d43992a8a8939ef0a
            env:
              TZ: America/Chicago
            probes:
              # The appservice port only starts serving once the bridge has
              # registered, so a TCP check is the honest health signal here; there
              # is no documented HTTP health path to probe instead.
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 29328
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: mautrix-signal
        ports:
          appservice:
            port: 29328
    persistence:
      # SQLite lives beside the config, so no PostgreSQL — same reasoning that
      # chose Tuwunel over Synapse.
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: openebs-hostpath
        forceRename: mautrix-signal-data
        globalMounts:
          - path: /data
      config:
        type: secret
        name: mautrix-signal-config
        globalMounts:
          - path: /data/config.yaml
            subPath: config.yaml
            readOnly: true
      registration:
        type: secret
        name: mautrix-signal-config
        globalMounts:
          - path: /data/registration.yaml
            subPath: registration.yaml
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
