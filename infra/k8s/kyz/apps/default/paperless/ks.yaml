---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless
spec:
  components:
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./infra/k8s/kyz/apps/default/paperless/app
  postBuild:
    substitute:
      APP: paperless
      PVC: paperless-data
      # Distinct hour: the mover reads the live PVC (openebs-hostpath has no CSI
      # snapshots), so give it a slot where no other app's mover is running.
      # 1-15 are taken; 16 is free.
      KOPIUR_CRON: "H 16 * * *"
      KOPIUR_RUNAS: "1000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  dependsOn:
    - name: openebs # data PVC on the openebs-hostpath storage class
      namespace: openebs
  wait: false
