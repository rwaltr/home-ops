---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: paperless-extract
    files:
      - paperless_extract.py
    options:
      disableNameSuffixHash: true
resources:
  - ./externalsecret.yaml
  - ./extract-cronjob.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
