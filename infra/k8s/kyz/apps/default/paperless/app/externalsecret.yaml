---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# 1Password item `paperless` (vault home-ops):
#   secret_key     — Django SECRET_KEY (any long random string)
#   api_token      — DRF token used by the metadata extractor CronJob
#   admin_password — first-run superuser password. Only used the first time
#                    the DB has no superuser; afterwards change it in the UI
#                    (the env is not re-applied), or the 1P value goes stale.
#                    Keep the 1P value as the record of the initial password.
# Consumed as PAPERLESS_SECRET_KEY / PAPERLESS_ADMIN_PASSWORD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: paperless-secret
    template:
      data:
        PAPERLESS_SECRET_KEY: "{{ .secret_key }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .admin_password }}"
        PAPERLESS_API_TOKEN: "{{ .api_token }}"
  dataFrom:
    - extract:
        key: paperless
