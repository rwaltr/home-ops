---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Secrets for the restricted Hermes host. Split deliberately in two:
#
#   process env (envFrom / env:)  shared provider credentials, identical for
#                                 every tenant on this host.
#   profiles/<name>/.env          capability credentials. Hermes' multiplexing
#                                 gateway resolves these through a context-local,
#                                 fail-closed scope, so the household token is
#                                 invisible to any other profile in the process.
#                                 Written by the `config` init container from a
#                                 Secret mounted into that container only.
#
# Items (vault home-ops):
#   - `OpenRouter API Key` field `credential`
#   - `litellm` field `master_key`
#   - `hermes` field `api_server_key`
#   - `home-assistant-secret` field `prometheus_token`
#   - `discordbot` field `rwaltruserid` (the user allowlist, shared)
#   - `discordbot-household` field `token` -- DOES NOT EXIST YET, rwaltr's to
#     create: a second Discord application, because two gateway profiles cannot
#     share one bot token. Until it exists this ExternalSecret reports
#     SecretSyncedError and the pod stays in Init; nothing else is wrong, and
#     kubelet retries in place, so the pod starts on its own once it appears.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-restricted
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-restricted-secret
  data:
    # --- shared provider credentials (process env) ---
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: OpenRouter API Key
        property: credential
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm
        property: master_key
    - secretKey: API_SERVER_KEY
      remoteRef:
        key: hermes
        property: api_server_key
    # --- capability credentials (per-profile .env, init container only) ---
    - secretKey: HASS_TOKEN
      remoteRef:
        key: home-assistant-secret
        property: prometheus_token
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef:
        key: discordbot-household
        property: token
    - secretKey: DISCORD_ALLOWED_USERS
      remoteRef:
        key: discordbot
        property: rwaltruserid
