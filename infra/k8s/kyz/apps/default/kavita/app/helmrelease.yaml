---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
#
# Kavita — eBook/comic/manga reader over the existing tank books dataset at
# /var/tank/nas/library/books. This is the READER half: acquisition is Chaptarr
# (or a manual drop into the dataset), Kavita serves and tracks reading.
#
# Library is mounted READ-ONLY: Kavita reads files and keeps its own database
# and generated covers on the config PVC; it never rewrites the library. Library
# folders are added in its UI against /books, so the mount does not depend on
# how the collection is laid out inside the dataset.
#
# Image runs as root by default (no USER directive) with a wrapper entrypoint
# (/bin/bash /entrypoint.sh); root FS therefore stays writable. Non-root is
# pinned here and the config PVC is fsGroup-owned, so the entrypoint has nothing
# to chown at start.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kavita
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kavita
  values:
    fullnameOverride: kavita
    controllers:
      kavita:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/jvmilazz0/kavita
              tag: 0.9.1@sha256:31181a32f0dda73cae68721867028a7253d57881b58bea5754cd9e578e75421a
            env:
              TZ: America/Chicago
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              # The image's wrapper entrypoint runs before the server, so the
              # root FS is left writable rather than assumed clean.
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                # Library scanning (and cover generation) is bursty; the index
                # lives in memory. No CPU limit, memory bounded — no swap here.
                memory: 1Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: kavita
        ports:
          http:
            appProtocol: http
            port: 5000
    persistence:
      # kavita.db (SQLite), covers, caches and app config.
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: openebs-hostpath
        # Pinned: app-template only suffixes PVC names once a second PVC
        # exists, and the kopiur policy refers to this exact name.
        forceRename: kavita-config
        globalMounts:
          - path: /kavita/config
      # The books dataset, read-only.
      books:
        type: hostPath
        hostPath: /var/tank/nas/library/books
        globalMounts:
          - path: /books
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
