---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: navidrome
spec:
  components:
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./infra/k8s/kyz/apps/default/navidrome/app
  postBuild:
    substitute:
      APP: navidrome
      PVC: navidrome-data
      # Distinct hour: the mover Job reads the live PVC (no CSI snapshots on
      # openebs-hostpath), so the scan DB is copied crash-consistent.
      KOPIUR_CRON: "H 1 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  dependsOn:
    - name: openebs # data PVC on the openebs-hostpath storage class
      namespace: openebs
  wait: false
