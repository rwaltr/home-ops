---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Tuwunel homeserver (successor to conduwuit). Single Rust binary on RocksDB —
# no PostgreSQL, which is what makes Matrix viable on a single-node cluster.
#
# Registration is gated by a token stored on the PVC and generated once by the
# init container (its value is printed to the init logs on first start). Open
# registration is deliberately NOT enabled: the first account to register
# becomes the server admin, so on a LAN-reachable service that would let any
# device take over the homeserver. See docs/comms-demos.md.
#
# Internal-only: the route attaches to envoy-internal and federation is off, so
# user IDs are @user:matrix.waltr.tech and nothing leaves the cluster.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuwunel
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: matrix
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: tuwunel
    controllers:
      tuwunel:
        strategy: Recreate
        initContainers:
          # Generate the registration token into the data PVC on first start.
          # Both token and database live on the same volume, so no Secret is
          # created and nothing secret enters git.
          registration-token:
            image:
              repository: docker.io/library/alpine
              tag: 3.21@sha256:bc21487101ae47172509130ee1092cc273a831968d64b617776d1f69c81e42ab
            command:
              - /bin/sh
              - -c
              - |
                set -e
                f=/var/lib/tuwunel/.registration_token
                if [ ! -s "$f" ]; then
                  head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$f"
                  echo "[matrix] generated registration token: $(cat "$f")"
                  echo "[matrix] use it on the Element 'Create account' screen"
                fi
                # openebs-hostpath ignores fsGroup, so hand the whole data dir
                # to the unprivileged Tuwunel user or it cannot write RocksDB.
                chown -R 1000:1000 /var/lib/tuwunel
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - FOWNER
                  - DAC_OVERRIDE
        containers:
          app:
            image:
              repository: ghcr.io/matrix-construct/tuwunel
              tag: v1.9.4@sha256:0e86c6164d6c9f5b60291938eb61ad8395021c37fe58d47a963ea7edddbedaec
            env:
              TZ: America/Chicago
              TUWUNEL_SERVER_NAME: matrix.waltr.tech
              TUWUNEL_DATABASE_PATH: /var/lib/tuwunel
              TUWUNEL_ADDRESS: 0.0.0.0
              TUWUNEL_PORT: "8008"
              TUWUNEL_ALLOW_REGISTRATION: "true"
              TUWUNEL_REGISTRATION_TOKEN_FILE: /var/lib/tuwunel/.registration_token
              TUWUNEL_ALLOW_FEDERATION: "false"
              TUWUNEL_WELL_KNOWN__CLIENT: https://matrix.waltr.tech
              TUWUNEL_WELL_KNOWN__SERVER: matrix.waltr.tech:443
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /_matrix/client/versions
                    port: 8008
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /_matrix/client/versions
                    port: 8008
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: tuwunel
        ports:
          http:
            port: 8008
    route:
      app:
        hostnames:
          - matrix.waltr.tech
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: openebs-hostpath
        forceRename: tuwunel-data
        globalMounts:
          - path: /var/lib/tuwunel
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
