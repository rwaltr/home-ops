---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Tuwunel homeserver (successor to conduwuit). Single Rust binary on RocksDB —
# no PostgreSQL, which is what makes Matrix viable on a single-node cluster.
#
# Humans authenticate through Kanidm; local password login and registration
# are disabled. The separate shared-secret registration API is only for bot
# accounts and must never be given to bots. See docs/comms-demos.md.
#
# Federation is on but allow-listed to beeper.com only (MVP): the server is
# published through the Cloudflare tunnel so Beeper's server can reach us, and
# the allow-list denies every other remote server. User IDs stay
# @user:matrix.waltr.tech. See docs/comms-demos.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuwunel
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: matrix
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: tuwunel
    controllers:
      tuwunel:
        strategy: Recreate
        initContainers:
          # openebs-hostpath ignores fsGroup; chown the data dir for Tuwunel.
          data-permissions:
            image:
              repository: docker.io/library/alpine
              tag: 3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
            command:
              - /bin/sh
              - -c
              - chown -R 1000:1000 /var/lib/tuwunel
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - FOWNER
                  - DAC_OVERRIDE
        containers:
          app:
            image:
              repository: ghcr.io/matrix-construct/tuwunel
              tag: v2.1.0@sha256:d63ce59869f341c09ee89e3a4e355147b18488f9293cc78bc9ab14ff2036f2b5
            env:
              TZ: America/Chicago
              TUWUNEL_SERVER_NAME: matrix.waltr.tech
              TUWUNEL_DATABASE_PATH: /var/lib/tuwunel
              TUWUNEL_ADDRESS: 0.0.0.0
              TUWUNEL_PORT: "8008"
              TUWUNEL_ALLOW_REGISTRATION: "false"
              TUWUNEL_LOGIN_WITH_PASSWORD: "false"
              # Element Classic on iOS uses /r0/.../redirect/<idp>, which Tuwunel
              # does not implement. With our single Kanidm IdP, omit provider IDs
              # so clients use the supported bare SSO redirect endpoint.
              TUWUNEL_SINGLE_SSO: "true"
              TUWUNEL_REGISTRATION_SHARED_SECRET_FILE: /run/secrets/registration_shared_secret
              TUWUNEL_ALLOW_FEDERATION: "true"
              # Allow-list: non-empty means everything else is denied. Own server
              # is always permitted. Anchored so "evilbeeper.com" does not match.
              TUWUNEL_ALLOWED_REMOTE_SERVER_NAMES_EXPERIMENTAL: '["(^|\\.)beeper\\.com$"]'
              TUWUNEL_WELL_KNOWN__CLIENT: https://matrix.waltr.tech
              TUWUNEL_WELL_KNOWN__SERVER: matrix.waltr.tech:443
              TUWUNEL_IDENTITY_PROVIDER__0__BRAND: Kanidm
              TUWUNEL_IDENTITY_PROVIDER__0__NAME: Kanidm
              TUWUNEL_IDENTITY_PROVIDER__0__REGISTRATION: "true"
              TUWUNEL_IDENTITY_PROVIDER__0__ISSUER_URL: https://idm.waltr.tech/oauth2/openid/matrix
              TUWUNEL_IDENTITY_PROVIDER__0__CALLBACK_URL: https://matrix.waltr.tech/_matrix/client/unstable/login/sso/callback/matrix
              TUWUNEL_IDENTITY_PROVIDER__0__CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: matrix-kanidm-oauth2-credentials
                    key: CLIENT_ID
              TUWUNEL_IDENTITY_PROVIDER__0__CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: matrix-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /_matrix/client/versions
                    port: 8008
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /_matrix/client/versions
                    port: 8008
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: tuwunel
        ports:
          http:
            port: 8008
    route:
      app:
        hostnames:
          - matrix.waltr.tech
        parentRefs:
          - name: envoy-internal
            namespace: network
          # Federation needs a public name; external-dns publishes the CNAME and
          # the Cloudflare tunnel carries it. Remove this to go internal-only.
          - name: envoy-external
            namespace: network
    persistence:
      registration-secret:
        type: secret
        name: matrix-secret
        advancedMounts:
          tuwunel:
            app:
              - path: /run/secrets
                readOnly: true
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: openebs-hostpath
        forceRename: tuwunel-data
        globalMounts:
          - path: /var/lib/tuwunel
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
