---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Tuwunel's shared-secret registration credential, minted by the `matrix`
# Password generator. `refreshInterval: "0"` is load-bearing: every reconcile
# would otherwise rotate the value (docs/secrets.md). Re-minting is harmless —
# it only changes the key future provisioning calls must sign with.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix
spec:
  refreshInterval: "0"
  target:
    name: matrix-secret
    template:
      data:
        registration_shared_secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: matrix
