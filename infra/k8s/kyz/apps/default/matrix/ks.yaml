---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Matrix homeserver + Element Web client. Internal-only demo (no federation),
# added 2026-11-01 as a comms-channel demo for the self-hosted agent
# (see docs/comms-demos.md). Tuwunel (Rust) is the lightweight, spec-compliant homeserver; it needs
# no PostgreSQL.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: matrix
spec:
  interval: 1h
  path: ./infra/k8s/kyz/apps/default/matrix/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  dependsOn:
    - name: openebs
      namespace: openebs
  wait: false
