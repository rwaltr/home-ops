---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: home-assistant-mcp-secret
    template:
      data:
        HOMEASSISTANT_TOKEN: "{{ .token }}"
  data:
    # The same long-lived token Home Assistant already issues for Prometheus
    # scraping, not a second credential. It carries that token's permissions, which
    # is why the server runs with READ_ONLY_MODE=true.
    - secretKey: token
      remoteRef:
        key: home-assistant-secret
        property: prometheus_token
