---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# OIDC_CLIENT_CRYPTO_KEY — 1Password item `freshrss-oidc` (vault home-ops), field
# `password`. Minted by `infra/terraform/bootstrap/freshrss-oidc.tf`, not pasted:
# FreshRSS's OIDC module uses it for its own internal encryption and nothing human
# needs to read it.
#
# Not a client credential — the client id and secret come from the
# KanidmOAuth2Client in this directory, which kaniop mints.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: freshrss-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: freshrss-oidc
  data:
    - secretKey: OIDC_CLIENT_CRYPTO_KEY
      remoteRef:
        key: freshrss-oidc
        property: password
