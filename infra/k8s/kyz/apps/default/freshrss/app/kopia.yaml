---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# DELIBERATELY NOT using components/kopiur/backup: FreshRSS keeps state in TWO
# PVCs (data + extensions) and the component templates a single ${PVC}. Flux
# postBuild substitution is string-level, so a variable-length sources list
# cannot be expressed as a component variable (same exception as HA's kopia.yaml).
#
# copyMethod: Direct is mandatory on openebs-hostpath (no CSI snapshots) — the
# mover reads the live PVC, so snapshots are crash-consistent. FreshRSS keeps
# its articles in SQLite (data/db.sqlite); a snapshot taken mid-write is the
# accepted tradeoff, same as HA's recorder DB.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: freshrss
  namespace: default
spec:
  repository:
    kind: ClusterRepository
    name: cluster-kopia
  sources:
    - pvc:
        name: freshrss-data
      sourcePathStrategy: PvcName
    - pvc:
        name: freshrss-extensions
      sourcePathStrategy: PvcName
  copyMethod: Direct
  # The mover must READ the PVCs. FreshRSS runs its Apache/PHP children as
  # www-data (uid/gid 33) and its entrypoint chgrps data/ + extensions/ to
  # www-data before exec, so a default-UID mover gets EACCES on data/users/<u>/
  # (mode 0700, owned by 33).
  mover:
    securityContext:
      runAsUser: 33
      runAsGroup: 33
    podSecurityContext:
      fsGroup: 33
  retention:
    keepLatest: 7
    keepDaily: 14
    keepWeekly: 4
  # Verification duplicated from components/kopiur/backup — this policy is
  # hand-written for the two-PVC reason above. Keep the two in step; without it
  # kopiur verifies nothing here and `status.lastVerified` stays empty. The
  # duplication is why `storageClassName` had to be added in two places, not
  # one: this cluster has no default StorageClass, so a scratch PVC that omits
  # it never binds and the deep-verify Job sits Pending.
  verification:
    quick:
      schedule:
        cron: "H 4 * * *"
        jitter: 30m
      maxErrors: 0
    deep:
      schedule:
        cron: "H 5 * * 0"
        jitter: 1h
      capacity: 20Gi
      storageClassName: openebs-hostpath
    successExpr: "(tier == 'quick' ? stats.bytes > 0 : restored.files > 0) && stats.errors == 0"
    verifyFilesPercent: 10
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: freshrss-nightly
  namespace: default
spec:
  policyRef:
    name: freshrss
  schedule:
    # H is a deterministic offset; 5am is clear of the other movers.
    cron: "H 5 * * *"
    jitter: 30m
    runOnCreate: false
