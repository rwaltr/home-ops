---
# Model access for the personal pod, shared by both profiles. The Matrix
# credentials live in the per-profile ExternalSecrets below, so a missing bot
# item cannot stop this Secret from syncing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-personal-model
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: hermes-personal-model
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: OpenRouter API Key
        property: credential
