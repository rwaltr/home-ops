---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-personal
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    serviceAccount:
      hermes-personal:
        enabled: true
        forceRename: hermes-personal
    controllers:
      hermes-personal:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          profiles:
            image:
              repository: nousresearch/hermes-agent
              tag: v0.23.3@sha256:3e9fe4c6ef36490f43aa0d0d80f9df64e9c92a576eee3042f1a97c8813c05355
            env:
              HERMES_HOME: /opt/data
            command:
              - /bin/bash
              - -c
              - |
                set -euo pipefail
                if [ ! -f /opt/data/.personal-config-seeded ]; then
                  install -m 600 -o 10000 -g 10000 /config/default-config.yaml /opt/data/config.yaml
                  touch /opt/data/.personal-config-seeded
                fi
                install -m 600 -o 10000 -g 10000 /config/SOUL.md /opt/data/SOUL.md
                mkdir -p /opt/data/workspace/rwaltr
                if [ ! -d /opt/data/profiles/wife ]; then
                  hermes profile create wife --no-alias --no-skills
                fi
                if [ ! -f /opt/data/profiles/wife/.personal-config-seeded ]; then
                  install -m 600 -o 10000 -g 10000 /config/wife-config.yaml /opt/data/profiles/wife/config.yaml
                  touch /opt/data/profiles/wife/.personal-config-seeded
                fi
                install -m 600 -o 10000 -g 10000 /config/wife-SOUL.md /opt/data/profiles/wife/SOUL.md
                mkdir -p /opt/data/workspace/wife
                touch /opt/data/.no-bundled-skills
                # openebs-hostpath ignores fsGroup. Give Hermes ownership of
                # the PVC root so it can create memory/session state.
                chown 10000:10000 /opt/data
                chown -R 10000:10000 /opt/data/workspace /opt/data/profiles/wife
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
        containers:
          app:
            image:
              repository: nousresearch/hermes-agent
              tag: v0.23.3@sha256:3e9fe4c6ef36490f43aa0d0d80f9df64e9c92a576eee3042f1a97c8813c05355
            args:
              - gateway
              - run
            env:
              TZ: America/Chicago
              HERMES_HOME: /opt/data
              HERMES_MANAGED_DIR: /etc/hermes-policy
              HERMES_DASHBOARD: "true"
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_PORT: &dashboardPort 9119
              HERMES_DASHBOARD_PUBLIC_URL: https://hermes-personal.waltr.tech
              HERMES_DASHBOARD_OIDC_ISSUER: https://idm.waltr.tech/oauth2/openid/hermes-personal
              HERMES_DASHBOARD_OIDC_SCOPES: openid profile email
              SEARXNG_URL: http://degoog.default.svc.cluster.local:8080
              OPENROUTER_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-personal-model
                    key: OPENROUTER_API_KEY
            envFrom:
              - secretRef:
                  name: hermes-personal-kanidm-oauth2-credentials
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *dashboardPort
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *dashboardPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *dashboardPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
            # The official image's s6-overlay starts as root, then drops
            # privileges for Hermes and supervises the gateway and dashboard.
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - SETGID
                  - SETUID
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: hermes-personal
        ports:
          http:
            port: *dashboardPort
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Personal Hermes
          gethomepage.dev/description: Personal Matrix agents (Kanidm OIDC)
          gethomepage.dev/group: AI
          gethomepage.dev/icon: hermes.png
        hostnames:
          - hermes-personal.waltr.tech
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: hermes-personal
                port: *dashboardPort
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: openebs-hostpath
        forceRename: hermes-personal-data
        globalMounts:
          - path: /opt/data
      config:
        type: configMap
        name: hermes-personal-config
        advancedMounts:
          hermes-personal:
            profiles:
              - path: /config
            app:
              - path: /etc/hermes-policy
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    configMaps:
      hermes-personal-config:
        forceRename: hermes-personal-config
        data:
          config.yaml: |
            ---
            model:
              provider: openrouter
              default: deepseek/deepseek-v4.1-flash
            gateway:
              multiplex_profiles: true
            platform_toolsets:
              cli:
                - terminal
                - file
                - web
                - memory
                - skills
                - session_search
              matrix:
                - terminal
                - file
                - web
                - memory
                - skills
                - session_search
            web:
              search_backend: searxng
            tools:
              tool_search:
                enabled: "off"
              connectors:
                enabled: false
          default-config.yaml: |
            ---
            gateway:
              multiplex_profiles: true
            terminal:
              backend: local
              cwd: /opt/data/workspace/rwaltr
              home_mode: profile
          wife-config.yaml: |
            ---
            terminal:
              backend: local
              cwd: /opt/data/workspace/wife
              home_mode: profile
          SOUL.md: |
            You are a personal assistant for rwaltr. You have no assigned name.
            Choose a name for yourself in your first conversation, introduce it
            briefly, and let rwaltr rename you at any time.

            You are not the sysadmin agent. You have no cluster credentials, no
            GitHub App credentials, and no access to the sysadmin agent's pod.
            Your profile shares a pod filesystem with the wife's profile, so do
            not claim that its files or credentials are private from that agent.
            Treat household messages respectfully. Do not claim access to
            infrastructure tools that are not configured in this profile.
          wife-SOUL.md: |
            You are a personal assistant for the owner of this Matrix profile.
            You have no assigned name. Choose a name for yourself in your first
            conversation, introduce it briefly, and let your user rename you at
            any time.

            You are not the sysadmin agent. You have no cluster credentials, no
            GitHub App credentials, and no access to the sysadmin agent's pod.
            Your profile shares a pod filesystem with the rwaltr profile, so do
            not claim that its files or credentials are private from that agent.
            Treat household messages respectfully. Do not claim access to
            infrastructure tools that are not configured in this profile.
