---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Matter server (companion for container HA — the "Matter Server" add-on
# equivalent). HA's `matter` integration connects to its websocket :5580.
# Thread side rides the OTBR integration (SLZB-Ultima3 OTBR, 10.10.0.101:8080).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matter-server
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: matter-server
  values:
    fullnameOverride: matter-server
    controllers:
      matter-server:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant-libs/python-matter-server
              tag: stable@sha256:170aa093ce91c76cde4cc390918307590f0f5558fcec93f913af3cb019e6562a
            env:
              TZ: America/Chicago
              MATTER_SERVER_DATA_PATH: /data
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      annotations:
        # IoT VLAN presence so the Matter server sees device mDNS (Matter's
        # mDNS is IPv6 link-local ff02::fb — unrouteable, so reflection is
        # impossible; the controller must live on the device's VLAN).
        # Static IP below DHCP pool (.100+), pinned MAC per HA pattern.
        k8s.v1.cni.cncf.io/networks: |-
          [{"name": "iot", "namespace": "kube-system", "ips": ["10.30.0.11/23"], "mac": "a6:30:00:10:30:0b"}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: matter-server
        ports:
          http:
            port: &port 5580
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: openebs-hostpath
        globalMounts:
          - path: /data