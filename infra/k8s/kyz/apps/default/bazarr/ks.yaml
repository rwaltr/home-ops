---
# yaml-language-server: $schema=https://kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bazarr
spec:
  components:
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./infra/k8s/kyz/apps/default/bazarr/app
  postBuild:
    substitute:
      APP: bazarr
      PVC: bazarr
      KOPIUR_CRON: "H 11 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
