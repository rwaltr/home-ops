---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Unmanic — persistent library optimiser. Watches the TV + movie libraries and
# re-encodes anything that cannot direct play, then Sonarr/Radarr rename from
# the new MediaInfo.
#
# CPU-ONLY ON PURPOSE. The iGPU is an exclusive DRA device, so any GPU worker
# would force Jellyfin to scale to 0. x264 veryfast measured ~49.6x realtime on
# the i9-13900H, so a CPU worker keeps up with imports while Jellyfin stays
# online the whole time. CPU is capped so a long transcode cannot starve
# Jellyfin.
#
# BACKGROUND WORK ON PURPOSE. `priorityClassName: unmanic-background` (see
# priorityclass.yaml) is a below-default, non-preempting class: Unmanic is
# scheduled after everything else and is the first pod node-pressure eviction
# takes, so it can never displace Jellyfin or anything else. A killed transcode
# is re-queued, not lost. The 250m CPU request keeps its cgroup CPU weight low
# for the same reason — it only gets CPU nobody else wants.
#
# Consequently "this pod is at its CPU limit and throttled" is the expected
# steady state while it has work. CPU alerts for this pod are routed to the
# blackhole receiver in o11y/kube-prometheus-stack/alertmanagerconfig.yaml —
# visible in Alertmanager, never paged.
#
# NOTE: libraries, plugin repo and the plugin flow are runtime config on the
# config PVC (like Sonarr/Radarr), not declared here. See
# docs/jellyfin-direct-play.md for the flow to reproduce.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unmanic
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: unmanic
  values:
    fullnameOverride: unmanic
    controllers:
      unmanic:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/unmanic/unmanic
              tag: 0.4.1@sha256:36a705923193db6b8ca7abd5b57b81a7309d04aedd320ec0ef4e9ac5970be885
            env:
              TZ: America/Chicago
              PUID: "1000"
              PGID: "1000"
              # CPU workers. Each worker runs one ffmpeg at a time. Raised 2 -> 3
              # alongside dropping the CPU cap: the node has 20 cores and ~15 idle
              # while the backlog sits near 1,900 files. Costs ~1.4 GiB more at peak.
              NUMBER_OF_WORKERS: "3"
              # Periodic full library scan (inotify handles new files too).
              SCHEDULE_FULL_SCAN_MINUTES: "60"
              RUN_FULL_SCAN_ON_START: "false"
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              # CPU request, no CPU limit, on purpose. CPU shares are derived from
              # requests, so the 250m request is the lever that makes this pod yield
              # under contention — not a quota. The 4-core limit only ever throttled
              # it (~95% of CFS periods) against a node sitting ~75% idle with 4.3 of
              # 20 cores committed. Throttling is the cost; the request is the guard.
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                # Memory keeps its cap: memory is not reclaimed fairly, and this node
                # has no swap. Budget is ~1 GiB idle floor + ~1.4 GiB per worker at
                # peak; the pod hit 3.8 GiB with two workers, so 6Gi covers three with
                # headroom. Do not raise the worker count without re-measuring.
                memory: 6Gi
    defaultPodOptions:
      # Below-default, non-preempting background class (see priorityclass.yaml).
      priorityClassName: unmanic-background
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: unmanic
        ports:
          http:
            port: &port 8888
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames:
          - unmanic.waltr.tech
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: unmanic-config
        globalMounts:
          - path: /config
      cache:
        existingClaim: unmanic-cache
        globalMounts:
          - path: /tmp/unmanic
      # Media from tank (ZFS DAS) — READ-WRITE: Unmanic replaces files in place.
      media-movies:
        type: hostPath
        hostPath: /var/tank/nas/library/media/movies
        globalMounts:
          - path: /media/movies
      media-tv:
        type: hostPath
        hostPath: /var/tank/nas/library/media/tv
        globalMounts:
          - path: /media/tv
