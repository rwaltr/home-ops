---
# yaml-language-server: $schema=https://gateway-api.sigs.k8s.io/geps/gep-1748
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: audiobookshelf
  annotations:
    # Listed on the Homepage dashboard — see docs/homepage.md.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Audiobookshelf
    gethomepage.dev/description: Audiobook streaming
    gethomepage.dev/group: Reading
    gethomepage.dev/icon: audiobookshelf.png
spec:
  hostnames:
    - audiobooks.waltr.tech
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: audiobookshelf
          port: 80
