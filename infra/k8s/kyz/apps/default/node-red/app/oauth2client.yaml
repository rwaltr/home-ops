---
# Node-RED's OIDC client in Kanidm, managed by kaniop.
# Envoy Gateway uses these credentials for the route-level SecurityPolicy.
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: node-red
spec:
  kanidmRef:
    name: kanidm
    namespace: identity
  displayname: Node-RED
  origin: https://nodered.waltr.tech
  redirectUrl:
    - https://nodered.waltr.tech/oauth2/callback
  scopeMap:
    - group: idm_all_persons
      scopes:
        - openid
        - profile
        - email
  disableConsentPrompt: true
  preferShortUsername: true
  # Envoy Gateway sends a PKCE challenge and uses a confidential client.
  # The secret key names match the Gateway SecurityPolicy's required Secret keys.
  secretKeyAliases:
    clientId:
      - client-id
    clientSecret:
      - client-secret
