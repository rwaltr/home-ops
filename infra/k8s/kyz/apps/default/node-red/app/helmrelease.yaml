---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Node-RED — low-code flow editor for the Paperless/Immich automation that
# replaced Windmill. Internal only: `nodered.waltr.tech` sits on envoy-internal,
# with no envoy-external parentRef, so nothing here is published.
#
# Workflow state does NOT live in this repo. Node-RED's Projects feature keeps a
# flow set in a git repository of its own (Forgejo), so `home-ops` holds only
# this deployment. See docs/node-red.md.
#
# Image is the official one: it runs as uid 1000, keeps its user dir in /data,
# and ships git + OpenSSH, which is what makes Projects work without a custom
# image. The digest is the multi-arch index, so an arm64 rebuild stays possible.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-red
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: node-red
  values:
    fullnameOverride: node-red
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      node-red:
        # RWO PVC holding flows.json and the credential store: never two pods.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/nodered/node-red
              tag: 5.0.10@sha256:3622786c15b6f57f61bf1d0ece59d06a18b742c5c8955f588d189b6bee8dc97d
            env:
              TZ: America/Chicago
              # $HOME goes to the volume because the root FS is read-only: git
              # (for Projects), npm and node-gyp all write caches under it.
              HOME: /data
              NODERED_CREDENTIAL_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: node-red-credential-secret
                    key: NODERED_CREDENTIAL_SECRET
            probes:
              # tcpSocket, not an HTTP path: every editor route answers 401 once
              # an adminAuth strategy is added, and an HTTP probe would then fail
              # a healthy pod. The port check holds either way.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 1880
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  # First boot initialises the user dir on an empty PVC.
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                # Idle is roughly 100-150Mi; the editor and a burst of flows fit
                # well inside this, and the node has no swap.
                memory: 512Mi
    service:
      app:
        controller: node-red
        ports:
          http:
            appProtocol: http
            port: *port
    route:
      app:
        annotations:
          # Listed on the Homepage dashboard — see docs/homepage.md.
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Node-RED
          gethomepage.dev/description: Flow automation
          gethomepage.dev/group: Automation
          gethomepage.dev/icon: node-red.png
          # `/` is the editor. It answers 200 while no editor login is
          # configured; adding one makes it a 302 to the identity provider, so
          # widen this condition to accept 3xx at the same time.
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames:
          - nodered.waltr.tech
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      # flows.json, flows_cred.json, settings.js override, git Projects, and the
      # node_modules that Projects install into. Small and text: 2Gi is generous.
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        storageClass: openebs-hostpath
        # Pinned: app-template only suffixes PVC names once a second PVC exists,
        # and the kopiur policy refers to this exact name.
        forceRename: node-red-data
        globalMounts:
          - path: /data
      # subPath mount, so the volume keeps its own settings.js if this file is
      # ever removed. The reloader annotation above rolls the pod on a change.
      settings:
        type: configMap
        name: node-red-settings
        globalMounts:
          - path: /data/settings.js
            subPath: settings.js
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
