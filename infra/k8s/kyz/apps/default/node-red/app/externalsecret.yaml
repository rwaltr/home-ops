---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The credential secret settings.js reads as NODERED_CREDENTIAL_SECRET.
#
# `refreshInterval: "0"` is load-bearing: a Password generator mints a new value
# on every sync, and a rotating credential secret makes every credential already
# stored in the flows undecryptable. Deleting this Secret mints a new one, which
# then orphans those credentials — re-enter them in the editor.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: node-red-credential-secret
spec:
  refreshInterval: "0"
  target:
    name: node-red-credential-secret
    template:
      data:
        NODERED_CREDENTIAL_SECRET: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: node-red-credential
