---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: node-red
spec:
  components:
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./infra/k8s/kyz/apps/default/node-red/app
  postBuild:
    substitute:
      APP: node-red
      PVC: node-red-data
      # 18:00 is the one night hour no other app's mover uses.
      KOPIUR_CRON: "H 18 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  dependsOn:
    - name: openebs # the /data PVC on the openebs-hostpath storage class
      namespace: openebs
    - name: external-secrets # the Password generator behind the credential secret
      namespace: external-secrets
    - name: kanidm # the OAuth2Client CRD and OIDC provider
      namespace: identity
    - name: envoy-gateway # the SecurityPolicy CRD and controller
      namespace: network
  wait: false
