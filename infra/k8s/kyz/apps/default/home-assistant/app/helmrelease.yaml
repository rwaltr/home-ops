---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Home Assistant (onedr0p pattern; internal-only route).
# Phase 2 (deferred): Multus/macvlan NAD for mDNS/SSDP discovery on the LAN
# — plain Service first, manual-IP integrations work fine.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: home-assistant
  values:
    fullnameOverride: home-assistant
    controllers:
      home-assistant:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.9.1@sha256:1bcf770d15bd91a55491d04f12494febb35da68b025e1f6612a167a2e190a8c7
            env:
              TZ: America/Chicago
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    # NOTE: this HA build has no /healthz (404s) — manifest.json is
                    # served unauthenticated and always 200 once the webserver is up
                    path: /manifest.json
                    port: &port 8123
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
    defaultPodOptions:
      annotations:
        # Per-VLAN macvlan attachments (multus): L2 presence on clients/iot/
        # cameras for mDNS/SSDP discovery + device reach. Static IPs below the
        # router DHCP pools (.100+), pinned MACs (a6:30:00:10:<vlan>:0a).
        k8s.v1.cni.cncf.io/networks: |-
          [
            {"name": "clients", "namespace": "kube-system", "ips": ["10.20.0.10/24"], "mac": "a6:30:00:10:20:0a"},
            {"name": "iot", "namespace": "kube-system", "ips": ["10.30.0.10/23"], "mac": "a6:30:00:10:30:0a"},
            {"name": "cameras", "namespace": "kube-system", "ips": ["10.40.0.10/24"], "mac": "a6:30:00:10:40:0a"}
          ]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: home-assistant
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames:
          - homeassistant.waltr.tech
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: openebs-hostpath
        globalMounts:
          - path: /config
      config-cache:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: openebs-hostpath
        globalMounts:
          - path: /config/.venv
      tmp:
        type: emptyDir