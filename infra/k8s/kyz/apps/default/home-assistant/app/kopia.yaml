---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# DELIBERATELY NOT using components/kopiur/backup: HA backs up TWO PVCs
# (config + config-cache) and the component templates a single ${PVC}. Flux
# postBuild substitution is string-level, so a variable-length sources list
# cannot be expressed as a component variable. Upstream onedr0p/home-ops has
# the same exception for the same reason (its config PVC comes from the
# component, its cache PVC is hand-written here).
#
# Kopia enrollment for HA's PVCs (namespace-scoped policy; repo via
# ClusterRepository/cluster-kopia, ns admitted by the repo's tenancy label
# on the default namespace).
# copyMethod: Direct is mandatory on openebs-hostpath (no CSI snapshots) —
# crash-consistent live reads; HA's sqlite recorder is the accepted tradeoff
# (beforeSnapshot hooks exist if it ever needs quiescing).
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: home-assistant
  namespace: default
spec:
  repository:
    kind: ClusterRepository
    name: cluster-kopia
  sources:
    - pvc:
        name: home-assistant-config
      sourcePathStrategy: PvcName
    - pvc:
        name: home-assistant-config-cache
      sourcePathStrategy: PvcName
  copyMethod: Direct
  # The mover must READ HA's PVC: HA runs as 1000:1000 with fsGroup 1000
  # and its .storage/ is mode 0700 — a default-UID mover (65532) gets EACCES.
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    podSecurityContext:
      fsGroup: 1000
  retention:
    keepLatest: 7
    keepDaily: 14
    keepWeekly: 4
  # Verification is duplicated from components/kopiur/backup rather than shared,
  # because this policy is hand-written for the two-PVC reason above. Keep the
  # two in step: without this block kopiur verifies nothing here and HA's
  # `status.lastVerified` stays empty, which is the one backup nobody wants to
  # discover is unreadable. Tiers and the successExpr trap are documented in
  # kopiur-system/README.md.
  verification:
    quick:
      schedule:
        cron: "H 4 * * *"
        jitter: 30m
      maxErrors: 0
    deep:
      schedule:
        cron: "H 5 * * 0"
        jitter: 1h
      capacity: 20Gi
    successExpr: "stats.files > 0 && stats.errors == 0"
    verifyFilesPercent: 10
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: home-assistant-nightly
  namespace: default
spec:
  policyRef:
    name: home-assistant
  schedule:
    cron: "H 3 * * *"
    jitter: 30m
    runOnCreate: false
