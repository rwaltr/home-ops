---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/refs/tags/v8.0.0/schemas/config-schema.json
# TRaSH-Guides sync for Sonarr + Radarr (keys via SONARR_API_KEY/RADARR_API_KEY).
#
# Profiles:
#   * WEB-2160p (Combined) / WEBDL 2160p (Combined) — 4K (TRaSH-managed)
#   * HD-1080p   — the workhorse (TRaSH-managed quality list + scores)
#   * Any / SD / HD-720p / Ultra-HD / HD - 720p/1080p — AUX profiles.
#     TRaSH has no SD, no 720p-only and no "Any" profile, so a 1:1 mapping does
#     not exist. Declared by `name` with `qualities` OMITTED, so Recyclarr only
#     manages their custom-format SCORES and leaves each quality list exactly as
#     it is. That matters: SD/HD - 720p/1080p carry the SD-only kids catalogue
#     (Sesame Street, Mister Rogers, Bob the Builder, Wishbone, I Love Lucy) —
#     forcing them onto a 1080p-only TRaSH list would make them find nothing.
#
# `upgrade.allowed: true` on every managed profile: this library is actively
# curated, not an archive — monitored items should keep upgrading to better
# releases. (It was false while we adopted the TRaSH quality sets, to avoid a
# mass re-download in one go.)
#
# AUDIO IS INTENTIONALLY NOT TRaSH DEFAULT. TRaSH scores lossless highly
# (TrueHD ATMOS +5000, TrueHD +2750, DTS-HD MA +2500, AAC only +1000) because
# its defaults assume a receiver doing passthrough. This stack is Jellyfin on
# Android/Apple clients, where DTS/DTS-HD/TrueHD/FLAC/PCM force a server-side
# audio transcode. So the direct-playable codecs are preferred and lossless is
# penalised. See docs/jellyfin-direct-play.md.
sonarr:
  series:
    base_url: http://sonarr.default.svc.cluster.local:8989
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true
    media_management:
      propers_and_repacks: do_not_prefer
    media_naming:
      episodes:
        anime: default
        daily: default
        rename: true
        standard: default
      season: default
      series: plex-imdb
    quality_definition:
      type: series
    quality_profiles:
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7 # WEB-2160p (Combined)
        upgrade:
          allowed: true
        reset_unmatched_scores:
          enabled: true
      - name: HD-1080p
        trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        upgrade:
          allowed: true
        reset_unmatched_scores:
          enabled: true
      # --- aux: scores only, quality lists untouched ---
      - name: Any
        upgrade:
          allowed: true
        reset_unmatched_scores:
          enabled: true
      - name: SD
        upgrade:
          allowed: true
        reset_unmatched_scores:
          enabled: true
      - name: HD-720p
        upgrade:
          allowed: true
        reset_unmatched_scores:
          enabled: true
      - name: Ultra-HD
        upgrade:
          allowed: true
        reset_unmatched_scores:
          enabled: true
      - name: HD - 720p/1080p
        upgrade:
          allowed: true
        reset_unmatched_scores:
          enabled: true
    custom_formats:
      - # FLUX trumps REPACKS
        trash_ids:
          - 5d9fd1b1e06cd8a475462f40214b7df6 # FLUX
        assign_scores_to:
          - { trash_id: c4cadd6b35b95f62c3d47a408e53e2f7, score: 100 }
      - # Unwanted — every profile
        trash_ids:
          - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
          - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
          - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
          - 06d66ab109d4d2eddb2794d21526d140 # Retags
        assign_scores_to:
          - { trash_id: c4cadd6b35b95f62c3d47a408e53e2f7 }
          - { trash_id: 72dae194fc92bf828f32cde7744e51a1 }
          - { name: Any }
          - { name: SD }
          - { name: HD-720p }
          - { name: Ultra-HD }
          - { name: "HD - 720p/1080p" }
      # --- direct-play audio: prefer what clients decode natively ---
      - trash_ids:
          - a50b8a0c62274a7c38b09a9619ba9d86 # AAC
          - 63487786a8b01b7f20dd2bc90dd4a477 # DD+
        assign_scores_to:
          - { trash_id: c4cadd6b35b95f62c3d47a408e53e2f7, score: 1000 }
          - { trash_id: 72dae194fc92bf828f32cde7744e51a1, score: 1000 }
          - { name: Any, score: 1000 }
          - { name: SD, score: 1000 }
          - { name: HD-720p, score: 1000 }
          - { name: Ultra-HD, score: 1000 }
          - { name: "HD - 720p/1080p", score: 1000 }
      - trash_ids:
          - dbe00161b08a25ac6154c55f95e6318d # DD
        assign_scores_to:
          - { trash_id: c4cadd6b35b95f62c3d47a408e53e2f7, score: 750 }
          - { trash_id: 72dae194fc92bf828f32cde7744e51a1, score: 750 }
          - { name: Any, score: 750 }
          - { name: SD, score: 750 }
          - { name: HD-720p, score: 750 }
          - { name: Ultra-HD, score: 750 }
          - { name: "HD - 720p/1080p", score: 750 }
      - trash_ids:
          - 3e8b714263b26f486972ee1e0fe7606c # MP3
        assign_scores_to:
          - { trash_id: c4cadd6b35b95f62c3d47a408e53e2f7, score: 500 }
          - { trash_id: 72dae194fc92bf828f32cde7744e51a1, score: 500 }
          - { name: Any, score: 500 }
          - { name: SD, score: 500 }
          - { name: HD-720p, score: 500 }
          - { name: Ultra-HD, score: 500 }
          - { name: "HD - 720p/1080p", score: 500 }
      # --- direct-play audio: penalise tracks that force a server transcode ---
      - trash_ids:
          - 5964f2a8b3be407d083498e4459d05d0 # DTS
        assign_scores_to:
          - { trash_id: c4cadd6b35b95f62c3d47a408e53e2f7, score: -500 }
          - { trash_id: 72dae194fc92bf828f32cde7744e51a1, score: -500 }
          - { name: Any, score: -500 }
          - { name: SD, score: -500 }
          - { name: HD-720p, score: -500 }
          - { name: Ultra-HD, score: -500 }
          - { name: "HD - 720p/1080p", score: -500 }
      - trash_ids:
          - c429417a57ea8c41d57e6990a8b0033f # DTS-HD MA
          - 1808e4b9cee74e064dfae3f1db99dbfe # TrueHD
          - 851bd64e04c9374c51102be3dd9ae4cc # FLAC
          - 30f70576671ca933adbdcfc736a69718 # PCM
        assign_scores_to:
          - { trash_id: c4cadd6b35b95f62c3d47a408e53e2f7, score: -1000 }
          - { trash_id: 72dae194fc92bf828f32cde7744e51a1, score: -1000 }
          - { name: Any, score: -1000 }
          - { name: SD, score: -1000 }
          - { name: HD-720p, score: -1000 }
          - { name: Ultra-HD, score: -1000 }
          - { name: "HD - 720p/1080p", score: -1000 }
      - trash_ids:
          - 0d7824bb924701997f874e7ff7d4844a # TrueHD ATMOS
          - b6fbafa7942952a13e17e2b1152b539a # ATMOS (undefined)
        assign_scores_to:
          - { trash_id: c4cadd6b35b95f62c3d47a408e53e2f7, score: -1500 }
          - { trash_id: 72dae194fc92bf828f32cde7744e51a1, score: -1500 }
          - { name: Any, score: -1500 }
          - { name: SD, score: -1500 }
          - { name: HD-720p, score: -1500 }
          - { name: Ultra-HD, score: -1500 }
          - { name: "HD - 720p/1080p", score: -1500 }

