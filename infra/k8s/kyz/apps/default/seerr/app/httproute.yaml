---
# yaml-language-server: $schema=https://gateway-api.sigs.k8s.io/geps/gep-1748
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr
  annotations:
    # Listed on the Homepage dashboard — see docs/homepage.md.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Seerr
    gethomepage.dev/description: Media requests
    gethomepage.dev/group: Media
    gethomepage.dev/icon: seerr.png
spec:
  hostnames:
    - seerr.waltr.tech
  parentRefs:
    - name: envoy-internal
      namespace: network
    - name: envoy-external # public via cloudflare tunnel (CGNAT — no port forwards)
      namespace: network
  rules:
    - backendRefs:
        - name: seerr
          port: 5055
