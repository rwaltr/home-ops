---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: parakeet
spec:
  interval: 1h
  path: ./infra/k8s/kyz/apps/default/parakeet/app
  postBuild:
    substitute:
      APP: parakeet
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  dependsOn:
    - name: openebs # PVCs on the openebs-hostpath storage class
      namespace: openebs
  wait: false
