---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: go2rtc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: go2rtc-secret
    template:
      data:
        GO2RTC_RTSP_USER: "{{ .username }}"
        GO2RTC_RTSP_PASS: "{{ .password }}"
        # RTSP URLs need percent-encoding — the camera password contains '@'
        GO2RTC_RTSP_PASS_ENC: "{{ .password | urlquery }}"
  dataFrom:
    - extract:
        key: reolink local admin