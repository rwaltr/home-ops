---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./externalsecret.yaml
  - ./httproute.yaml
configMapGenerator:
  - name: go2rtc-config
    files:
      - go2rtc.yaml=./go2rtc.yaml
generatorOptions:
  disableNameSuffixHash: true