---
# yaml-language-server: $schema=https://gateway-api.sigs.k8s.io/geps/gep-1748
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: go2rtc
  annotations:
    # Listed on the Homepage dashboard — see docs/homepage.md.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: go2rtc
    gethomepage.dev/description: Camera streaming and WebRTC
    gethomepage.dev/group: Smart Home
    gethomepage.dev/icon: go2rtc.png
    gatus.home-operations.com/endpoint: |-
      conditions: ["[STATUS] == 200"]
spec:
  hostnames:
    - go2rtc.waltr.tech
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: go2rtc
          port: 1984
