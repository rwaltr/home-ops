---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Router credentials and MikroMCP's own inbound token, from the 1Password item
# titled `microtik` (vault home-ops) — note the spelling: the title is
# m-i-c-r-o-t-i-k, and 1Password matches titles literally, which is exactly what
# made this fail as "key not found" on first deploy. Field labels are the
# contract too, so a rename on either side breaks the pod.
#
# The item is a Login, so two of its standard labels carry most of it:
#   username      -> ROUTER_MOUSE_USER   (matches envPrefix in routers.yaml)
#   password      -> ROUTER_MOUSE_PASS
#   confirmsecret -> MIKROMCP_CONFIRMATION_SECRET (HMAC key for destructive-action
#                    confirmations; required in HTTP mode even read-only)
#   mcptoken      -> MIKROMCP_CLIENT_TOKEN (raw bearer token a client presents;
#                    hashed to bcrypt by the initContainer, never stored in git)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mikrotik-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mikrotik-mcp-secret
  data:
    - secretKey: ROUTER_MOUSE_USER
      remoteRef:
        key: microtik
        property: username
    - secretKey: ROUTER_MOUSE_PASS
      remoteRef:
        key: microtik
        property: password
    - secretKey: MIKROMCP_CONFIRMATION_SECRET
      remoteRef:
        key: microtik
        property: confirmsecret
    # The inbound bearer token is a *generated* credential, so it does not live
    # on the hand-made router item: Terraform mints it into `microtik-mcp`
    # (infra/terraform/bootstrap/mikrotik-mcp.tf), and its value is the login's
    # password field — the only top-level shape the provider can write and
    # External Secrets can read back.
    - secretKey: MIKROMCP_CLIENT_TOKEN
      remoteRef:
        key: microtik-mcp
        property: password
