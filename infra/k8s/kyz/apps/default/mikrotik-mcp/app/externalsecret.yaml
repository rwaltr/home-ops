---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Router credentials and MikroMCP's own inbound token, from 1Password item
# `mikrotik` (vault home-ops). Field labels are the contract — 1Password matches
# them literally, so a rename here costs the pod that variable.
#
# The item is a Login, so two of its standard labels carry most of it:
#   username      -> ROUTER_MOUSE_USER   (matches envPrefix in routers.yaml)
#   password      -> ROUTER_MOUSE_PASS
#   confirmsecret -> MIKROMCP_CONFIRMATION_SECRET (HMAC key for destructive-action
#                    confirmations; required in HTTP mode even read-only)
#   website       -> ROUTER_HOST (informational; the address actually dialled
#                    comes from routers.yaml in the ConfigMap, so fix that one if
#                    the two ever disagree)
#   mcptoken      -> MIKROMCP_CLIENT_TOKEN (raw bearer token a client presents;
#                    hashed to bcrypt by the initContainer, never stored in git)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mikrotik-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mikrotik-mcp-secret
  data:
    - secretKey: ROUTER_MOUSE_USER
      remoteRef:
        key: mikrotik
        property: username
    - secretKey: ROUTER_MOUSE_PASS
      remoteRef:
        key: mikrotik
        property: password
    - secretKey: MIKROMCP_CONFIRMATION_SECRET
      remoteRef:
        key: mikrotik
        property: confirmsecret
    - secretKey: ROUTER_HOST
      remoteRef:
        key: mikrotik
        property: website
    - secretKey: MIKROMCP_CLIENT_TOKEN
      remoteRef:
        key: mikrotik
        property: mcptoken
