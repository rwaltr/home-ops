---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Router credentials and MikroMCP's own inbound token, from 1Password item
# `mikrotik` (vault home-ops). Field names are the contract — if a field is
# renamed here the pod loses that variable, so they are listed in one place.
#
#   api_user            -> ROUTER_MOUSE_USER   (matches envPrefix in routers.yaml)
#   api_password        -> ROUTER_MOUSE_PASS
#   confirmation_secret -> MIKROMCP_CONFIRMATION_SECRET (required in HTTP mode)
#   mcp_token           -> MIKROMCP_CLIENT_TOKEN (raw; hashed to bcrypt by the
#                          initContainer, never stored in git)
#   host                -> ROUTER_HOST (informational; routers.yaml carries the
#                          actual address, so a mismatch there is the one to fix)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mikrotik-mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mikrotik-mcp-secret
  data:
    - secretKey: ROUTER_MOUSE_USER
      remoteRef:
        key: mikrotik
        property: api_user
    - secretKey: ROUTER_MOUSE_PASS
      remoteRef:
        key: mikrotik
        property: api_password
    - secretKey: MIKROMCP_CONFIRMATION_SECRET
      remoteRef:
        key: mikrotik
        property: confirmation_secret
    - secretKey: MIKROMCP_CLIENT_TOKEN
      remoteRef:
        key: mikrotik
        property: mcp_token
    - secretKey: ROUTER_HOST
      remoteRef:
        key: mikrotik
        property: host
