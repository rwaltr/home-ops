---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: slskd
spec:
  components:
    - ../../../../components/kopiur/backup
  interval: 1h
  path: ./infra/k8s/kyz/apps/default/slskd/app
  postBuild:
    substitute:
      APP: slskd
      # The PVC renders as `slskd`, not `slskd-app-data` — app-template only
      # suffixes the name once a second PVC exists. Corrected on re-enable; the
      # old value named a claim that does not exist, so the kopiur policy would
      # have failed instead of backing anything up.
      PVC: slskd
      KOPIUR_CRON: "H 10 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  dependsOn:
    - name: openebs # app-data PVC on the openebs-hostpath storage class
      namespace: openebs
  wait: false
