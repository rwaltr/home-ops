---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# NOT registered in the parent kustomization (2026-11-14): the site is CGNAT with
# no port forwards, so slskd's listening port has no inbound route and it would be
# a permanently half-connected peer. The faults its constitution carried were
# fixed in place regardless, so a later re-enable is one line and no traps — see
# docs/books.md.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: slskd
spec:
  # Disabled app: no kopiur backup. On re-enable, add the kopiur backup
  # component back with PVC `slskd` (not `slskd-app-data` — app-template only
  # suffixes the name once a second PVC exists) — see openspec/specs/pvc-backups.
  interval: 1h
  path: ./infra/k8s/kyz/apps/default/slskd/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  dependsOn:
    - name: openebs # app-data PVC on the openebs-hostpath storage class
      namespace: openebs
  wait: false
