---
# yaml-language-server: $schema=https://json.schemastore.org/configmap
# Example ledger — not real finances, and not "close enough to be mistaken for
# real". It exists so the UI has something in every view: opening balances, five
# months of payroll and spending, one VTI purchase with cost basis, a price
# series, and a closing balance assertion that actually checks something.
#
# `option "title"` is not cosmetic: Fava derives the first URL path segment from
# it, so the UI lives at /beancount/. Set it deliberately when the real ledger
# lands, or every URL changes underneath you.
#
# Replacing this file is how the real ledger gets deployed, once that decision
# is made. See docs/beancount-stack.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: beancount-stack-example
data:
  ledger.beancount: |
    option "title" "beancount"
    option "operating_currency" "USD"

    1980-01-01 commodity USD
    2020-01-01 commodity VTI

    2026-01-01 open Equity:Opening-Balances
    2026-01-01 open Assets:US:Chase:Checking      USD
    2026-01-01 open Assets:US:Fidelity:Brokerage  USD,VTI
    2026-01-01 open Income:US:Acme:Salary         USD
    2026-01-01 open Income:US:Fidelity:Dividends  USD
    2026-01-01 open Expenses:Food:Groceries       USD
    2026-01-01 open Expenses:Food:Restaurants     USD
    2026-01-01 open Expenses:Home:Utilities       USD
    2026-01-01 open Expenses:Financial:Fees       USD

    ; opening balances
    2026-01-01 * "Opening balance" "checking"
      Assets:US:Chase:Checking                12500.00 USD
      Equity:Opening-Balances                -12500.00 USD

    2026-01-01 * "Opening balance" "brokerage, 40 shares at cost"
      Assets:US:Fidelity:Brokerage               40 VTI {250.00 USD}
      Equity:Opening-Balances                -10000.00 USD

    ; payroll, monthly
