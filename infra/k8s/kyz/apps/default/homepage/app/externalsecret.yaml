---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# HOMEPAGE_AUTH_SECRET — 1Password item `homepage-auth` (vault home-ops), field
# `password`. Minted by `infra/terraform/bootstrap/homepage-oidc.tf`, not pasted:
# it signs the session cookie and nothing human needs to read it.
#
# Required whenever HOMEPAGE_AUTH_ENABLED is on, including when OIDC is doing the
# login — OIDC replaces the password, not the cookie secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: homepage-secret
  data:
    - secretKey: HOMEPAGE_AUTH_SECRET
      remoteRef:
        key: homepage-auth
        property: password
