---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Sources HOMEPAGE_AUTH_SECRET from the Password generator beside it (generator.yaml)
# rather than from 1Password: see that file for why, and for what the value is.
#
# `refreshInterval: "0"` is load-bearing, not a default. A generator produces a fresh
# value on every reconcile, and re-signing the cookie on a schedule would sign every
# session out. Zero means sync once and then leave it alone.
#
# The trade-off: the value lives only in this Secret. Deleting the Secret or this
# ExternalSecret mints a new one and signs sessions out — which is the whole blast
# radius, and the reason this is only appropriate for values nothing external holds.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-auth
spec:
  refreshInterval: "0"
  target:
    name: homepage-secret
    template:
      # The generator emits its value as `password`; the app reads it under its own
      # name, so the target key is what the HelmRelease points at.
      data:
        HOMEPAGE_AUTH_SECRET: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: homepage-auth
