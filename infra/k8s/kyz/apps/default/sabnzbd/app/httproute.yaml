---
# yaml-language-server: $schema=https://gateway-api.sigs.k8s.io/geps/gep-1748
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sabnzbd
  annotations:
    # Listed on the Homepage dashboard — see docs/homepage.md.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: SABnzbd
    gethomepage.dev/description: Usenet downloads
    gethomepage.dev/group: Media Ops
    gethomepage.dev/icon: sabnzbd.png
spec:
  hostnames:
    - sabnzbd.waltr.tech
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: sabnzbd
          port: 80
