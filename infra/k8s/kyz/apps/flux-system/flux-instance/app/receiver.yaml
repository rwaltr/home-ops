---
# yaml-language-server: $schema=https://json.schemastore.org/notification-v1.json
# GitHub push webhook -> immediate flux-system GitRepository reconcile
# (cuts out the polling lag). Secret is shared with the repo webhook, set via gh api.
# NOTE: Receiver webhook path is sha256(token + <receiver-name> + <receiver-namespace>),
# NOT sha256(token) alone — check `kubectl get receiver -n flux-system` for the live path.
# Repo webhook: https://flux-receiver.waltr.tech/hook/<that-hash>
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: github-receiver
spec:
  type: github
  events:
    - push
  resources:
    - kind: GitRepository
      name: flux-system
      namespace: flux-system
  secretRef:
    name: github-webhook-token-secret