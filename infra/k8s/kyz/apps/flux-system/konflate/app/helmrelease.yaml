---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chartRef:
    kind: OCIRepository
    name: konflate
  interval: 1h
  values:
    config:
      repo: github://rwaltr/home-ops
      statusChecks: true
      prComments: true
      publicUrl: https://{{ .Release.Name }}.waltr.tech
      mcp: true
      verifyImages: true
    secret:
      existingSecret: konflate-webhook-token-secret
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
      parentRefs:
        - name: envoy-internal
          namespace: network
        - name: envoy-external # public via cloudflare tunnel — GitHub webhooks hit /hooks
          namespace: network
      hostnames:
        - "{{ .Release.Name }}.waltr.tech"
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
        # 30d p99 working set 810Mi against a 1Gi limit. Request/limit raised:
        # a PR-review bot that has to render the whole tree wants headroom.
        memory: 1Gi
      limits:
        memory: 2Gi
