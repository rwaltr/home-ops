---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Terraform Cloud API token, rendered as the `.tfrc` file the controller expects
# in `spec.cliConfigSecretRef`.
#
# OWNER STEP: create a Terraform Cloud *user or team* API token and store it in
# 1Password as item `terraform-cloud`, field `TFC_TOKEN`. Until that item exists
# this ExternalSecret reports SecretSyncedError and the Secret is absent — no
# `Terraform` object can run without it, which is the intended fail-closed state.
#
# Scope the token to the `cloudflare-provisioner` workspace if TFC allows it:
# the controller only needs to start runs in that one workspace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tfc-cli-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: tfc-cli-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        terraform.tfrc: |
          credentials "app.terraform.io" {
            token = "{{ .TFC_TOKEN }}"
          }
  dataFrom:
    - extract:
        key: terraform-cloud
