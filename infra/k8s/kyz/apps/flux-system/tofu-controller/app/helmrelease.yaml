---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Tofu Controller (flux-iac) — reconciles `Terraform` objects against a Flux source.
#
# This is the engine for agent-authored infrastructure: HCL lives in this repo,
# a `Terraform` object points at it, and the controller runs plan/apply on its own
# instead of a human running `terraform` on a workstation. No `Terraform` objects
# are defined by this change — see docs/terraform-pipeline.md for what lands next
# and why it is staged rather than shipped together.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  chartRef:
    kind: OCIRepository
    name: tofu-controller
  interval: 1h
  values:
    # The controller is a supervisor: each Terraform run happens in a runner pod
    # it creates, so this process stays small.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
