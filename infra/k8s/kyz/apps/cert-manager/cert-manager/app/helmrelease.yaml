---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  chartRef:
    kind: OCIRepository
    name: cert-manager
  interval: 1h
  values:
    crds:
      enabled: true
    dns01RecursiveNameservers: https://1.1.1.1:443/dns-query,https://1.0.0.1:443/dns-query
    dns01RecursiveNameserversOnly: true
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
    webhook:
      # Single node: a second replica lands on the same host, so it buys no
      # failure domain. The PDB goes with it -- minAvailable 1 against 1 replica
      # would leave 0 allowed disruptions and block every future node drain.
      replicaCount: 1
      podDisruptionBudget:
        enabled: false
