---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  chartRef:
    kind: OCIRepository
    name: cert-manager
  interval: 1h
  values:
    crds:
      enabled: true
    dns01RecursiveNameservers: https://1.1.1.1:443/dns-query,https://1.0.0.1:443/dns-query
    dns01RecursiveNameserversOnly: true
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
    # Memory requests from the 30d working-set audit (docs/memory-requests.md).
    # All three were BestEffort (no request, no limit) before this.
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 256Mi
    cainjector:
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 256Mi
    webhook:
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 256Mi
      replicaCount: 2
      podDisruptionBudget:
        enabled: true
