---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: openebs
  install:
    disableHooks: true
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    disableHooks: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Only the hostpath local provisioner is in use. The DAS (tank) is kept
    # for bulk media / hand-managed datasets and intentionally NOT exposed
    # as a StorageClass; the zfs CSI is disabled until a dedicated local
    # pool exists.
    localpv-provisioner:
      localpv:
        image:
          registry: quay.io/
      hostpathClass:
        enabled: true
        # not the default class on purpose
        isDefaultClass: false
      helperPod:
        image:
          registry: quay.io/
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: true
          keep: true
    # zfs-localpv is gated by engines.local.zfs (see Chart.yaml conditions),
    # not a zfs-localpv.enabled key. Left disabled until a dedicated local pool
    # exists; the tank pool stays outside the PVC lifecycle by design.
    lvm-localpv:
      enabled: false
    mayastor:
      enabled: false
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false
    loki:
      enabled: false
    alloy:
      enabled: false
    minio:
      enabled: false