---
# Members are Forgejo site admins: the HelmRelease maps this group through
# `adminGroup`. Not a built-in group, so declaring `members` is safe here — see
# docs/kanidm.md for why that is not true of idm_admins.
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: forgejo-admins
spec:
  kanidmRef:
    name: kanidm
  kanidmName: forgejo_admins
  members:
    - rwaltr
