---
# Membership in Kanidm's built-in `idm_admins` group, which is what grants
# identity administration in the web UI — the same rights `idm_admin` has.
#
# `kanidmName` names the existing built-in group; the resource name is local.
# `description` is deliberately omitted: the CRD documents that omitting it
# leaves Kanidm's description unmanaged, whereas setting "" would clear it.
#
# Unknown until reconciled: whether the operator adopts a group it did not
# create. If it insists on creating `idm_admins` from scratch the resource will
# report an error, and the membership moves to a manual step in the UI.
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: idm-admins
spec:
  kanidmRef:
    name: kanidm
  kanidmName: idm_admins
  members:
    - rwaltr
