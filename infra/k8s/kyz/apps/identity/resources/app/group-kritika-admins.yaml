---
# Members are kritika dashboard admins: kritika's `auth.oidc.roleMappingExpr`
# maps this group's claim to "admin" and refuses everyone else. Not a built-in
# group, so declaring `members` is safe — see group-forgejo-admins.yaml.
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: kritika-admins
spec:
  kanidmRef:
    name: kanidm
  kanidmName: kritika_admins
  members:
    - rwaltr
