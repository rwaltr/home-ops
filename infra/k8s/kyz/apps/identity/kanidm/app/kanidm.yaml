---
# No yaml-language-server schema line: the schema host has no kaniop entry, so a
# pointer there would 404 and the editor would fall back to guessing anyway.
#
# The identity server.
#
# `domain` is immutable after first initialisation and is baked into WebAuthn and
# every principal name (`rwaltr@waltr.tech`), and `origin` must match or descend
# from it or the server refuses to start. Chosen once, deliberately.
#
# Public, and unavoidably so. An OAuth2 authorization server has to be reachable
# by the client's *browser* (the authorization endpoint and its login page) and by
# the client's *servers* (the token endpoint, discovery and the signing keys), so
# there is no subset of this that can stay internal once a non-cluster client is
# wired up. Grok's consumer connector is the forcing case.
#
# The internal route stays. Both parentRefs are on the same HTTPRoute, so
# idm.waltr.tech resolves to the internal VIP inside the house and to the
# Cloudflare tunnel outside it — the split-horizon behaviour the cluster's DNS
# already gives every dual-homed hostname.
#
# external-dns publishes only routes attached to envoy-external, so the second
# parentRef is also what creates the public DNS record. Removing it unpublishes.
apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: kanidm
spec:
  # The realm. Principal names are built from it (rwaltr@waltr.tech), and it is
  # immutable after the first initialisation — changing it means a fresh volume.
  #
  # It is deliberately the apex rather than `idm.waltr.tech`: the realm is the
  # identity namespace for everything in this house, and there is no reason for
  # it to carry the name of one of the services that speaks it.
  #
  # The realm is also the WebAuthn RP ID, which is why the apex is the right
  # choice and not merely the tidy one: an RP ID of `waltr.tech` covers
  # `idm.waltr.tech`, so passkeys keep working from the subdomain, and they
  # survive the UI moving again later.
  domain: waltr.tech
  # The URL the server is reached at. Kanidm requires the origin to match the
  # domain or descend from it — "if these two items are not consistent, the
  # server WILL refuse to start" — so this is the same relationship the RP ID
  # above depends on, expressed the other way round.
  origin: https://idm.waltr.tech
  # OAuth2 clients live with the applications that use them, so the operator has to
  # be told which namespaces to look in. Unset means "only this namespace", which
  # is why a client resource anywhere else silently does nothing but warn:
  #
  #   Warning ResourceNotWatched: configure `oauth2ClientNamespaceSelector`
  #   on Kanidm resource to watch this namespace
  #
  # Listed by name rather than `{}` (every namespace) on purpose: an empty selector
  # would let any namespace in the cluster mint an identity provider client. The
  # list is short and a new namespace is one line, reviewed like anything else.
  #
  # Persons and groups deliberately keep the default — those are identity-domain
  # objects and stay in this namespace.
  oauth2ClientNamespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - default
          - kritika
          - o11y
          - renovate
          - kopiur-system
  tlsSecretName: kanidm-tls
  # Pinned to the version the operator supports, not to "newest".
  #
  # The operator's default is `kanidm/server:latest`, which resolved to 1.12.1 —
  # one minor version ahead of what kaniop 0.23.0 can drive. Its client SDK is
  # 1.11.2, and Kanidm 1.12 support is still an open issue upstream (#1141). The
  # mismatch is not cosmetic: the server's access-control behaviour changed
  # enough that the operator could create an entry but not read it back, so it
  # concluded every object was missing and looped on 403s.
  #
  # Worth knowing: the operator's own compatibility check reported this image as
  # "compatible / upgrade-check passed" while `kanidmd domain upgrade-check`
  # was failing to exec inside the pod. The check that should have caught the
  # mismatch degrades to a pass. Verify versions by hand after any bump.
  #
  # Kanidm cannot be downgraded once its database has migrated, so moving to a
  # newer server line requires a fresh volume — see docs/kanidm.md.
  image: kanidm/server:1.12.2
  replicaGroups:
    - name: default
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          # Kanidm is a Rust server with a small resident set; this is headroom,
          # not a measurement.
          memory: 512Mi
  # Not optional. With no storage specified the operator uses an EmptyDir, so
  # the identity database would live in a scratch directory and vanish with the
  # pod — silent data loss on the first restart or node drain.
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: openebs-hostpath
        resources:
          requests:
            storage: 5Gi
  gateway:
    parentRefs:
      - name: envoy-internal
        namespace: network
        # The https listener. The http listener on this gateway only accepts
        # routes from the network namespace, and Kanidm needs TLS regardless.
        port: 443
      # The public listener. Its https allowedRoutes is `from: All`, so this
      # attaches from the identity namespace without a gateway-side change.
      #
      # This is also what publishes the DNS record: external-dns runs with
      # `--gateway-name=envoy-external` and ignores every other gateway, so the
      # internal route alone keeps the hostname out of the public zone.
      - name: envoy-external
        namespace: network
        port: 443
    hostnames:
      - idm.waltr.tech
    # The gateway must validate the server's certificate on the way in. It is a
    # publicly trusted Let's Encrypt certificate, so the system trust store is
    # the whole configuration.
    #
    # `hostname` has to be named explicitly. Left unset, the operator defaults it
    # to `spec.domain` — the realm, `waltr.tech` — while the server presents the
    # certificate for the origin host, `idm.waltr.tech`. The two do not match, so
    # the handshake fails with `certificate_unknown` and the route answers 503
    # while looking perfectly healthy: accepted, resolved, backend pod ready.
    backendTlsPolicy:
      validation:
        hostname: idm.waltr.tech
        wellKnownCaCertificates: System
