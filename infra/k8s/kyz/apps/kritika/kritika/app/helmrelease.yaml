---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# kritika — AI pull request reviewer for git.waltr.tech. See docs/kritika.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kritika
spec:
  chartRef:
    kind: OCIRepository
    name: kritika
  interval: 1h
  values:
    config:
      # Internal only (envoy-internal + tailnet): the only forge is Forgejo,
      # which is in this cluster, so nothing outside needs to reach the webhooks.
      webUrl: https://kritika.waltr.tech
      auth:
        admin:
          password: { env: ADMIN_PASSWORD }
      forgejo:
        # The connection's name is its webhook path: /hooks/forgejo.
        forgejo:
          host: git.waltr.tech
          accounts: [rwaltr]
          # The `kritika` user's Authorized Integrations (docs/kritika.md). Not
          # secret; Forgejo shows them once saved, and saving needs kritika
          # already serving this key's public half — hence a second commit.
          # `kritika`: read:user, write:repository, write:issue.
          audience: u:3:8cb5d4f9-f44c-4abf-b279-7ffb30b73328
          # `kritika-runner`: read:repository — what runner pods fetch with.
          runnerAudience: u:3:6e468aaf-d16a-466e-a217-06d218c2a874
          privateKey: { env: FORGEJO_PRIVATE_KEY }
          webhookSecret: { env: FORGEJO_WEBHOOK_SECRET }
      providers:
        # The in-cluster LiteLLM gateway: one place for keys and spend.
        litellm:
          type: openai
          baseUrl: http://litellm.default.svc.cluster.local:4000/v1
          apiKey: { env: LITELLM_API_KEY }
          # LiteLLM reports no per-call cost, so kritika would show $0. These are
          # OpenRouter's prices for the model behind the alias, USD per 1M tokens
          # (from its /api/v1/models, 2026-11-18; re-check if spend looks off).
          pricing:
            deepseek-v4.1-flash: { input: 0.0507, output: 0.2028, cacheRead: 0.001 }
      review:
        model: litellm/deepseek-v4.1-flash
      egress:
        # git.waltr.tech resolves (split DNS) to the envoy-internal VIP. The
        # gateway refuses private addresses not listed here.
        allow: [10.10.100.11, "fdad:207a:f1ab:100::11"]

    database:
      owner:
        existingSecret: kritika-postgres-credentials
      app:
        existingSecret: kritika-postgres-app

    envFrom:
      - secretRef:
          name: kritika-credentials
    podAnnotations:
      secret.reloader.stakater.com/reload: kritika-credentials

    httpRoute:
      enabled: true
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: kritika
        gethomepage.dev/description: AI PR reviews
        gethomepage.dev/group: Utilities
        gethomepage.dev/icon: mdi-robot-outline
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
      hostnames:
        - kritika.waltr.tech

    runner:
      podTemplate:
        spec:
          # No sandboxed RuntimeClass on mouse (no gVisor/Kata). The runner is
          # still non-root, read-only, capability-free and fenced by the
          # NetworkPolicy to DNS + kritika's egress gateway.
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 2Gi }

    networkPolicy:
      # Plain NetworkPolicies, which Cilium enforces. Not the `cilium` flavor:
      # its runner policy sends DNS through Cilium's L7 DNS proxy, and on mouse
      # that proxy takes the queries and never answers (no FQDN cache entries),
      # so every runner timed out resolving the gateway.
      # shortcut: runners lose the `*.*.svc.cluster.local` DNS name filter (they
      # are still confined to DNS + the gateway); retry `cilium` after a Cilium
      # upgrade, or once the DNS proxy is debugged.
      type: default
      postgres:
        podSelector:
          cnpg.io/cluster: kritika-postgres
      # Policy applies after Service/VIP translation, so the gateway VIP and
      # Services are matched as their pods and container ports, not as the
      # Service port that the chart's 443 rule assumes.
      extraEgress:
        # git.waltr.tech -> envoy-internal pods (Forgejo API, git fetches).
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: network
              podSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: envoy-internal
          ports:
            - port: 10443
              protocol: TCP
        # LiteLLM.
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: default
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: litellm
          ports:
            - port: 4000
              protocol: TCP

    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
