---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# kritika's own credentials, from 1Password item `kritika` (written once by hand,
# see docs/kritika.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kritika-credentials
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: kritika
        property: password
    - secretKey: FORGEJO_WEBHOOK_SECRET
      remoteRef:
        key: kritika
        property: webhook_secret
    # The RSA key kritika signs Forgejo authorized-integration JWTs with. Forgejo
    # trusts it by the public half kritika serves, so rotating it is a staged
    # previousKey dance (docs/kritika.md), not a plain 1Password edit.
    - secretKey: FORGEJO_PRIVATE_KEY
      remoteRef:
        key: kritika
        property: forgejo_private_key
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Owner role (runs migrations; CNPG's bootstrap owner). `refreshInterval: "0"`:
# a generator mints a new value on every sync, and a rotating password would
# drift from the one CNPG set at bootstrap. Deleting the Secret mints a new one,
# which CNPG then applies to the role, and kritika picks up on restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-credentials
spec:
  refreshInterval: "0"
  target:
    name: kritika-postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika
        password: "{{ .password }}"
        uri: "postgres://kritika:{{ .password }}@kritika-postgres-rw.kritika.svc:5432/kritika?sslmode=require&connect_timeout=10"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: kritika-postgres
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Application role, applied by the DatabaseRole. Same generated-once rules as above.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-app
spec:
  refreshInterval: "0"
  target:
    name: kritika-postgres-app
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika_app
        password: "{{ .password }}"
        uri: "postgres://kritika_app:{{ .password }}@kritika-postgres-rw.kritika.svc:5432/kritika?sslmode=require&connect_timeout=10"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: kritika-postgres
