---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# renovate-operator (mogenius) — runs Renovate against git.waltr.tech as the
# Forgejo user `renovate`. See docs/renovate.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  interval: 1h
  values:
    fullnameOverride: renovate-operator
    route:
      enabled: true
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Renovate
        gethomepage.dev/description: Dependency updates
        gethomepage.dev/group: Utilities
        gethomepage.dev/icon: renovate.png
      hostnames:
        - renovate.waltr.tech
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
    webhook:
      enabled: true
      # Serve /webhook/v1/forgejo on the UI's hostname: one route, internal only.
      # Forgejo reaches it the way it reaches kritika (webhook.ALLOWED_HOST_LIST).
      unifiedWebhookHost: true
      baseUrlScheme: https
    auth:
      oidc:
        enabled: true
        issuerUrl: https://idm.waltr.tech/oauth2/openid/renovate-operator
        clientId: renovate-operator
        existingSecret: renovate-operator-kanidm-oauth2-credentials
        secretKey: CLIENT_SECRET
        redirectScheme: https
        additionalScopes: [groups]
    authorization:
      defaults:
        # Group names are lowercased before matching; Kanidm sends the SPN.
        adminGroups:
          - renovate_admins@waltr.tech
    policy:
      # Off by default upstream; on here so a RenovateJob can only point
      # Renovate (and its token) at our own forge and approved images.
      enabled: true
      allowedHosts:
        - git.waltr.tech
      allowedImages:
        - ghcr.io/renovatebot/renovate
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
