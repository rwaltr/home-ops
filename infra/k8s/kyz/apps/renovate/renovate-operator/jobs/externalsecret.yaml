---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# RENOVATE_TOKEN: the Forgejo user `renovate`'s access token (1Password item
# `renovate`, field `password`; write:repository, write:issue, read:user,
# read:organization). Minted once with `forgejo admin user generate-access-token`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: renovate-secret
  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: renovate
        property: password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The teletraan-x GitHub App's private key, for the token generator below.
# 1Password stores the PEM on one line with spaces for newlines; the template
# puts the line breaks back so it parses (verified: `openssl rsa -check` ok).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: teletraan-x-app-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: teletraan-x-app-key
    template:
      data:
        # Split on spaces and re-join with newlines, except inside the two
        # "-----BEGIN/END ... KEY-----" armour lines (4 words each). Written
        # without the literal armour text so the private-key hook stays quiet.
        pem: |-
          {{- $w := splitList " " (trim .pem) -}}
          {{- $n := len $w -}}
          {{ join " " (slice $w 0 4) }}
          {{ join "\n" (slice $w 4 (sub $n 4)) }}
          {{ join " " (slice $w (sub $n 4) $n) }}
  data:
    - secretKey: pem
      remoteRef:
        key: teletraan-x github app
        property: pem
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/githubaccesstoken_v1alpha1.json
# RENOVATE_GITHUB_COM_TOKEN: github.com lookups (release notes, github-tags/
# releases datasources) without the anonymous 60/h rate limit. Minted from the
# existing teletraan-x App rather than a PAT: an installation token lives one
# hour, is regenerated here every 45 minutes, and is cut to read-only.
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: renovate-github-com
spec:
  appID: "170547"
  installID: "23053210"
  permissions:
    contents: read
    metadata: read
  auth:
    privateKey:
      secretRef:
        name: teletraan-x-app-key
        key: pem
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-com
spec:
  # Installation tokens expire after 1h; refresh well inside that.
  refreshInterval: 45m
  target:
    name: renovate-github-com
    template:
      data:
        RENOVATE_GITHUB_COM_TOKEN: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: renovate-github-com
