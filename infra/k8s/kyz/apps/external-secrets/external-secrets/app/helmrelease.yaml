---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  chartRef:
    kind: OCIRepository
    name: external-secrets
  interval: 1h
  values:
    leaderElect: true
    serviceMonitor:
      enabled: true
    grafanaDashboard:
      enabled: true
    # Memory requests from the 30d working-set audit (docs/memory-requests.md).
    # Controller, cert-controller and webhook were all BestEffort before this.
    resources:
      requests:
        memory: 96Mi
      limits:
        memory: 256Mi
    certController:
      resources:
        requests:
          memory: 96Mi
        limits:
          memory: 256Mi
    webhook:
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 256Mi
      replicaCount: 2
