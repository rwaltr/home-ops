---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: media-restore
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: media-restore
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: media-restore
  namespace: default
subjects:
  - kind: ServiceAccount
    name: media-restore
    namespace: default
roleRef:
  kind: Role
  name: media-restore
  apiGroup: rbac.authorization.k8s.io
---
# Safety net: bring Jellyfin back online and un-suspend Flux at the end of the
# transcode window, even if the job is still running or wedged.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyfin-restore
  namespace: default
spec:
  schedule: "50 5 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: media-restore
          restartPolicy: OnFailure
          containers:
            - name: restore
              image: bitnami/kubectl:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  kubectl -n default scale deployment/jellyfin --replicas=1
                  kubectl -n default patch kustomization jellyfin --type merge -p '{"spec":{"suspend":false}}'
                  echo "jellyfin restored and flux resumed"