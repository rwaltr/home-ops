---
# Forgejo Actions twin of .github/workflows/lint.yml. Runs on the in-cluster runner
# (infra/k8s/kyz/apps/actions-runner); `uses:` resolves against github.com because
# Forgejo's DEFAULT_ACTIONS_URL is GitHub, so the pinned actions are the same ones.
name: "Lint"

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  lint:
    name: mise run lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Agent skills (helmfile, pitchfork) are fetched from raw.githubusercontent.com
      # and a failed fetch fails `mise install` — and every later mise call, which
      # re-checks installs. CI never uses skills. Job-level so all steps see it.
      MISE_SKILLS_FETCH: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true
          # On Forgejo, `github.token` is a *Forgejo* job token. mise would send it
          # to github.com, where it is invalid, so the action must not pass it on.
          github_token: ""

      - name: Lint
        # GITHUB_TOKEN is the Forgejo job token here. zizmor's online audits send it
        # to github.com and get a 401; an *empty* value is rejected outright, so it
        # has to be unset rather than blanked.
        run: |
          unset GITHUB_TOKEN
          mise run lint
